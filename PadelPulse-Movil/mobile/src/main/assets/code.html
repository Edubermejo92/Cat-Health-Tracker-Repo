function voz(){ return VOZ[S.lang] || VOZ.es; }

/**
 * El marcador cantado tal y como esta ahora mismo.
 *
 * Se canta primero el punto de quien saca, que es como se canta en pista.
 * Devuelve '' cuando no hay nada que cantar.
 */
function marcadorCantado(est, idioma){
    const v = idioma ? (VOZ[idioma] || VOZ.es) : voz();

    /* Sin argumentos lee el partido de verdad. Con uno, cualquier situacion
       inventada: asi la ficha de Ajustes puede enseñar ejemplos salidos de
       esta misma funcion, y no se pueden desfasar de lo que se oye. */
    const e = est || {
        tb: !!(S.superTiebreak || S.tiebreak),
        tbA: S.tiebreakPoints.A|0, tbB: S.tiebreakPoints.B|0,
        pa: S.teamA.points|0, pb: S.teamB.points|0,
        saca: S.serving,
        ventaja: S.advantage ? S['team'+S.advantage].name : '',
        deuce: !!S.deuce
    };

    if(e.tb){
        const saca  = e.saca==='A' ? e.tbA : e.tbB;
        const resto = e.saca==='A' ? e.tbB : e.tbA;
        return saca + ' - ' + resto;
    }

    if(e.ventaja) return v.ventaja + ' ' + e.ventaja + '.';
    if(e.deuce)   return v.iguales + '.';

    // Mismo punto por debajo de 40: "treinta iguales"
    if(e.pa === e.pb && e.pa < 3) return v.p[e.pa] + ' ' + v.ambos + '.';

    const saca  = e.saca==='A' ? e.pa : e.pb;
    const resto = e.saca==='A' ? e.pb : e.pa;
    return v.p[Math.min(3, saca)] + ', ' + v.p[Math.min(3, resto)] + '.';
}

/** Canta el marcador. Se llama al sumar un punto, se pulse o se diga. */
function cantarMarcador(){
    const txt = marcadorCantado();
    if(txt) speak(txt);
}

/** Foto del marcador, para comparar antes y despues de un punto. */
function fotoDelMarcador(){
    return {
        gA: S.teamA.games|0,
        gB: S.teamB.games|0,
        sets: (S.setsHistory||[]).length,
        tb: !!(S.tiebreak || S.superTiebreak),
        fin: !!S.matchOver
    };
}

/**
 * Canta lo que ha pasado con este punto.
 *
 * No vale con cantar el marcador tal cual: cuando un punto cierra un juego o
 * un set, los puntos y los juegos ya se han puesto a cero, asi que cantar el
 * estado decia "cero iguales" justo en el momento mas importante del partido.
 * Hay que mirar QUE ha cambiado, no solo como ha quedado.
 *
 * El orden importa: cerrar un set tambien pone los juegos a cero, asi que se
 * mira primero el set.
 */
function cantarLoQuePaso(antes){
    const v = voz();
    const ahora = fotoDelMarcador();

    // 1. Se acabo el partido: lo canta el cartel de final, no repetimos.
    if(ahora.fin && !antes.fin) return;

    // 2. Se acabo un set. Se canta con el ganador delante, como en pista.
    if(ahora.sets > antes.sets){
        const s = S.setsHistory[ahora.sets - 1];
        const quien = S['team' + s.winner].name;
        let gan = s.winner === 'A' ? s.a : s.b;
        let per = s.winner === 'A' ? s.b : s.a;
        /* Un set de tie-break se guarda como 6-6 con los puntos del desempate
           aparte, pero nadie gana un set "seis a seis": se canta 7-6. El super
           tie-break guarda sus propios puntos (10-8) y ese si va tal cual. */
        if(gan === per) gan = gan + 1;
        speak(`${v.set} ${quien}. ${gan} - ${per}. ${S['team'+S.serving].name} ${v.saca}.`);
        return;
    }

    // 3. Se acabo un juego. Si ademas se entra en tie-break, se avisa.
    if(ahora.gA !== antes.gA || ahora.gB !== antes.gB){
        const quien = S['team' + (ahora.gA > antes.gA ? 'A' : 'B')].name;
        const entraTb = ahora.tb && !antes.tb;
        speak(`${v.juego} ${quien}. ${ahora.gA} - ${ahora.gB}.` + (entraTb ? ` ${i('tiebreak')}.` : '')
              + ` ${S['team'+S.serving].name} ${v.saca}.`);
        return;
    }

    // 4. Un punto normal.
    cantarMarcador();
}

/** Silenciar o volver a oir la voz que canta los puntos (marcador y Ajustes). */
function toggleVoiceMute(){
    S.voiceMuted = !S.voiceMuted;
    if(S.voiceMuted){
        try{ const b=window.AndroidBridge; if(b && b.stopSpeaking) b.stopSpeaking(); }catch(e){}
        try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
    }
    saveState(); render();
    showToast(S.voiceMuted ? '🔇 '+i2('Voz silenciada','Voice muted') : '🔊 '+i2('Voz activada','Voice on'), 1600);
    if(!S.voiceMuted) cantarMarcador();
}

function speak(text){
    // Voz silenciada: los pitidos siguen, lo que no se canta es el marcador
    if(!S.soundEnabled || S.voiceMuted || !text) return;

    // Se apunta lo que vamos a decir para no obedecerlo si el microfono lo oye.
    _ultimoCanto = normalizarVoz(text);
    _ultimoCantoAt = Date.now();

    // El microfono no debe oir a la propia app cantando el punto
    const estimatedMs = Math.max(2000, text.length * 90);
    _speakingUntil = Date.now() + estimatedMs;
    _cmdLock = _speakingUntil;

    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    if(b && b.speak){
        if(b.setVoiceVolume) b.setVoiceVolume(voiceVolume());
        // speakIn canta en el idioma de la app; speak es el de las versiones
        // viejas del puente, que hablaba siempre en español.
        if(b.speakIn) b.speakIn(text, currentLang().voice);
        else b.speak(text);
        return;
    }

    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang=currentLang().voice; utt.rate=0.92; utt.pitch=1.0;
    utt.volume = voiceVolume()/100;
    const voices = window.speechSynthesis.getVoices();
    const langVoice = voices.find(v=>v.lang.startsWith(currentLang().voice.split('-')[0]));
    if(langVoice) utt.voice=langVoice;
    /* La estimacion por longitud se queda corta a menudo y el reconocedor
       suelta la frase cuando ya se ha levantado el candado. Atarse al
       principio y al final de verdad es lo unico fiable. */
    utt.onstart = () => {
        const largo = Date.now() + 15000;   // se corrige en onend
        _speakingUntil = largo;
        _cmdLock = largo;
    };
    const soltar = () => {
        const extra = Date.now() + 1500;
        _speakingUntil = extra;
        _cmdLock = extra;
        _ultimoCantoAt = Date.now();        // la ventana del eco cuenta desde aqui
    };
    utt.onend = soltar;
    utt.onerror = soltar;                   // si falla, que no deje el micro mudo
    window.speechSynthesis.speak(utt);
}

// Entiende cualquier frase de pádel en todos los idiomas
// ═══════════════════════════════════════════
// ═══════════════════════════════════════════
// VOZ: gramatica e interprete comunes con el reloj
// ═══════════════════════════════════════════
// No editar entre las marcas: lo escribe tools/sync-voice.sh desde

/**
 * Interprete de voz del marcador, comun al movil y al reloj.
 *
 * El reloj tiene una copia exacta de esta logica en Kotlin (VoiceParser.kt) y
 * los dos leen la misma gramatica (tools/voice_grammar.json). Si cambias algo
 * aqui, cambialo alli: tools/probar-voz.sh pasa las mismas frases por los dos
 * y falla si no dicen lo mismo.
 *
 * parse(frase, idioma, nombres) devuelve una accion o null:
 *   {type:'point', team}          team: 'A' | 'B' | 'SRV' (saque) | 'RCV' (resto) | null (no se sabe de quien)
 *   {type:'score', a, b}          0..3 = 0, 15, 30, 40; 3-3 son iguales
 *   {type:'adv', team}  {type:'game', team}  {type:'set', team}  {type:'serve', team}
 *   {type:'undo'} {type:'fault'} {type:'doubleFault'} {type:'newMatch'} {type:'query'}
 */
const VoiceParser = {
    g: null, _cache: {},

    init(grammar){ this.g = grammar; this._cache = {}; },

    norm(s){
        return String(s||'')
            .replace(/[٠-٩]/g, d => String(d.charCodeAt(0)-0x0660))
            .replace(/[۰-۹]/g, d => String(d.charCodeAt(0)-0x06F0))
            .normalize('NFKD').replace(/\p{M}+/gu,'').normalize('NFC')
            .toLowerCase().replace(/ß/g,'ss')
            .replace(/[^\p{L}\p{N}]+/gu,' ').trim();
    },

    lang(code){
        if(this._cache[code]) return this._cache[code];
        const src = this.g.langs[code] || this.g.langs.en;
        const out = { sub: !!src.sub };
        Object.keys(src).forEach(k => {
            if(Array.isArray(src[k])) out[k] = src[k].map(x=>this.norm(x)).filter(Boolean);
        });
        return (this._cache[code] = out);
    },

    /** Donde aparece la frase: [inicio, fin] en t. Sin espacios (chino...) vale dentro de palabra. */
    find(t, p, sub){
        const res = [];
        if(!p) return res;
        if(sub){
            let i = t.indexOf(p);
            while(i >= 0){ res.push([i, i+p.length]); i = t.indexOf(p, i+1); }
        }else{
            const T = ' '+t+' ', P = ' '+p+' ';
            let i = T.indexOf(P);
            while(i >= 0){ res.push([i, i+p.length]); i = T.indexOf(P, i+1); }
        }
        return res;
    },

    has(t, list, sub){ return (list||[]).some(p => this.find(t, p, sub).length > 0); },

    /** Puntos dichos en orden: 0, 15, 30, 40 en palabras del idioma o en cifras. */
    numbers(t, G){
        const hits = [];
        ['zero','fifteen','thirty','forty'].forEach((k, v) => {
            (G[k]||[]).forEach(p => this.find(t, p, G.sub).forEach(([s,e]) => hits.push([s,e,v])));
        });
        const re = /\d+/g; let m;
        const val = {'0':0,'00':0,'15':1,'30':2,'40':3};
        while((m = re.exec(t))){ if(m[0] in val) hits.push([m.index, m.index+m[0].length, val[m[0]]]); }
        hits.sort((x,y) => x[0]-y[0] || (y[1]-y[0])-(x[1]-x[0]));
        const out = []; let end = -1;
        hits.forEach(h => { if(h[0] >= end){ out.push(h[2]); end = h[1]; } });
        return out;
    },

    side(t, G, names, letters){
        const sub = G.sub, min = sub ? 2 : 3;
        const byName = list => (list||[]).some(n => { const x = this.norm(n); return x.length >= min && this.find(t, x, sub).length > 0; });
        let a = this.has(t, G.teamA, sub) || byName(names && names.A);
        let b = this.has(t, G.teamB, sub) || byName(names && names.B);
        if(!a && !b && letters && !sub){
            const toks = t.split(' ');
            const last = toks[toks.length-1];
            if(toks.length >= 2){
                if(this.g.letterA.includes(last)) a = true;
                else if(this.g.letterB.includes(last)) b = true;
            }
        }
        return (a && !b) ? 'A' : (b && !a) ? 'B' : null;
    },

    parse(text, code, names){
        if(!this.g) return null;
        const G = this.lang(code), sub = G.sub;
        const t = this.norm(text);
        if(!t) return null;
        const h = list => this.has(t, list, sub);
        const kw = h(G.point) || h(G.game) || h(G.set) || h(G.advantage) || h(G.serveChange);

        if(h(G.undo)) return {type:'undo'};
        if(h(G.newMatch)) return {type:'newMatch'};
        if(h(G.query)) return {type:'query'};
        if(h(G.doubleFault)) return {type:'doubleFault'};
        if(h(G.fault)) return {type:'fault'};
        if(h(G.serveChange)) return {type:'serve', team: this.side(t, G, names, true)};
        if(h(G.advantage)){
            const team = this.side(t, G, names, true) || (h(G.receiver) ? 'RCV' : h(G.server) ? 'SRV' : null);
            return {type:'adv', team};
        }
        const n = this.numbers(t, G);
        if(n.length >= 2) return {type:'score', a:n[0], b:n[1]};
        if(n.length === 1 && h(G.all)) return {type:'score', a:n[0], b:n[0]};
        if(n.length === 0 && h(G.deuce)) return {type:'score', a:3, b:3};
        if(h(G.game)) return {type:'game', team: this.side(t, G, names, true)};
        if(h(G.set)) return {type:'set', team: this.side(t, G, names, true)};
        const team = this.side(t, G, names, kw);
        if(team) return {type:'point', team};
        if(h(G.receiver)) return {type:'point', team:'RCV'};
        if(h(G.server)) return {type:'point', team:'SRV'};
        if(h(G.point)) return {type:'point', team:null};
        return null;
    }
};
if(typeof module !== 'undefined') module.exports = VoiceParser;

/** Nombres por los que se puede cantar a cada pareja: la pareja y sus dos jugadores. */
function voiceNames(){
    return {
        A: [S.teamA.name, S.teamA.playerA, S.teamA.playerB].filter(Boolean),
        B: [S.teamB.name, S.teamB.playerA, S.teamB.playerB].filter(Boolean)
    };
}

/** "¿Para quien?" cuando se canta algo sin decir de que pareja es. */
const VOZ_PREGUNTA = {es:'¿Para quién?', en:'For whom?', it:'Per chi?', fr:'Pour qui ?', de:'Für wen?',
    fi:'Kenelle?', zh:'给哪一队？', ja:'どちらのチーム？', ar:'لأي فريق؟', pt:'Para quem?', nl:'Voor wie?',
    sv:'Till vem?', ru:'Кому?', ko:'어느 팀?'};

/**
 * Ejecuta lo que ha entendido VoiceParser. Hace lo mismo que el boton
 * equivalente de la pantalla, asi que el reloj se entera por el estado.
 */
function applyVoiceAction(r){
    const srv = S.serving, rcv = srv==='A' ? 'B' : 'A';
    const team = r.team==='SRV' ? srv : r.team==='RCV' ? rcv : r.team;
    const v = voz();
    const nombre = x => S['team'+x].name;
    const preguntar = () => { speak(VOZ_PREGUNTA[S.lang] || VOZ_PREGUNTA.en); showToast('🎙️ ' + (VOZ_PREGUNTA[S.lang] || VOZ_PREGUNTA.en), 2500); return true; };
    switch(r.type){
        case 'undo':
            speak(i('undo')+'.'); showToast('↩️ '+i('undo'));
            setTimeout(()=>undoPoint(), 50); return true;
        case 'newMatch': newMatch(); return true;
        case 'query': {
            const txt = marcadorCantado() || (S.teamA.games+' - '+S.teamB.games);
            speak(txt); showToast('📊 '+txt, 3000); return true;
        }
        case 'doubleFault':
            speak(i('doubleFault')+'.'); showToast('🎙️ '+i('doubleFault'));
            setTimeout(()=>addFault(srv,'doubleFault'), 50); return true;
        case 'fault':
            // Igual que el boton FALTA: primera falta, y la segunda es doble falta
            speak(i('fault')+'.'); showToast('🎙️ '+i('fault'));
            setTimeout(()=>addFault(srv,'footFault'), 50); return true;
        case 'serve': {
            const quien = team || rcv;
            snapshot(); S.serving = quien; S.firstServeFault = false;
            speak(nombre(quien)+' '+v.saca+'.'); showToast('🎾 '+nombre(quien)+' '+v.saca);
            saveState(); render(); return true;
        }
        case 'adv':
            if(!team) return preguntar();
            if(!S.deuce){ addPoint(team); return true; }
            snapshot(); S.advantage = team; soundPoint();
            speak(v.ventaja+' '+nombre(team)+'.'); saveState(); render(); return true;
        case 'score': {
            if(S.tiebreak || S.superTiebreak){ showToast('⚠️ Tie-break', 2000); return true; }
            snapshot();
            S.teamA.points = r.a; S.teamB.points = r.b;
            S.deuce = (r.a===3 && r.b===3); S.advantage = null;
            cantarMarcador();
            showToast('🎙️ '+getScoreDisplay().scoreA+' - '+getScoreDisplay().scoreB);
            saveState(); render(); return true;
        }
        case 'game':
            if(!team) return preguntar();
            winGame(team); speak(v.juego+' '+nombre(team)+'.'); showToast('🏆 '+v.juego+' '+nombre(team)); return true;
        case 'set':
            if(!team) return preguntar();
            winSet(team, S.teamA.games, S.teamB.games, false);
            speak(v.set+' '+nombre(team)+'.'); showToast('🏆 '+v.set+' '+nombre(team)); return true;
        case 'point':
            if(!team) return preguntar();
            addPoint(team); return true;
    }
    return false;
}

/**
 * El microfono nativo manda todas las transcripciones posibles, de mas a
 * menos probable. Vale la primera que se entienda del todo: "punto para
 * Edu" puede llegar como "punto para edú" o "punto para él" y solo una sirve.
 */
function processVoiceAlternatives(lista){
    lista = (lista||[]).map(x=>String(x||'')).filter(Boolean);
    if(!lista.length) return;
    if(!vozAceptada(lista[0])) return;
    const nombres = voiceNames();
    const completa = r => r && !(['point','adv','game','set'].includes(r.type) && !r.team);
    for(const alt of lista){
        const r = VoiceParser.parse(alt, S.lang||'es', nombres);
        if(completa(r)){
            _speakingUntil = _cmdLock = Date.now() + CMD_LOCK_MS;
            applyVoiceAction(r);
            if(!S.soundEnabled) setTimeout(()=>showScoreAnnounce('', null), 80);
            return;
        }
    }
    // Ninguna del todo clara: la mas probable, por el camino de siempre
    _ultimaFrase = '';
    processVoiceCommand(lista[0]);
}

async function processVoiceCommand(txt){
    // 0. Filtrar ecos y repeticiones. Vale para los dos caminos: el microfono
    //    continuo de Android y el del navegador.
    if(!vozAceptada(txt)) return;

    // 1. Las reglas locales: instantaneas y sin red, que es lo que hace falta
    //    en una pista. Son las unicas que hay.
    if(processVoiceLocal(txt)){
        if(!S.soundEnabled) setTimeout(()=>showScoreAnnounce('', null), 80);
        return;
    }

    // 2. No se ha entendido. Se dice lo que se oyo, para que se vea por que.
    showToast('🎙️ "'+txt+'"', 2000);
    showScoreAnnounce(i2('No reconocido','Not recognised'),
                      i2('Di "punto A", "juego B", "falta"...','Say "point A", "game B", "fault"...'));
}

function processVoiceLocal(txt){
    const nA=S.teamA.name.toLowerCase().trim();
    const nB=S.teamB.name.toLowerCase().trim();
    const srv=S.serving, rstr=srv==='A'?'B':'A';
    const t=txt.toLowerCase().replace(/[-–—]/g,' ').replace(/\s+/g,' ').trim();

    // Bloquear mic inmediatamente para evitar doble disparo en cualquier comando
    _speakingUntil = Date.now() + CMD_LOCK_MS;
    _cmdLock = _speakingUntil;

    // Primero la gramatica comun con el reloj, en el idioma de la app: la
    // misma frase hace lo mismo en los dos. Lo de abajo queda por si acaso.
    const accion = VoiceParser.parse(txt, S.lang||'es', voiceNames());
    if(accion) return applyVoiceAction(accion);

    // ── DESHACER ──
    if(/\b(deshacer|error|anula|anular|volver|atrás|cancela|repetir|repite|undo|annul|annulla|annuler|rückgängig|peruuta)\b/.test(t)){
        speak(i('undo')+'.'); showToast('↩️ '+i('undo'));
        setTimeout(()=>undoPoint(), 50);
        return true;
    }

    // ── FIN / NUEVA PARTIDA ──
    if(/\b(finalizar|terminar partido|fin del partido|end match|match over|fine partita|fin du match|spiel beenden|peli loppuu)\b/.test(t)){
        endMatch(); return true;
    }
    if(/\b(nueva partida|nuevo partido|nuevo juego|new match|nuovo incontro|nouveau match|neues spiel|uusi ottelu)\b/.test(t)){
        newMatch(); return true;
    }

    /* ── JUEGO y SET ──────────────────────────────────────────────────────
     * Antes habia que nombrar al equipo si o si: "juego" a secas no hacia
     * nada y encima no avisaba de nada, asi que parecia que la voz estaba
     * rota. Ahora se aceptan mas formas de nombrarlos y, si aun asi no queda
     * claro de quien es, la app lo dice en vez de callarse.
     */
    const esA = /\b(equipo a|pareja a|primero|primera|para a|al uno|al primero|uno|nosotros|local|locales|team a)\b/.test(t)
                || (nA.length>=3 && t.includes(nA));
    const esB = /\b(equipo b|pareja b|segundo|segunda|para b|al dos|al segundo|dos|ellos|vosotros|visita|visitante|visitantes|team b)\b/.test(t)
                || (nB.length>=3 && t.includes(nB));

    if(/\b(juego|game|gioco|jeu|spiel|peli)\b/.test(t) && !/\b(nuevo|nueva|new)\b/.test(t)){
        const quien = /\bjuego a\b/.test(t) ? 'A'
                    : /\bjuego b\b/.test(t) ? 'B'
                    : (esA && !esB) ? 'A'
                    : (esB && !esA) ? 'B' : null;
        if(quien){
            const nombre = S['team'+quien].name;
            winGame(quien); speak(voz().juego+' '+nombre+'.'); showToast('🏆 '+voz().juego+' '+nombre);
        }else{
            speak(i2('De quien es el juego?','Whose game?'));
            showToast('🎙️ ' + i2('Di "juego A" o "juego B"','Say "game A" or "game B"'), 3000);
        }
        return true;
    }

    if(/\bset\b/.test(t)){
        const quien = /\bset a\b/.test(t) ? 'A'
                    : /\bset b\b/.test(t) ? 'B'
                    : (esA && !esB) ? 'A'
                    : (esB && !esA) ? 'B' : null;
        if(quien){
            const nombre = S['team'+quien].name;
            winSet(quien, S.teamA.games, S.teamB.games, false);
            speak(voz().set+' '+nombre+'.'); showToast('🏆 '+voz().set+' '+nombre);
        }else{
            speak(i2('De quien es el set?','Whose set?'));
            showToast('🎙️ ' + i2('Di "set A" o "set B"','Say "set A" or "set B"'), 3000);
        }
        return true;
    }

    // ── DOBLE FALTA ──
    if(/\b(doble falta|double fault|doppio fallo|double faute|doppelfehler|kaksoishuti)\b/.test(t)){
        const f = (nB.length>=3&&t.includes(nB))||/\b(equipo b|pareja b|segundo|team b|ellos)\b/.test(t)?'B':
                  (nA.length>=3&&t.includes(nA))||/\b(equipo a|pareja a|primero|team a|nosotros)\b/.test(t)?'A':srv;
        // Hablar PRIMERO para bloquear el micrófono antes de que addFault procese
        speak(i('doubleFault')+'.');
        showToast('🎙️ '+i('doubleFault'));
        // Pequeño delay para asegurar que _speakingUntil está activo
        setTimeout(()=>addFault(f,'doubleFault'), 50);
        return true;
    }

    // ── FALTA PIE / RED ──
    if(/\b(falta de pie|foot fault|pie|falta pie|footfault|red|net|en la red|toca la red)\b/.test(t)&&!/doble/.test(t)){
        const f = (nB.length>=3&&t.includes(nB))||/\b(equipo b|pareja b|segundo)\b/.test(t)?'B':
                  (nA.length>=3&&t.includes(nA))||/\b(equipo a|pareja a|primero)\b/.test(t)?'A':srv;
        speak(i('footFault')+'.'); showToast('🎙️ '+i('footFault'));
        setTimeout(()=>addFault(f,'footFault'), 50);
        return true;
    }

    // ── FALTA SIMPLE ──
    if(/^falta$|^fault$|^fallo$/.test(t)){
        const f = (nB.length>=3&&t.includes(nB))||/\b(equipo b|pareja b|segundo)\b/.test(t)?'B':
                  (nA.length>=3&&t.includes(nA))||/\b(equipo a|pareja a|primero)\b/.test(t)?'A':srv;
        speak(i('fault')+'.'); showToast('🎙️ '+i('fault'));
        setTimeout(()=>addFault(f,'footFault'), 50);
        return true;
    }

    // ── CONSULTA MARCADOR ──
    if(/\b(cómo vamos|como vamos|resultado|marcador|cuánto van|cuanto van|quién va|quien va|qué marcador|que marcador|cuál es|cual es|dime el|score|how.*score|what.*score|punteggio|résultat|ergebnis|tulos)\b/.test(t)){
        const m=getMatchContext();
        const msg=`${m.pointsA} a ${m.pointsB}. Juegos ${m.gamesA} a ${m.gamesB}.`;
        speak(msg);
        showToast('📊 '+msg,4000);
        // Siempre mostrar visual, con o sin sonido
        setTimeout(()=>showScoreAnnounce('📊 Marcador', 'Juegos '+m.gamesA+' — '+m.gamesB), 50);
        return true;
    }

    // ── MARCADOR ESPECÍFICO ("30 iguales", "quince treinta", etc.) ──
    const scoreResult = matchScoreVoice(t);
    if(scoreResult !== null){
        const {p1, p2, isDeuce, advSrv, advRstr} = scoreResult;
        if(S.tiebreak||S.superTiebreak){ showToast('⚠️ Tiebreak activo',2000); return true; }
        snapshot();
        if(isDeuce){
            S.teamA.points=3; S.teamB.points=3; S.deuce=true; S.advantage=null;
        } else if(advSrv){
            S.teamA.points=3; S.teamB.points=3; S.deuce=true; S.advantage=srv;
        } else if(advRstr){
            S.teamA.points=3; S.teamB.points=3; S.deuce=true; S.advantage=rstr;
        } else {
            /* El orden es el del MARCADOR, no el del saque: dices "cuarenta
               treinta" mirando la pantalla, asi que el primer numero es el de
               la pareja A. Antes el primero se le daba a quien sacaba, asi que
               con el saque en la B salia del reves. */
            S.teamA.points = p1;
            S.teamB.points = p2;
            S.deuce = (p1===3 && p2===3); S.advantage = null;
        }
        const lab=getScoreDisplay();
        speak(lab.scoreA+' — '+lab.scoreB);
        showToast('🎙️ '+lab.scoreA+' - '+lab.scoreB);
        saveState(); render(); return true;
    }

    // ── VENTAJA SAQUE ──
    if(/\b(ventaja saque|ventaja servicio|ventaja al saque|ventaja servidor|advantage server|advantage in|ad in|vantaggio servizio)\b/.test(t)){
        if(!S.deuce){ addPoint(srv); } else { S.advantage=srv; soundPoint(); render(); saveState(); }
        speak('Ventaja '+S['team'+srv].name+'.'); return true;
    }
    // ── VENTAJA RESTO ──
    if(/\b(ventaja resto|ventaja receptor|ventaja al resto|advantage receiver|advantage out|ad out|vantaggio ricezione)\b/.test(t)){
        if(!S.deuce){ addPoint(rstr); } else { S.advantage=rstr; soundPoint(); render(); saveState(); }
        speak('Ventaja '+S['team'+rstr].name+'.'); return true;
    }

    // ── PUNTO SAQUE ──
    if(/\b(punto.*saque|punto.*servicio|al saque|saque directo|ace|ganó.*saque|gana.*saque|point.*serv|winner.*serv)\b/.test(t)||
       t==='saque'||t==='servicio'||t==='serve'){
        addPoint(srv); return true;
    }

    // ── PUNTO RESTO / BREAK ──
    if(/\b(punto.*resto|punto.*receptor|al resto|break|gana.*resto|ganó.*resto|point.*return|point.*receiver)\b/.test(t)||
       t==='resto'||t==='return'||t==='break'){
        addPoint(rstr); return true;
    }

    // ── PUNTO POR NOMBRE / EQUIPO ──
    // Frases ES: "punto a", "punto pareja a", "punto equipo b", "ganamos", "punto para nosotros"
    // Cuidado: no activar si ya lo capturó juego/set/falta arriba
    const puntoA = [
        /\b(punto equipo a|punto pareja a|punto para a|gana equipo a|gana pareja a|punto al primero|gana el primero|lo ganamos|ganamos|punto nuestro)\b/,
        /\bpunto\b.*\ba\b$/,
    ];
    const puntoB = [
        /\b(punto equipo b|punto pareja b|punto para b|gana equipo b|gana pareja b|punto al segundo|gana el segundo|punto de ellos)\b/,
        /\bpunto\b.*\bb\b$/,
    ];

    if(puntoA.some(r=>r.test(t))){ addPoint('A'); return true; }
    if(puntoB.some(r=>r.test(t))){ addPoint('B'); return true; }

    // Por nombre de equipo (mínimo 3 letras, que no sea un comando anterior)
    if(nA.length>=3&&t.includes(nA)&&!/\b(juego|set|falta|doble)\b/.test(t)){ addPoint('A'); return true; }
    if(nB.length>=3&&t.includes(nB)&&!/\b(juego|set|falta|doble)\b/.test(t)){ addPoint('B'); return true; }

    // ── PUNTO GENÉRICO (gana quien sirve) ──
    if(/^(punto|point|punto!)$/.test(t)){ addPoint(srv); return true; }

    return false;
}

// ── Parser de marcadores hablados ──
// Entiende frases como: "30 iguales", "quince treinta", "vamos 15 a 30",
// "cuarenta iguales" (=deuce), "iguales", "deuce", etc.
function matchScoreVoice(t){

    // ── Mapa de palabras → índice de punto (0=0, 1=15, 2=30, 3=40) ──
    const W = {
        // Español
        'cero':0,'nada':0,'cero a cero':0,
        'quince':1,'quinze':1,
        'treinta':2,
        'cuarenta':3,
        // Inglés
        'zero':0,'love':0,'nil':0,'oh':0,
        'fifteen':1,'15':1,
        'thirty':2,'30':2,
        'forty':3,'40':3,
        // Italiano
        'quindici':1,'trenta':2,'quaranta':3,
        // Francés
        'zéro':0,'quinze':1,'trente':2,'quarante':3,
        // Alemán
        'null':0,'fünfzehn':1,'dreißig':2,'vierzig':3,
        // Finlandés
        'nolla':0,'viisitoista':1,'kolmekymmentä':2,'neljäkymmentä':3,
        // Números escritos
        '0':0,'15':1,'30':2,'40':3,
    };

    // ── Ventaja servidor ──
    if(/ventaja servi|ventaja saque|ventaja al saque|advantage serv|advantage in|ad in|vantaggio serv|vorhand aufschlag/.test(t)){
        return {p1:3,p2:3,isDeuce:false,advSrv:true,advRstr:false};
    }
    // ── Ventaja restador ──
    if(/ventaja rest|ventaja al rest|ventaja recept|advantage out|advantage rec|ad out|vantaggio rest/.test(t)){
        return {p1:3,p2:3,isDeuce:false,advSrv:false,advRstr:true};
    }

    // ── "X iguales" / "X igual" → marcador igualado en X ──
    // IMPORTANTE: "30 iguales" = 30-30, "15 iguales" = 15-15
    // Solo "cuarenta iguales" / "40 iguales" = deuce
    const equalsMatch = t.match(/^(quince|15|treinta|30|cuarenta|40|cero|0)\s+(iguales?|igual|all|tous|tutti|alle|tasapeli)$/);
    if(equalsMatch){
        const v = W[equalsMatch[1].replace('quince','quince')] ?? W[equalsMatch[1]];
        if(v !== undefined){
            if(v===3) return {p1:3,p2:3,isDeuce:true,advSrv:false,advRstr:false}; // 40 iguales = deuce
            return {p1:v,p2:v,isDeuce:false,advSrv:false,advRstr:false};
        }
    }

    // ── "iguales" / "deuce" solo (sin número) → deuce/40-40 ──
    if(/^(deuce|iguales?|parità|égalité|einstand|tasapeli)$/.test(t)){
        return {p1:3,p2:3,isDeuce:true,advSrv:false,advRstr:false};
    }

    // ── Quitar palabras de relleno y parsear "X a Y" / "X Y" ──
    const filler=/\b(vamos|ahora|están|van|estamos|ponemos|está|pone|es|marcador|score|it'?s|the score is|we'?re at|son|sería|pon|pon el|anota)\b/gi;
    const clean = t.replace(filler,'').replace(/\s+/g,' ').trim();
    const words = clean.split(/\s+/);

    for(let i=0;i<words.length;i++){
        const w1 = words[i];
        if(!(w1 in W)) continue;
        // Saltar conectores
        let j = i+1;
        while(j<words.length && /^(a|to|all|por|and|e|y|—|-|–|igual|iguales?|versus|vs|contra)$/.test(words[j])) j++;
        if(j>=words.length) continue;
        const w2 = words[j];
        if(w2 in W){
            const s1=W[w1], s2=W[w2];
            // 40-40 → deuce
            if(s1===3 && s2===3) return {p1:3,p2:3,isDeuce:true,advSrv:false,advRstr:false};
            return {p1:s1,p2:s2,isDeuce:false,advSrv:false,advRstr:false};
        }
    }
    return null;
}

let _announceTimer = null;
function showScoreAnnounce(label, sub){
    // Quitar anterior si existe
    const prev = document.getElementById('score-announce');
    if(prev) prev.remove();
    clearTimeout(_announceTimer);

    const sc = getScoreDisplay();
    const m  = getMatchContext();
    const el = document.createElement('div');
    el.id = 'score-announce';
    el.style.cssText = [
        'position:fixed','top:50%','left:50%',
        'transform:translate(-50%,-50%)',
        'z-index:190',
        'pointer-events:none',
        'text-align:center',
        'animation:scoreAnnounceIn 0.18s cubic-bezier(.34,1.56,.64,1) forwards'
    ].join(';');

    const p = tc.primary();
    el.innerHTML = `
    <div style="
        background:rgba(10,10,10,0.93);
        border:1.5px solid ${p}30;
        border-radius:28px;
        padding:20px 32px 16px;
        box-shadow:0 8px 48px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04);
        backdrop-filter:blur(20px);
        min-width:220px;
    ">
        ${label?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:${p};margin-bottom:8px;">${label}</div>`:''}
        <div style="font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px;color:#fff;font-family:'Lexend',sans-serif;">
            ${sc.scoreA}<span style="color:rgba(255,255,255,0.2);font-weight:200;margin:0 8px">-</span>${sc.scoreB}
        </div>
        <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);margin-top:8px;text-transform:uppercase;letter-spacing:1px;">
            ${sub||('Juegos '+m.gamesA+' — '+m.gamesB)}
        </div>
    </div>`;

    document.body.appendChild(el);

    // Fade out after 2.2s
    _announceTimer = setTimeout(()=>{
        if(el.parentNode){
            el.style.animation='scoreAnnounceOut 0.25s ease forwards';
            setTimeout(()=>el.remove(), 250);
        }
    }, 2200);
}

function saveMatchToHistory(){
    if(!S.setsHistory.length && S.teamA.games===0 && S.teamB.games===0) return;
    const setsA=S.setsHistory.filter(s=>s.winner==='A').length;
    const setsB=S.setsHistory.filter(s=>s.winner==='B').length;
    const totalPts = S.momentum.length;
    const ptsA = S.momentum.filter(m=>m.team==='A').length;
    const gA=S.setsHistory.reduce((a,s)=>a+s.a,0)+S.teamA.games;
    const gB=S.setsHistory.reduce((a,s)=>a+s.b,0)+S.teamB.games;
    // El identificador tiene que ser unico: es la clave con la que el partido
    // viaja a la nube -(user_id, local_id)- y dos partidos guardados en el
    // mismo milisegundo se pisarian, subiendo solo uno. Se fuerza que siempre
    // sea mayor que el ultimo guardado.
    const previos = getAllMatchRecords();
    const ultimoId = previos.length ? Number(previos[0].id) || 0 : 0;
    const nuevoId = Math.max(Date.now(), ultimoId + 1);

    const record = {
        id: nuevoId,
        date: new Date().toISOString(),
        teamA: S.teamA.name, teamB: S.teamB.name,
        playerA1: S.teamA.playerA, playerA2: S.teamA.playerB,
        playerB1: S.teamB.playerA, playerB2: S.teamB.playerB,
        setsA, setsB, winner: S.matchWinner,
        setsHistory: S.setsHistory,
        gamesA: gA, gamesB: gB,
        duration: S.gameTime,
        // Salud del partido: la manda el reloj mientras se juega. Se guarda
        // con el partido para que no se pierda al cambiar de movil.
        kcal: S.calories|0, km: +(S.distanceKm||0), hr: S.heartRate|0,
        totalPoints: totalPts, pointsWonA: ptsA,
        faults: JSON.parse(JSON.stringify(S.faults)),
        momentum: S.momentum.slice(),
        theme: S.theme||'neon', lang: S.lang||'es'
    };
    if(currentOwner()) record.owner = currentOwner();
    try{
        const hist = getAllMatchRecords();
        hist.unshift(record);
        if(hist.length>200) hist.pop();
        setAllMatchRecords(hist);
    }catch(e){}
    try{ PPSync.sendHistoryToWatch(); }catch(e){}

    // Los que han jugado entran solos en la agenda. Nadie va a teclear una
    // lista de amigos a mano; luego ya se le pone telefono a quien haga falta.
    if(typeof Contacts!=='undefined'){
        [record.playerA1, record.playerA2, record.playerB1, record.playerB2]
            .filter(Boolean)
            .forEach(n => { if(!Contacts.find(n)) Contacts.upsert(n, {}); });
    }
}

/** Texto para compartir un partido guardado del historial. */
function getMatchShareText(match){
    const dt = new Date(match.date);
    const fecha = dt.toLocaleDateString(currentLang().locale||'es-ES', {day:'2-digit', month:'long', year:'numeric'});
    const pA = [match.playerA1, match.playerA2].filter(Boolean).join(' / ');
    const pB = [match.playerB1, match.playerB2].filter(Boolean).join(' / ');
    const sets = (match.setsHistory||[]).map((x,idx)=>`Set ${idx+1}: ${x.a}-${x.b}${x.tiebreak?' (TB)':''}`).join('\n');
    const gano = match.winner ? (match.winner==='A'?match.teamA:match.teamB) : null;
    const dur = match.duration ? `\n⏱️ ${formatTime(match.duration)}` : '';
    return `🎾 PadelPulse Live\n${fecha}\n\n${match.teamA}${pA?' ('+pA+')':''}\nvs\n${match.teamB}${pB?' ('+pB+')':''}\n\n📊 ${match.setsA}-${match.setsB}\n${sets}${gano?`\n\n🏆 ${gano}`:''}${dur}`;
}

function shareMatch(id, platform){
    const m = getMatchHistory().find(x=>x.id===id);
    if(!m) return;
    const text = getMatchShareText(m);
    if(platform==='whatsapp') shareSocial('whatsapp', text);
    else shareResult(text);
}

/**
 * Todos los partidos guardados en este movil, de quien sean.
 *
 * Cada partido lleva `owner`: el id de la cuenta con la que se jugo o se bajo
 * de la nube. Sin owner es un partido jugado sin cuenta, que se sube a la
 * primera cuenta que entre. Asi, si en un movil entran dos personas, ninguna
 * ve -ni sube a su nube- los partidos de la otra.
 */
function getAllMatchRecords(){
    try{ return JSON.parse(localStorage.getItem('pp_match_history')||'[]'); }catch(e){ return []; }
}
function setAllMatchRecords(list){
    try{ localStorage.setItem('pp_match_history', JSON.stringify(list)); }catch(e){}
}
function currentOwner(){
    return (typeof Auth!=='undefined' && Auth.isIn && Auth.user) ? Auth.user.id : null;
}
/** Los partidos que se ven: los de la cuenta activa y los jugados sin cuenta. */
function isMineOrAnon(m){
    return !m.owner || m.owner === currentOwner();
}
function getMatchHistory(){
    return getAllMatchRecords().filter(isMineOrAnon);
}

function deleteMatchFromHistory(id){
    try{
        setAllMatchRecords(getAllMatchRecords().filter(m=>!(m.id===id && isMineOrAnon(m))));
    }catch(e){}
}

    persist(){
        try{
            if(this.session) localStorage.setItem('pp_session', JSON.stringify({...this.session, user:this.user}));
            else localStorage.removeItem('pp_session');
        }catch(e){}
    },

    get isIn(){ return this.status==='in' && !!this.session; },

    async api(path, {method='GET', body=null, auth=true, headers={}}={}){
        const h = Object.assign({
            'apikey': SUPA_KEY,
            'Content-Type': 'application/json'
        }, headers);
        if(auth && this.session) h['Authorization'] = 'Bearer ' + this.session.access_token;
        const res = await fetch(SUPA_URL + path, {
            method, headers: h, body: body ? JSON.stringify(body) : undefined
        });
        const txt = await res.text();
        let data = null;
        try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
        if(!res.ok){
            const msg = (data && (data.error_description || data.msg || data.message || data.error)) || ('HTTP '+res.status);
            throw new Error(msg);
        }
        return data;
    },

    /**
     * A donde tiene que volver el usuario desde un enlace del correo.
     *
     * En la app, al esquema propio, que reabre PadelPulse. En la web, al
     * propio sitio. Las dos direcciones tienen que estar dadas de alta en
     * Supabase (Authentication › URL Configuration › Additional Redirect URLs)
     * o el servidor las rechaza y manda al usuario a la direccion por defecto.
     */
    returnUrl(){
        const enLaApp = (typeof window!=='undefined') && !!window.AndroidBridge;
        return enLaApp ? 'padelpulse://auth' : (location.origin + location.pathname);
    },

    // ── Registro / entrada / salida ──
    async signUp(email, password, displayName){
        this.status='busy'; this.lastError=null; this.errorHint=null; render();
        try{
            const data = await this.api('/auth/v1/signup', {
                method:'POST', auth:false,
                // Sin redirect_to, el enlace del correo de confirmacion apunta
                // a la direccion por defecto del proyecto (localhost:3000) y en
                // el movil no lleva a ninguna parte.
                headers:{ 'redirect_to': this.returnUrl() },
                body:{ email, password, data:{ display_name: displayName || email.split('@')[0] } }
            });
            // Si el correo YA tiene cuenta, Supabase contesta que si -para no
            // chivar que direcciones existen- pero no manda ningun correo y
            // devuelve el usuario sin identidades. Sin detectarlo, la app
            // mandaba a "mira tu correo" a esperar algo que no iba a llegar.
            const yaExistia = data && data.user && Array.isArray(data.user.identities)
                              && data.user.identities.length === 0;
            if(yaExistia){
                this.status = 'anon';
                this.lastError = i2('Ese correo ya tiene cuenta','That email already has an account');
                this.errorHint = i2('Entra con tu contraseña. Si no la recuerdas, usa "He perdido la contraseña".',
                                     'Sign in with your password. If you forgot it, use "I forgot my password".');
                _authMode = 'in';
                render();
                return;
            }

            // Con confirmacion de correo activada no viene sesion todavia
            if(data.access_token){
                this.applySession(data);
                showToast(i2('Cuenta creada','Account created'), 2500);
                await this.pushAll();
            } else {
                // Con la confirmacion de correo activada la cuenta existe pero
                // aun no hay sesion. Un aviso que se va en 4 segundos no basta:
                // el usuario cree que no funciono. Pantalla propia.
                this.pendingEmail = email;
                this.status = 'confirm';
            }
        }catch(e){
            this.status='anon'; this.lastError = this.human(e.message);
        }
        render();
    },

    async signIn(email, password){
        this.status='busy'; this.lastError=null; this.errorHint=null; render();
        try{
            const data = await this.api('/auth/v1/token?grant_type=password', {
                method:'POST', auth:false, body:{ email, password }
            });
            this.applySession(data);
            showToast(i2('Sesion iniciada','Signed in'), 2000);
            await this.syncNow();
        }catch(e){
            this.status='anon'; this.lastError = this.human(e.message);
        }
        render();
    },

    /**
     * Vuelta de un enlace del correo. Hay dos que reabren la app:
     *
     * - **confirmar la cuenta** al registrarse: la sesion vale, se entra.
     * - **he perdido la contraseña**: la sesion es temporal y solo demuestra
     *   que quien abre el correo es el dueño, asi que se pide la nueva.
     */
    onEmailLink(json){
        let data = null;
        try{ data = (typeof json === 'string') ? JSON.parse(json) : json; }catch(e){}
        if(!data || data.error || !data.access_token){
            this.status = 'anon';
            this.lastError = this.human((data && (data.error_description || data.error)) || 'el enlace no vale');
            // human() ya deja una pista para los casos que conoce; solo se
            // pone la generica cuando no ha puesto ninguna.
            if(!this.errorHint){
                this.errorHint = i2('Los enlaces caducan y valen una sola vez. Pide otro.',
                                     'Links expire and work once. Ask for another one.');
            }
            render();
            return;
        }
        this.applySession(data);

        if(data.type === 'recovery'){
            this.status = 'newpass';
            S.currentView = 'auth';
            render();
            return;
        }

        // Confirmacion de cuenta: ya esta dentro.
        this.pendingEmail = '';
        showToast(i2('Cuenta confirmada','Account confirmed'), 2500);
        this.syncNow(true).catch(()=>{});
        render();
    },

    /**
     * Version web: el enlace de "he perdido la contraseña" vuelve al propio
     * sitio con la sesion detras de la almohadilla. Se limpia la barra de
     * direcciones en cuanto se lee, que ahi va el token.
     */
    async catchWebRedirect(){
        const h = location.hash || '';
        if(h.indexOf('access_token=') < 0) return false;
        const d = {};
        h.replace(/^#/,'').split('&').forEach(par=>{
            const [k,v] = par.split('=');
            if(k) d[k] = decodeURIComponent(v||'');
        });
        if(!d.access_token) return false;
        const esRecuperacion = (d.type === 'recovery');
        history.replaceState(null, '', location.pathname + location.search);
        this.session = {
            access_token: d.access_token,
            refresh_token: d.refresh_token || '',
            expires_at: Date.now() + ((parseInt(d.expires_in,10)||3600) * 1000)
        };
        try{
            const u = await this.api('/auth/v1/user');
            this.user = { id:u.id, email:u.email,
                display_name:(u.user_metadata && u.user_metadata.display_name) || u.email };
            this.status = 'in';
            this.persist();
            this.adoptName();
            PPSync.sendAccountToWatch();
            if(esRecuperacion){
                this.status = 'newpass';
                S.currentView = 'auth';
                render();
                return true;
            }
            if(S.currentView === 'auth'){
                S.currentView = sessionStorage.getItem('pp_setup_done') ? 'home' : 'setup';
            }
            this.syncNow(true).catch(()=>{});
            render();
            return true;
        }catch(e){
            this.session = null;
            this.lastError = this.human(e.message);
            render();
            return false;
        }
    },

    /** Nombre con el que se registro. Si solo hay correo, vacio: no es un nombre. */
    myName(){
        const yo = miNombre();
        if(yo) return yo;
        const dn = ((this.user && this.user.display_name) || '').trim();
        return dn.includes('@') ? '' : dn;
    },

    /**
     * Al entrar, tu nombre va a "Mis datos" y a la pareja A sin esperar a que
     * termine la sincronizacion, y el reloj recibe los nombres nuevos.
     */
    adoptName(){
        try{
            const nombre = this.myName();
            if(!nombre || typeof Contacts==='undefined') return;
            let cambio = false;
            if(!Contacts.me.name){ Contacts.me.name = nombre; Contacts.persist(); cambio = true; }
            if(esNombreGenerico(S.teamA.name)){ S.teamA.name = miNombreDePareja(); cambio = true; }
            if(!S.teamA.playerA){ S.teamA.playerA = miNombre(); cambio = true; }
            if(cambio){
                saveStateOnly();
                PPSync.sendSettings();
            }
        }catch(e){ console.warn('adoptName', e); }
    },

    applySession(data){
        this.session = {
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: Date.now() + ((data.expires_in||3600)*1000)
        };
        this.user = data.user ? {
            id: data.user.id,
            email: data.user.email,
            display_name: (data.user.user_metadata && data.user.user_metadata.display_name) || data.user.email
        } : null;
        this.status = 'in';
        this.persist();
        this.adoptName();
        PPSync.sendAccountToWatch();
        // Ya esta dentro: la pantalla de cuenta no tiene que quedarse ahi.
        if(S.currentView === 'auth'){
            S.currentView = sessionStorage.getItem('pp_setup_done') ? 'home' : 'setup';
        }
    },

    async refreshIfNeeded(){
        if(!this.session) return false;
        if(Date.now() < (this.session.expires_at - 60000)) return true;
        try{
            const data = await this.api('/auth/v1/token?grant_type=refresh_token', {
                method:'POST', auth:false, body:{ refresh_token: this.session.refresh_token }
            });
            this.applySession(data);
            return true;
        }catch(e){
            // El refresco puede fallar por estar sin red: no se cierra sesion
            // por eso, solo si el servidor dice explicitamente que no vale.
            if(/invalid|expired|revoked/i.test(e.message||'')) this.signOut(true);
            return false;
        }
    },

    signOut(silent){
        // Lo de esta cuenta que ya esta en la nube sale del movil: si entra
        // otra persona no debe verlo ni subirlo a la suya. Lo que no llego a
        // subirse se queda guardado, oculto, hasta que esta cuenta vuelva.
        const uid = this.user && this.user.id;
        if(uid){
            // Tu nombre deja de ser el de la pareja A: el siguiente no eres tu
            try{
                const yo = this.myName();
                if(yo && S.teamA.name === yo.toUpperCase()) S.teamA.name = i('teamA').toUpperCase();
                if(yo && S.teamA.playerA === yo) S.teamA.playerA = '';
                saveStateOnly();
                PPSync.sendSettings();
            }catch(e){}
            setAllMatchRecords(getAllMatchRecords().filter(m => !(m.owner===uid && m._synced)));
            if(this.lastSync && !this.lastError && typeof Contacts!=='undefined'){
                Contacts.list = [];
                Contacts.me = { name:'', phone:'', club:'' };
                Contacts.persist();
            }
        }
        this.lastSync = 0;
        this.session=null; this.user=null; this.status='anon';
        this.lastError=null; this.errorHint=null;
        this.pendingEmail='';
        // Quien sale casi siempre quiere volver a entrar, no crear otra cuenta.
        // Y la contraseña no se queda en memoria.
        if(typeof _authMode!=='undefined') _authMode = 'in';
        if(typeof _authForm!=='undefined') _authForm.pass = '';
        this.persist();
        // Que el siguiente que entre en este movil reciba SUS ajustes
        try{ localStorage.removeItem('pp_settings_synced'); }catch(e){}
        // El reloj tiene que enterarse: si no, seguiria mostrando el nombre
        // de alguien que ya no esta.
        try{ PPSync.sendAccountToWatch(); }catch(e){}
        if(!silent) showToast(i2('Sesion cerrada','Signed out'), 2000);
        render();
    },

    /**
     * Traduce lo que contesta el servidor a algo que se entienda, y cuando
     * hace falta deja una pista en errorHint de que se puede hacer.
     */
    human(msg){
        const m = (msg||'').toLowerCase();
        this.errorHint = null;

        if(m.includes('invalid login') || m.includes('invalid_grant')){
            this.errorHint = i2('Revisa que no haya un espacio de mas al final del correo.',
                                 'Check there is no stray space at the end of the email.');
            return i2('Correo o contraseña incorrectos','Wrong email or password');
        }
        if(m.includes('already registered') || m.includes('already been registered') || m.includes('user_already_exists')){
            this.errorHint = i2('Entra con tu contraseña en vez de crear la cuenta.','Sign in with your password instead of creating the account.');
            return i2('Ese correo ya tiene cuenta','That email already has an account');
        }
        if(m.includes('invalid or has expired') || m.includes('one-time token not found') ||
           m.includes('otp_expired') || m.includes('access_denied')){
            this.errorHint = i2('El enlace del correo vale una sola vez. Si ya lo abriste, tu cuenta esta lista: entra con tu contraseña.',
                                 'The email link works once. If you already opened it, your account is ready: sign in with your password.');
            return i2('Ese enlace ya se ha usado o ha caducado','That link was already used or has expired');
        }
        if(m.includes('email not confirmed')){
            this.errorHint = i2('Busca el correo de PadelPulse y abre el enlace.','Look for the PadelPulse email and open the link.');
            return i2('Falta confirmar el correo','Email not confirmed yet');
        }
        if(m.includes('redirect') && m.includes('invalid')){
            this.errorHint = i2('Añade padelpulse://auth en Supabase, Authentication › URL Configuration.',
                                 'Add padelpulse://auth in Supabase, Authentication › URL Configuration.');
            return i2('El servidor rechazo la vuelta a la app','The server rejected the return to the app');
        }
        // El correo integrado de Supabase deja muy pocos envios por hora, y se
        // agota enseguida con varios testers. Decir "prueba en un minuto"
        // engañaba: el limite se cuenta por horas.
        if(m.includes('email_send_rate') || m.includes('email rate')){
            this.errorHint = i2('El servidor de correo esta limitado. Si ya tienes cuenta, entra con tu contraseña.',
                                 'The mail server is rate limited. If you already have an account, sign in with your password.');
            return i2('Se han mandado demasiados correos. Espera un rato.','Too many emails sent. Wait a while.');
        }
        if(m.includes('rate limit') || m.includes('too many')){
            return i2('Demasiados intentos. Prueba dentro de un minuto.','Too many attempts. Try again in a minute.');
        }
        if(m.includes('password')){
            return i2('La contraseña necesita 6 caracteres como minimo','Password needs at least 6 characters');
        }
        if(m.includes('failed to fetch') || m.includes('networkerror') || m.includes('sin conexion') || m.includes('load failed')){
            this.errorHint = i2('Puedes jugar igual; el historial se sube cuando vuelva la cobertura.',
                                 'You can still play; your history uploads when you are back online.');
            return i2('Sin conexion con el servidor','Cannot reach the server');
        }
        return msg;
    },

    // ── He perdido la contraseña ──

    /**
     * Manda el correo para poner una contraseña nueva.
     *
     * No existe "recuperar la contraseña": el servidor solo guarda un hash y
     * nadie -ni el usuario, ni nosotros, ni Supabase- puede volver a leerla.
     * Lo que se manda es un enlace de un solo uso para escribir otra.
     */
    async requestReset(email){
        const correo = (email||'').trim();
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)){
            this.lastError = i2('Pon el correo de tu cuenta','Enter your account email');
            render(); return;
        }
        this.status='busy'; this.lastError=null; this.errorHint=null; render();
        try{
            const vuelta = this.returnUrl();
            await this.api('/auth/v1/recover', {
                method:'POST', auth:false,
                body:{ email: correo },
                headers:{ 'redirect_to': vuelta }
            });
            this.pendingEmail = correo;
            this.status = 'reset';
        }catch(e){
            this.status='anon';
            this.lastError = this.human(e.message);
        }
        render();
    },

    /**
     * Escribe la contraseña nueva. Solo funciona con la sesion temporal que
     * trae el enlace del correo, que es lo que demuestra que quien lo pide es
     * el dueño de la cuenta.
     */
    async updatePassword(nueva){
        if((nueva||'').length < 6){
            this.lastError = i2('La contraseña necesita 6 caracteres como minimo','Password needs at least 6 characters');
            render(); return false;
        }
        this.status='busy'; this.lastError=null; this.errorHint=null; render();
        try{
            await this.api('/auth/v1/user', { method:'PUT', body:{ password: nueva } });
            this.status='in';
            _authForm.pass = '';
            showToast(i2('Contraseña cambiada','Password changed'), 2500);
            if(S.currentView==='auth'){
                S.currentView = sessionStorage.getItem('pp_setup_done') ? 'home' : 'setup';
            }
            render();
            return true;
        }catch(e){
            this.status='newpass';
            this.lastError = this.human(e.message);
            render();
            return false;
        }
    },

    /** Reenvia el correo de confirmacion al mismo usuario. */
    async resendConfirmation(){
        if(!this.pendingEmail){ this.backToForm(); return; }
        this.status='busy'; this.lastError=null; this.errorHint=null; render();
        try{
            await this.api('/auth/v1/resend', {
                method:'POST', auth:false,
                headers:{ 'redirect_to': this.returnUrl() },
                body:{ type:'signup', email:this.pendingEmail }
            });
            showToast(i2('Correo reenviado','Email resent'), 2500);
        }catch(e){
            this.lastError = this.human(e.message);
        }
        this.status='confirm';
        render();
    },

    /** Vuelve al formulario desde la pantalla de confirmar correo. */
    backToForm(){
        this.status='anon'; this.lastError=null; this.errorHint=null; this.pendingEmail='';
        render();
    },

    /** "Ya lo he confirmado": se reintenta la entrada con lo que ya tecleo. */
    async retryAfterConfirm(){
        if(!this.pendingEmail) { this.backToForm(); return; }
        await this.signIn(this.pendingEmail, _authForm.pass || '');
        if(!this.isIn && !this.lastError){
            this.lastError = i2('Todavia no consta como confirmado','Still not confirmed');
        }
        if(!this.isIn) this.status = 'confirm';
        render();
    },

    // ── Sincronizacion del historial ──

    /** Convierte un partido local al formato de la tabla. */
    toRow(m){
        return {
            local_id: String(m.id),
            played_at: m.date,
            team_a: m.teamA||'', team_b: m.teamB||'',
            player_a1: m.playerA1||'', player_a2: m.playerA2||'',
            player_b1: m.playerB1||'', player_b2: m.playerB2||'',
            sets_a: m.setsA|0, sets_b: m.setsB|0,
            games_a: m.gamesA|0, games_b: m.gamesB|0,
            winner: m.winner||null,
            duration_s: m.duration|0,
            kcal: m.kcal|0, distance_km: +(m.km||0), heart_rate: m.hr|0,
            sets_detail: m.setsHistory||[],
            source: 'phone'
        };
    },

    /** Y al revés, para poder pintarlo con el mismo código de siempre. */
    fromRow(r){
        return {
            id: Number(r.local_id) || Date.parse(r.played_at),
            date: r.played_at,
            teamA: r.team_a, teamB: r.team_b,
            playerA1: r.player_a1, playerA2: r.player_a2,
            playerB1: r.player_b1, playerB2: r.player_b2,
            setsA: r.sets_a, setsB: r.sets_b,
            gamesA: r.games_a, gamesB: r.games_b,
            winner: r.winner,
            duration: r.duration_s,
            kcal: r.kcal|0, km: +(r.distance_km||0), hr: r.heart_rate|0,
            setsHistory: r.sets_detail||[],
            totalPoints:0, pointsWonA:0,
            faults:{A:{doubleFault:0},B:{doubleFault:0}},
            momentum:[], theme:S.theme||'neon', lang:S.lang||'es',
            _remote: true
        };
    },

    /** Sube los partidos locales que aun no esten en la nube. */
    async pushAll(){
        if(!this.isIn) return;
        const uid = this.user.id;
        // Solo lo tuyo y lo jugado sin cuenta: nunca partidos de otra cuenta
        const local = getMatchHistory();
        if(!local.length) return;
        const rows = local.map(m=>this.toRow(m));
        // on_conflict por (user_id, local_id): reenviar no duplica
        await this.api('/rest/v1/matches?on_conflict=user_id,local_id', {
            method:'POST',
            headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
            body: rows
        });
        // Subidos: pasan a ser de esta cuenta y ya estan a salvo en la nube
        const subidos = new Set(local.map(m=>String(m.id)));
        setAllMatchRecords(getAllMatchRecords().map(m =>
            (subidos.has(String(m.id)) && isMineOrAnon(m)) ? Object.assign(m, {owner: uid, _synced: true}) : m));
    },

    /** Baja lo que haya en la nube y lo mezcla con lo local. */
    async pullAll(){
        if(!this.isIn) return 0;
        const rows = await this.api('/rest/v1/matches?select=*&order=played_at.desc&limit=200');
        if(!Array.isArray(rows)) return 0;
        const uid = this.user.id;
        const todos = getAllMatchRecords();
        const seen = new Set(todos.filter(isMineOrAnon).map(m=>String(m.id)));
        const nuevos = rows.filter(r=>!seen.has(String(r.local_id)))
            .map(r=>Object.assign(this.fromRow(r), {owner: uid, _synced: true}));
        if(!nuevos.length) return 0;
        const merged = todos.concat(nuevos)
            .sort((a,b)=> new Date(b.date) - new Date(a.date))
            .slice(0,200);
        setAllMatchRecords(merged);
        return nuevos.length;
    },

    /**
     * Los ajustes tambien viajan con la cuenta: idioma, tema y reglas.
     * Manda el ultimo movil que sincroniza.
     */
    async pushSettings(){
        if(!this.isIn) return;
        await this.api('/rest/v1/settings?on_conflict=user_id', {
            method:'POST',
            headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
            body:[{
                user_id: this.user.id,
                lang: S.lang||'es',
                theme: S.theme||'neon',
                golden_point: !!S.goldenPoint,
                /* super_tb NO se sube. S.superTiebreak no es un ajuste: es la
                   bandera de "ahora mismo se esta jugando un super tie-break".
                   Subirla como preferencia hacia que al entrar en otro sitio se
                   bajase encendida en mitad de un partido. La columna se queda
                   en la tabla sin usar. */
                best_of: S.bestOf||3,
                updated_at: new Date().toISOString()
            }]
        });
    },

    /**
     * Solo se aplican la primera vez que este movil sincroniza. Despues manda
     * lo local: si alguien cambia el tema aqui, no queremos que la nube se lo
     * deshaga en el siguiente sync.
     */
    async pullSettings(){
        if(!this.isIn) return false;
        if(localStorage.getItem('pp_settings_synced')) return false;
        const rows = await this.api('/rest/v1/settings?select=*&limit=1');
        localStorage.setItem('pp_settings_synced','1');
        if(!Array.isArray(rows) || !rows.length) return false;
        const r = rows[0];
        S.lang = r.lang || S.lang;
        S.theme = r.theme || S.theme;
        S.goldenPoint = !!r.golden_point;
        /* super_tb no se aplica: era el fallo por el que, al iniciar sesion,
           la app se creia en un super tie-break y empezaba a contar los puntos
           de uno en uno en vez de 15/30/40. */
        S.bestOf = r.best_of || S.bestOf;
        saveStateOnly();
        return true;
    },

    /** Sube y baja. Es lo que se llama al entrar y desde el boton. */
    async syncNow(quiet){
        if(!this.isIn || this.syncing) return;
        this.syncing = true; render();
        try{
            if(!(await this.refreshIfNeeded())) throw new Error('sin sesion');
            const ajustesBajados = await this.pullSettings();
            if(!ajustesBajados) await this.pushSettings();
            await this.pushAll();
            const bajados = await this.pullAll();
            // La agenda va aparte: si falla, el historial ya esta a salvo y no
            // tiene sentido decirle al usuario que no se ha guardado nada.
            try{
                await Contacts.pull();
                await Contacts.push();
                // El perfil de la nube puede traer tu nombre: a la pareja A y al reloj
                this.adoptName();
                PPSync.sendAccountToWatch();
            }catch(e){ console.warn('agenda', e); }
            this.lastSync = Date.now();
            this.lastError = null;
            try{ PPSync.sendHistoryToWatch(); }catch(e){}
            if(!quiet) showToast(bajados
                ? i2(`Sincronizado · ${bajados} partidos nuevos`,`Synced · ${bajados} new matches`)
                : i2('Todo sincronizado','All synced'), 2200);
        }catch(e){
            this.lastError = this.human(e.message);
            if(!quiet) showToast('⚠️ ' + this.lastError, 3000, true);
        }
        this.syncing = false;
        render();
    },

    /** Guarda un partido recien terminado, sin bloquear el final de partido. */
    backupMatch(){
        if(!this.isIn) return;
        setTimeout(()=>{ this.syncNow(true).catch(()=>{}); }, 1200);
    }
};

/**
 * Lo que la app recuerda de la gente con la que juegas.
 *
 * Los nombres salen solos del historial, pero un nombre no sirve para
 * llamar a nadie: aqui se guarda el telefono, si es de los habituales y
 * quien es tu pareja de padel. Todo va tambien a la nube con la cuenta,
 * asi que cambiar de movil no cuesta volver a escribirlo.
 */
const Contacts = {
    me: { name:'', phone:'', club:'' },
    list: [],                 // {name, phone, email, favorite, partner, notes, updated}

    load(){
        try{
            const me = JSON.parse(localStorage.getItem('pp_me')||'null');
            if(me) this.me = Object.assign(this.me, me);
        }catch(e){}
        try{ this.list = JSON.parse(localStorage.getItem('pp_friends')||'[]'); }catch(e){ this.list = []; }
    },

    persist(){
        try{
            localStorage.setItem('pp_me', JSON.stringify(this.me));
            localStorage.setItem('pp_friends', JSON.stringify(this.list));
        }catch(e){}
    },

    /** Busca sin distinguir mayusculas ni espacios de sobra. */
    find(name){
        const k = String(name||'').trim().toLowerCase();
        return this.list.find(f => f.name.trim().toLowerCase() === k) || null;
    },

    /** Crea o actualiza. Devuelve la ficha. */
    upsert(name, datos){
        const nombre = String(name||'').trim();
        if(!nombre) return null;
        let f = this.find(nombre);
        if(!f){
            f = { name:nombre, phone:'', email:'', favorite:false, partner:false, notes:'' };
            this.list.push(f);
        }
        Object.assign(f, datos||{});
        f.name = nombre;
        f.updated = new Date().toISOString();
        this.persist();
        return f;
    },

    remove(name){
        const f = this.find(name);
        if(!f) return;
        this.list = this.list.filter(x => x !== f);
        this.persist();
    },

    /** La pareja habitual. Solo puede haber una. */
    partner(){ return this.list.find(f => f.partner) || null; },

    setPartner(name){
        const f = this.upsert(name, {});
        if(!f) return;
        this.list.forEach(x => { x.partner = (x === f); });
        f.favorite = true;
        this.persist();
    },

    clearPartner(){
        this.list.forEach(x => { x.partner = false; });
        this.persist();
    },

    toggleFavorite(name){
        const f = this.upsert(name, {});
        if(!f) return;
        f.favorite = !f.favorite;
        if(!f.favorite) f.partner = false;
        this.persist();
    },

    /**
     * Los amigos ordenados como interesa verlos: la pareja primero, luego
     * los favoritos, y despues por quien ha jugado mas.
     */
    ordered(){
        const stats = {};
        getPlayerStats().forEach(p => { stats[p.name.trim().toLowerCase()] = p; });
        return this.list.map(f => Object.assign({}, f, {
            stats: stats[f.name.trim().toLowerCase()] || null
        })).sort((a,b) =>
            (b.partner?1:0)-(a.partner?1:0) ||
            (b.favorite?1:0)-(a.favorite?1:0) ||
            ((b.stats&&b.stats.played)||0)-((a.stats&&a.stats.played)||0) ||
            a.name.localeCompare(b.name)
        );
    },

    /** Telefono en formato internacional, que es lo que quiere WhatsApp. */
    waNumber(phone){
        const n = String(phone||'').replace(/[^\d+]/g,'');
        if(!n) return '';
        if(n.startsWith('+')) return n.slice(1);
        // Sin prefijo asumimos España, que es donde esta el usuario
        return n.length === 9 ? '34' + n : n;
    },

    // ── Nube ──

    toRow(f){
        return {
            name: f.name,
            phone: f.phone || null,
            email: f.email || null,
            favorite: !!f.favorite,
            is_partner: !!f.partner,
            notes: f.notes || null,
            updated_at: f.updated || new Date().toISOString()
        };
    },

    fromRow(r){
        return {
            name: r.name,
            phone: r.phone || '',
            email: r.email || '',
            favorite: !!r.favorite,
            partner: !!r.is_partner,
            notes: r.notes || '',
            updated: r.updated_at
        };
    },

    async push(){
        if(!Auth.isIn) return;
        if(this.list.length){
            const rows = this.list.map(f => Object.assign(this.toRow(f), { user_id: Auth.user.id }));
            await Auth.api('/rest/v1/players?on_conflict=user_id,name', {
                method:'POST',
                headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
                body: rows
            });
        }
        await Auth.api('/rest/v1/profiles?on_conflict=id', {
            method:'POST',
            headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
            body:[{
                id: Auth.user.id,
                display_name: this.me.name || (Auth.user.display_name||''),
                phone: this.me.phone || null,
                club: this.me.club || null,
                updated_at: new Date().toISOString()
            }]
        });
    },

    /**
     * Baja la agenda y la mezcla. Gana la ficha modificada mas tarde, para
     * que corregir un telefono en el movil no lo deshaga la nube ni al reves.
     */
    async pull(){
        if(!Auth.isIn) return 0;
        let nuevos = 0;
        const rows = await Auth.api('/rest/v1/players?select=*');
        if(Array.isArray(rows)){
            rows.forEach(r => {
                const remoto = this.fromRow(r);
                const local = this.find(remoto.name);
                if(!local){ this.list.push(remoto); nuevos++; }
                else if(!local.updated || new Date(remoto.updated) > new Date(local.updated)){
                    Object.assign(local, remoto);
                }
            });
            // Una sola pareja habitual, por si dos moviles marcaron distinta
            const parejas = this.list.filter(f => f.partner);
            if(parejas.length > 1){
                parejas.sort((a,b)=> new Date(b.updated||0) - new Date(a.updated||0));
                parejas.slice(1).forEach(f => { f.partner = false; });
            }
        }
        const perfil = await Auth.api('/rest/v1/profiles?select=*&limit=1');
        if(Array.isArray(perfil) && perfil.length){
            const r = perfil[0];
            if(!this.me.name)  this.me.name  = r.display_name || '';
            if(!this.me.phone) this.me.phone = r.phone || '';
            if(!this.me.club)  this.me.club  = r.club || '';
        }
        this.persist();
        return nuevos;
    }
};

/** El ultimo partido jugado, que es el que casi siempre se quiere repetir. */
function getLastMatch(){
    const h = getMatchHistory();
    return h.length ? h[0] : null;
}

/** Vuelve a montar el partido del historial con los mismos de siempre. */
function repeatMatch(id){
    const m = id ? getMatchHistory().find(x => x.id === id) : getLastMatch();
    if(!m) return;
    startNewMatch();
    S.teamA.name = m.teamA || 'LOCAL';
    S.teamB.name = m.teamB || 'VISITA';
    S.teamA.playerA = m.playerA1 || ''; S.teamA.playerB = m.playerA2 || '';
    S.teamB.playerA = m.playerB1 || ''; S.teamB.playerB = m.playerB2 || '';
    saveState();
    render();
    PPSync.sendSettings();
    showToast(i2('Mismos jugadores que la ultima vez','Same players as last time'), 2200);
}

/** Monta un partido con tu pareja habitual ya puesta en tu equipo. */
function useMyPair(){
    const p = Contacts.partner();
    if(!p) return;
    S.teamA.playerA = Contacts.me.name || S.teamA.playerA || '';
    S.teamA.playerB = p.name;
    saveState();
    render();
    showToast(i2(`Juegas con ${p.name}`,`Playing with ${p.name}`), 2000);
}

/** Abre WhatsApp con esa persona, no la hoja de compartir generica. */
function whatsappTo(name, texto){
    const f = Contacts.find(name);
    const num = f ? Contacts.waNumber(f.phone) : '';
    const t = texto || getShareText();
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    if(!num){
        showToast(i2('No tienes su telefono guardado','No phone saved for them'), 2500);
        shareSocial('whatsapp', t);
        return;
    }
    const url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(t);
    if(b && b.openExternal){ b.openExternal(url); return; }
    window.open(url, '_blank');
}

function callTo(name){
    const f = Contacts.find(name);
    if(!f || !f.phone){ showToast(i2('No tienes su telefono guardado','No phone saved for them'), 2500); return; }
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    const url = 'tel:' + String(f.phone).replace(/\s/g,'');
    if(b && b.openExternal){ b.openExternal(url); return; }
    window.location.href = url;
}

 * Pantalla de entrada: usuario y contraseña, o entrar sin cuenta.
 *
 * Lo que se teclea vive aqui y no en el DOM. Antes los campos no llevaban
 * value, asi que cualquier render() -y hay uno en cada error- los dejaba en
 * blanco y habia que reescribirlo todo. Ahora sobreviven al repintado.
 */

    const el = document.getElementById('auth-email');

    Auth.requestReset(_authForm.email);
}

function submitNewPass(){
    const a = (document.getElementById('np-1')||{}).value || '';
    const b = (document.getElementById('np-2')||{}).value || '';
    if(a !== b){
        Auth.lastError = i2('Las dos contraseñas no coinciden','The two passwords do not match');
        render(); return;
    }
    Auth.updatePassword(a);
}

function toggleResetPass(){ _resetShowPass = !_resetShowPass; render(); }

function submitAuth(){
    // Se lee del campo y no solo de _authForm: el gestor de contraseñas y el
    // autorrelleno del sistema escriben directamente en el input sin disparar
    // el evento, y si no miraramos ahi pareceria que esta vacio.
    const leer = (id, guardado) => {
        const el = document.getElementById(id);
        return (el && el.value) ? el.value : (guardado || '');
    };
    _authForm.email = leer('auth-email', _authForm.email);
    _authForm.pass  = leer('auth-pass',  _authForm.pass);
    _authForm.name  = leer('auth-name',  _authForm.name);

    const email = _authForm.email.trim();
    const pass  = _authForm.pass;
    const name  = _authForm.name.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        Auth.lastError = i2('Ese correo no parece valido','That email does not look valid'); render(); return;
    }
    if(pass.length < 6){
        Auth.lastError = i2('La contraseña necesita 6 caracteres como minimo','Password needs at least 6 characters'); render(); return;
    }
    if(_authMode==='up') Auth.signUp(email, pass, name);
    else Auth.signIn(email, pass);
}

 * repintase, el teclado perderia el foco a cada letra.

function saveMe(){
    const g = (id)=> (document.getElementById(id)||{}).value || '';
    Contacts.me.name  = g('me-name').trim();
    Contacts.me.phone = g('me-phone').trim();
    Contacts.me.club  = g('me-club').trim();
    Contacts.persist();
    /* La pareja A eres tu: si todavia se llamaba "Pareja A", pasa a llevar tu
       nombre. Si le habias puesto uno a mano, no se toca. */
    if(esNombreGenerico(S.teamA.name)){
        S.teamA.name = miNombreDePareja();
        if(!S.teamA.playerA) S.teamA.playerA = miNombre();
        saveState();
    }
    if(Auth.isIn){
        clearTimeout(_meSyncTimer);
        _meSyncTimer = setTimeout(()=>Contacts.push().catch(()=>{}), 1500);
    }
}

/** Cuando se sincronizo por ultima vez, en cristiano. */
function lastSyncLabel(){
    if(!Auth.lastSync) return i2('Sin sincronizar todavia','Not synced yet');
    const min = Math.floor((Date.now() - Auth.lastSync) / 60000);
    if(min < 1) return i2('Sincronizado hace un momento','Synced just now');
    if(min < 60) return i2(`Sincronizado hace ${min} min`,`Synced ${min} min ago`);
    const h = Math.floor(min/60);
    return i2(`Sincronizado hace ${h} h`,`Synced ${h} h ago`);
}

// JUGADORES Y PAREJAS
// Todo se deriva del historial de partidos: no hay una segunda base de
// datos que pueda quedar descuadrada respecto a los partidos guardados.

/** Jugadores de un partido, por equipo, sin huecos ni duplicados. */
function matchPlayers(match, team){
    const raw = team==='A' ? [match.playerA1, match.playerA2] : [match.playerB1, match.playerB2];
    const named = raw.map(x=>(x||'').trim()).filter(Boolean);
    // Si no hay jugadores sueltos, la pareja cuenta como una entidad
    return named.length ? named : [ (team==='A'?match.teamA:match.teamB) || '—' ];
}

/**
 * Agrega el historial por jugador (o por pareja si no hay nombres sueltos).
 * Devuelve la lista ordenada por partidos jugados.
 */
function getPlayerStats(){
    const hist = getMatchHistory();
    const map = {};

    const touch = (name) => {
        const k = name.trim();
        if(!map[k]) map[k] = {
            name:k, played:0, won:0, lost:0,
            setsWon:0, setsLost:0, gamesWon:0, gamesLost:0,
            seconds:0, last:null, results:[], partners:{}, rivals:{}
        };
        return map[k];
    };

    // El historial viene de mas reciente a mas antiguo
    hist.forEach(m=>{
        ['A','B'].forEach(team=>{
            const players = matchPlayers(m, team);
            const mates   = matchPlayers(m, team==='A'?'B':'A');
            const win     = m.winner === team;
            const sw      = team==='A' ? (m.setsA||0) : (m.setsB||0);
            const sl      = team==='A' ? (m.setsB||0) : (m.setsA||0);
            const gw      = team==='A' ? (m.gamesA||0) : (m.gamesB||0);
            const gl      = team==='A' ? (m.gamesB||0) : (m.gamesA||0);

            players.forEach(nm=>{
                const e = touch(nm);
                e.played++;
                if(win) e.won++; else e.lost++;
                e.setsWon+=sw; e.setsLost+=sl;
                e.gamesWon+=gw; e.gamesLost+=gl;
                e.seconds += (m.duration||0);
                if(!e.last || new Date(m.date) > new Date(e.last)) e.last = m.date;
                e.results.push(win?'W':'L');
                players.filter(o=>o!==nm).forEach(o=>{ e.partners[o]=(e.partners[o]||0)+1; });
                mates.forEach(o=>{ e.rivals[o]=(e.rivals[o]||0)+1; });
            });
        });
    });

    return Object.values(map).map(e=>{
        e.winPct = e.played ? Math.round(e.won/e.played*100) : 0;
        // Racha actual: los resultados van de mas reciente a mas antiguo
        let streak = 0, type = e.results[0] || null;
        for(const r of e.results){ if(r===type) streak++; else break; }
        e.streak = streak; e.streakType = type;
        e.topPartner = Object.entries(e.partners).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
        e.topRival   = Object.entries(e.rivals).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
        return e;
    }).sort((a,b)=> b.played-a.played || b.winPct-a.winPct);
}

/** Parejas fijas (dos nombres juntos) con su balance. */
function getPairStats(){
    const hist = getMatchHistory();
    const map = {};
    hist.forEach(m=>{
        ['A','B'].forEach(team=>{
            const ps = matchPlayers(m, team);
            if(ps.length < 2) return;               // solo parejas con dos nombres
            const key = ps.slice(0,2).sort().join(' & ');
            if(!map[key]) map[key] = {name:key, played:0, won:0, last:null};
            const e = map[key];
            e.played++;
            if(m.winner===team) e.won++;
            if(!e.last || new Date(m.date) > new Date(e.last)) e.last = m.date;
        });
    });
    return Object.values(map).map(e=>{
        e.lost = e.played - e.won;
        e.winPct = e.played ? Math.round(e.won/e.played*100) : 0;
        return e;
    }).sort((a,b)=> b.played-a.played || b.winPct-a.winPct);
}

/** Nombres ya usados, para autocompletar al montar un partido. */
function getKnownNames(){
    return getPlayerStats().map(p=>p.name);
}

function fmtSince(iso){
    if(!iso) return '—';
    const days = Math.floor((Date.now()-new Date(iso))/86400000);
    if(days<=0) return i2('hoy','today');
    if(days===1) return i2('ayer','yesterday');
    if(days<30) return i2(`hace ${days} d`,`${days} d ago`);
    const months=Math.floor(days/30);
    return i2(`hace ${months} mes${months>1?'es':''}`,`${months} mo ago`);
}
