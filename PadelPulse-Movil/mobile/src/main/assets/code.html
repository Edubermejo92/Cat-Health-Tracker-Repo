// ── Calcular métricas avanzadas de un partido ──
function calcMatchStats(match){
    const tot = match.totalPoints||0;
    const pA  = match.pointsWonA||0;
    const pB  = tot - pA;
    const gA  = match.gamesA||0;
    const gB  = match.gamesB||0;
    const gTot= (gA+gB)||1;
    // Serving stats (approx: saque cada 2 juegos)
    const srvGamesA = Math.ceil(gTot/2);
    const srvGamesB = Math.floor(gTot/2);
    const fDA = match.faults?.A?.doubleFault||0;
    const fDB = match.faults?.B?.doubleFault||0;
    // % puntos ganados
    const pctA = tot>0?Math.round(pA/tot*100):50;
    const pctB = 100-pctA;
    // Breaks (juegos ganados recibiendo ≈ si gana más juegos de los que debería sirviendo)
    const breaksA = Math.max(0, gA - Math.round(gTot*0.5));
    const breaksB = Math.max(0, gB - Math.round(gTot*0.5));
    // Service hold % (approx)
    const srvHoldA = srvGamesA>0?Math.round(Math.max(0,(srvGamesA-breaksB)/srvGamesA*100)):50;
    const srvHoldB = srvGamesB>0?Math.round(Math.max(0,(srvGamesB-breaksA)/srvGamesB*100)):50;
    // Break conversion %
    const brkConvA = (breaksA+breaksB)>0?Math.round(breaksA/(breaksA+breaksB)*100):50;
    const brkConvB = 100-brkConvA;
    // Efficiency
    const effA = Math.round((pctA + srvHoldA + brkConvA)/3);
    const effB = Math.round((pctB + srvHoldB + brkConvB)/3);
    // Performance index 0-100
    const idx = match.winner??(match.setsA>match.setsB?'A':'B');
    const perfA = Math.min(99,Math.max(1,Math.round((pctA*0.4+srvHoldA*0.3+brkConvA*0.3))));
    const perfB = Math.min(99,Math.max(1,Math.round((pctB*0.4+srvHoldB*0.3+brkConvB*0.3))));
    return { pctA,pctB,srvHoldA,srvHoldB,brkConvA,brkConvB,effA,effB,perfA,perfB,
             breaksA,breaksB,gA,gB,pA,pB,tot,fDA,fDB };
}

function showMatchDetail(id){

    const statRow=(label,vA,vB,higherIsBetter=true)=>{

        return `<div class="flex items-center gap-2 py-2" style="border-bottom:1px solid rgba(255,255,255,0.04)">

                <span class="material-symbols-outlined text-[14px] align-middle">delete</span>
            </button>
        </div>
    </div>`;

    document.body.appendChild(el);

let toastTimeout;
function showToast(msg, dur=2000, isError=false){
    let el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
    el.style.cssText=`position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
        background:${isError?'#1a0000':'#1a1919'};
        border:1px solid ${isError?'#ff716c60':'#494847'};
        color:${isError?'#ff716c':tc.primary()};
        padding:8px 16px;border-radius:12px;font-size:12px;font-weight:700;
        z-index:150;white-space:nowrap;transition:opacity 0.3s;max-width:90vw;overflow:hidden;text-overflow:ellipsis;`;
    el.textContent=msg; el.style.opacity='1';
    clearTimeout(toastTimeout); toastTimeout=setTimeout(()=>{ el.style.opacity='0'; },dur);
}

 * siguen guardando en el movil mientras tanto, asi que al registrarse

    return !Auth.isIn;

    return getAllMatchRecords().filter(m => !m.owner).length;

/**
 * Enlace de descarga.
 *
 * Por defecto va el de **invitacion a la prueba**, porque es el que funciona
 * mientras la app este en pruebas cerradas: la ficha normal de Play le dice a
 * quien no sea tester que no esta disponible.
 *
 * Los dos se deducen del applicationId, asi que no pueden estar mal escritos.
 * Cuando la app se publique, se cambia desde Ajustes por el de la ficha (o se
 * vacia el campo de Ajustes y se cambia aqui).
 */
const APP_ID = 'padelpulseapp2.netlify.app';
const INVITE_URL_PRUEBA = 'https://play.google.com/apps/testing/' + APP_ID;
const INVITE_URL_TIENDA = 'https://play.google.com/store/apps/details?id=' + APP_ID;

/**
 * Fase de la app en Google Play. Es el UNICO sitio donde se decide que enlace
 * se manda al invitar, y no se pregunta al usuario: elegirlo no es cosa suya.
 *
 *   true  -> pruebas cerradas. Va el enlace de la prueba, porque la ficha
 *            normal le dice a quien no sea tester que no esta disponible.
 *   false -> publicada. Va la ficha de Play.
 *
 * El dia que se publique, se pone a false y se sube version. Nada mas.
 */
const APP_EN_PRUEBAS = true;

function inviteUrl(){ return APP_EN_PRUEBAS ? INVITE_URL_PRUEBA : INVITE_URL_TIENDA; }

/** El mensaje que se manda. Corto, que se lee en una notificacion. */
function inviteText(nombre){
    const yo = (Contacts.me.name||'').trim();
    const saludo = nombre ? i2(`Hola ${nombre}! `,`Hi ${nombre}! `) : '';
    const firma = yo ? i2(`\n\nNos vemos en la pista,\n${yo}`,`\n\nSee you on court,\n${yo}`) : '';
    return saludo + i2(
        'Llevo el marcador de nuestros partidos con PadelPulse Live: puntuas desde el movil o desde el reloj, guarda el historial y saca las estadisticas de cada uno.\n\nDescargatela y jugamos:\n',
        'I keep score of our matches with PadelPulse Live: score from your phone or your watch, it saves the history and works out everyone\'s stats.\n\nGet it and let\'s play:\n'
    ) + inviteUrl() + firma;
}

/** Invitacion general: se elige a quien mandarsela en la hoja de compartir. */
function inviteFriends(){
    shareResult(inviteText());
}

/** Invitacion a alguien concreto de la agenda, directa a su WhatsApp. */
function inviteTo(nombre){
    whatsappTo(nombre, inviteText(nombre));
}

function startNewMatch(){
    sessionStorage.setItem('pp_setup_done','1');
    const lang=S.lang||'es', theme=S.theme||'neon', bo=(S.bestOf===1||S.bestOf===3||S.bestOf===5)?S.bestOf:3;
    // Los jugadores sobreviven al partido nuevo: casi siempre se juega otra
    // vez con los mismos, y volver a teclear cuatro nombres cada vez sobra.
    const eqA={name:S.teamA.name, playerA:S.teamA.playerA, playerB:S.teamA.playerB};
    const eqB={name:S.teamB.name, playerA:S.teamB.playerA, playerB:S.teamB.playerB};
    S=defaultState();
    S.lang=lang; S.theme=theme; S.bestOf=bo;
    Object.assign(S.teamA, eqA);
    Object.assign(S.teamB, eqB);
    S.currentView='home';
    initTeamNames();
    applyTheme();
    saveState();
    render();
    PPSync.sendSettings();
}

const StatsView=()=>{
    const totalPts = S.momentum.length;
    const ptsA = S.momentum.filter(m=>m.team==='A').length;
    const ptsB = totalPts - ptsA;
    const sA=S.setsHistory.filter(s=>s.winner==='A').length;
    const sB=S.setsHistory.filter(s=>s.winner==='B').length;
    const gA=S.setsHistory.reduce((a,s)=>a+s.a,0)+S.teamA.games;
    const gB=S.setsHistory.reduce((a,s)=>a+s.b,0)+S.teamB.games;
    const gTot=(gA+gB)||1;
    const pctA=totalPts>0?Math.round(ptsA/totalPts*100):50;
    const pctB=100-pctA;

    // Service hold (approx)
    const srvGamesA=Math.ceil(gTot/2), srvGamesB=Math.floor(gTot/2);
    const fDA=S.faults.A.doubleFault, fDB=S.faults.B.doubleFault;
    const breaksA=Math.max(0,gA-Math.round(gTot*0.5));
    const breaksB=Math.max(0,gB-Math.round(gTot*0.5));
    const srvHoldA=srvGamesA>0?Math.round(Math.max(0,(srvGamesA-breaksB)/srvGamesA*100)):50;
    const srvHoldB=srvGamesB>0?Math.round(Math.max(0,(srvGamesB-breaksA)/srvGamesB*100)):50;
    const brkConvA=(breaksA+breaksB)>0?Math.round(breaksA/(breaksA+breaksB)*100):50;
    const brkConvB=100-brkConvA;
    const effA=Math.round((pctA+srvHoldA+brkConvA)/3);
    const effB=Math.round((pctB+srvHoldB+brkConvB)/3);

    const p=tc.primary(), mu=tc.muted(), su=tc.surf2(), te=tc.text();

    const statRow=(label,vA,vB,higherIsBetter=true)=>{
        const numA=parseFloat(vA), numB=parseFloat(vB);
        const winA=higherIsBetter?numA>=numB:numA<=numB;
        return `<div class="flex items-center gap-2 py-2" style="border-bottom:1px solid rgba(255,255,255,0.04)">
            <span class="text-[11px] font-black w-10 text-right" style="color:${winA?p:mu}">${vA}</span>
            <div class="flex-1 flex items-center gap-1">
                <div style="flex:${numA||1};height:3px;border-radius:2px;background:${p};opacity:${winA?1:0.35}"></div>
                <span class="text-[8px] font-bold text-center px-1 flex-shrink-0" style="color:${mu};min-width:72px">${label}</span>
                <div style="flex:${numB||1};height:3px;border-radius:2px;background:#e07b39;opacity:${!winA?1:0.35}"></div>
            </div>
            <span class="text-[11px] font-black w-10" style="color:${!winA?'#e07b39':mu}">${vB}</span>
        </div>`;
    };

    // Momentum chart
    const last=S.momentum.slice(-50);
    const momentumHtml=last.length?`<div class="flex gap-px items-end" style="height:36px">${last.map(m=>`<div style="flex:1;border-radius:2px;height:${m.team==='A'?'100%':'50%'};background:${m.team==='A'?p:'#e07b39'};opacity:0.85"></div>`).join('')}</div>`:'<div class="text-[10px] text-center py-4" style="color:'+mu+'">—</div>';

    return `
<header class="px-4 pt-0 pb-3 flex items-center gap-3 flex-shrink-0 w-full max-w-4xl mx-auto">
    <button onclick="S.currentView='home';render();" class="p-2 rounded-xl scale-press"><span class="material-symbols-outlined text-on-surface-variant text-[20px]">arrow_back</span></button>
    <span class="text-on-surface font-bold text-base">${i('stats')}</span>
    <button onclick="shareResult();" class="ml-auto p-2 rounded-xl scale-press bg-surface-container border border-outline-variant/20"><span class="material-symbols-outlined text-on-surface-variant text-[18px]">share</span></button>
</header>
<div class="flex-1 scrollable px-4 pb-4 flex flex-col gap-3 w-full max-w-4xl mx-auto">

    <!-- Result header -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="flex items-center justify-between mb-3">
            <div class="text-center flex-1">
                <div class="font-black text-sm" style="color:${p}">${S.teamA.name}</div>
                ${(S.teamA.playerA||S.teamA.playerB)?`<div class="text-[8px]" style="color:${mu}">${[S.teamA.playerA,S.teamA.playerB].filter(Boolean).join(' / ')}</div>`:''}
            </div>
            <div class="text-center px-3">
                <div class="font-black text-2xl" style="color:${te}">${sA}<span style="color:${mu}"> – </span>${sB}</div>
                <div class="text-[9px]" style="color:${mu}">${S.setsHistory.map(s=>s.a+'-'+s.b).join(' · ')}</div>
                <div class="text-[9px] mt-1" style="color:${mu}">⏱ ${formatTime(S.gameTime)}</div>
            </div>
            <div class="text-center flex-1">
                <div class="font-black text-sm" style="color:#e07b39">${S.teamB.name}</div>
                ${(S.teamB.playerA||S.teamB.playerB)?`<div class="text-[8px]" style="color:${mu}">${[S.teamB.playerA,S.teamB.playerB].filter(Boolean).join(' / ')}</div>`:''}
            </div>
        </div>
    </div>

    <!-- Advanced stats -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="flex justify-between text-[10px] font-black uppercase mb-1" style="color:${mu}">
            <span style="color:${p}">${S.teamA.name}</span>
            <span>Estadísticas</span>
            <span style="color:#e07b39">${S.teamB.name}</span>
        </div>
        ${statRow('% Puntos',pctA+'%',pctB+'%')}
        ${statRow('Juegos',gA,gB)}
        ${statRow('Hold Saque',srvHoldA+'%',srvHoldB+'%')}
        ${statRow('Break Conv.',brkConvA+'%',brkConvB+'%')}
        ${statRow('Breaks',breaksA,breaksB)}
        ${statRow('Dobles Faltas',fDA,fDB,false)}
        ${statRow('Eficiencia',effA+'%',effB+'%')}
    </div>

    <!-- Momentum -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="text-[9px] font-bold uppercase tracking-widest mb-2" style="color:${mu}">Momentum</div>
        <div class="flex justify-between text-[8px] mb-1.5">
            <span style="color:${p}">● ${S.teamA.name} ${ptsA}pts</span>
            <span style="color:#e07b39">${ptsB}pts ${S.teamB.name} ●</span>
        </div>
        ${momentumHtml}
    </div>

    <!-- Per-set -->
    ${S.setsHistory.length?`<div class="rounded-3xl p-4" style="background:${su}">
        <div class="text-[9px] font-bold uppercase tracking-widest mb-3" style="color:${mu}">Por Set</div>
        ${S.setsHistory.map((s,idx)=>{
            const tot=(s.a+s.b)||1;
            return `<div class="mb-2">
                <div class="flex justify-between text-[9px] mb-1" style="color:${mu}">
                    <span>Set ${idx+1}${s.tiebreak?' (TB)':''}</span>
                    <span style="color:${s.winner==='A'?p:'#e07b39'}">${s.a}-${s.b}</span>

// ═══════════════════════════════════════════
// MODO ARBITRO: el microfono abierto todo el partido
// ═══════════════════════════════════════════

/**
 * Antes habia que pulsar el boton antes de cada punto, lo cual en un partido
 * no vale para nada: nadie va a sacar el movil del bolsillo cada vez. En modo
 * arbitro el microfono se queda abierto y se vuelve a abrir solo despues de
 * cada frase, tambien despues de que hable la propia app.
 */
let _voiceState = 'off';        // off | listening | processing
let _voiceHeard = '';           // lo ultimo que se ha oido, para enseñarlo

function voiceOn(){ return _voiceState !== 'off'; }

function toggleReferee(){
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    if(!(b && b.startVoiceContinuous)){
        showToast(i2('Solo en la app de Android','Android app only'), 2000);
        return;
    }
    if(voiceOn()){
        b.stopVoice();
        // Se apaga aqui mismo y no se espera al aviso del nativo: si ese aviso
        // no llegara, el indicador se quedaria encendido para siempre.
        onVoiceState('off');
        showToast(i2('Modo arbitro apagado','Referee mode off'), 1800);
    }else{
        // El microfono escucha en el idioma de la app, no en el del telefono:
        // sin esto oia siempre en español y en los demas idiomas no entendia nada.
        if(b.setLanguage) b.setLanguage(currentLang().voice);
        b.startVoiceContinuous();
        onVoiceState('listening');
        // Que el reloj apague el suyo si lo tenia encendido
        try{ PPSync.send(PP_PATH.cmd, {action:'voice_owner'}); }catch(e){}
        showToast(i2('Modo arbitro: canta los puntos','Referee mode: call the points'), 2600);
    }
}

/** Una sola frase, para probar o para un comando suelto. */
function pedirVoz() {
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    if (b && b.startVoiceCommand){ if(b.setLanguage) b.setLanguage(currentLang().voice); b.startVoiceCommand(); }
    else showToast(i2('Solo en la app de Android','Android app only'), 2000);
}

/** La capa nativa avisa de en que punto esta el microfono. */
function onVoiceState(estado){
    if(estado !== _voiceState && (estado === 'off' || _voiceState === 'off')) olvidarUltimaFrase();
    _voiceState = estado;
    if(estado === 'off') _voiceHeard = '';
    // El indicador "en vivo" de la cabecera ya existia pero nadie lo encendia
    S.voiceActive = (estado !== 'off');
    render();
}

/** Lo que va oyendo, aunque todavia no haya terminado la frase. */
function onVoicePartial(txt){
    _voiceHeard = String(txt||'').slice(0, 40);
    const el = document.getElementById('voice-heard');
    if(el) el.textContent = _voiceHeard;   // sin render(), que va por frase
}

/** Un fallo del microfono que si merece contarse. */
function onVoiceError(code){
    // 9 = permiso denegado; 7 = no se entendio; 6 = silencio. Los dos ultimos
    // no llegan aqui, los filtra la capa nativa.
    const msg = (code === 9)
        ? i2('Falta el permiso de microfono','Microphone permission missing')
        : i2('El microfono ha fallado, vuelve a intentarlo','The microphone failed, try again');
    onVoiceState('off');
    showToast('🎙️ ' + msg, 3000, true);
}

                ${i2('En pista hay viento y pelotazos. Este mando sube la voz de la app, pero nunca pasa del volumen del movil: si aun asi se oye bajo, pulsa "Movil al maximo".',
                      'Courts are windy and noisy. This raises the app voice, but never above the phone volume: if it is still quiet, tap "Max phone".')}
            </div>
        </div>`:''}

        <div class="py-2">
            <div class="flex items-center justify-between mb-2"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-[18px] text-on-surface-variant">brightness_6</span><span class="text-sm font-bold text-on-surface">${i('brightness')}</span></div><span class="text-[10px] text-on-surface-variant">${S.brightness}%</span></div>
            <input type="range" min="20" max="100" value="${S.brightness}" class="w-full" oninput="S.brightness=parseInt(this.value);document.documentElement.style.filter='brightness('+S.brightness/100+')';saveState();">
        </div>
    </div>

    ${VozInfoCard()}

    <div class="bg-surface-container rounded-3xl p-4">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest">${i2('Voz','Voice')}</span>
        </div>
        <div class="text-[10px] text-on-surface-variant leading-relaxed mb-3">
            <div class="text-[9px] leading-relaxed" style="color:${tc.muted()}">${i('voiceHint')}</div>
        </div>

        <button onclick="toggleVoice();" class="mt-1 w-full py-3 rounded-2xl text-[11px] font-black uppercase scale-press ${S.voiceActive?'bg-error/10 border border-error/30 text-error mic-active':'bg-surface-container-high border border-outline-variant/20 text-on-surface'}">
            <span class="material-symbols-outlined text-[14px] align-middle mr-1 filled">${S.voiceActive?'mic_off':'mic'}</span>${S.voiceActive?i('voiceOff'):i('voiceOn')}
        </button>
    </div>

    <div class="bg-surface-container rounded-3xl p-4">
        <div class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest mb-3">Tiempo de Saque (Doble Falta Automática)</div>
        <div class="flex items-center justify-between mb-4">
            <div class="text-[11px] text-on-surface">Activar penalización por tiempo</div>
            <button onclick="S.serveTimerEnabled=!S.serveTimerEnabled;render();saveState();" class="scale-press">
                <span class="material-symbols-outlined text-[24px] ${S.serveTimerEnabled?'filled':''}" style="color:${S.serveTimerEnabled?tc.primary():'#555'}">${S.serveTimerEnabled?'toggle_on':'toggle_off'}</span>
            </button>
        </div>
        <div class="flex items-center justify-between transition-opacity" style="opacity:${S.serveTimerEnabled?'1':'0.5'};pointer-events:${S.serveTimerEnabled?'auto':'none'}">
            <div class="text-[11px] text-on-surface">Segundos de límite: <span class="font-bold ml-1" style="color:${tc.primary()}">${S.serveTimerSeconds}s</span></div>
            <div class="flex items-center gap-2">
                <button onclick="if(S.serveTimerSeconds>5){S.serveTimerSeconds-=5;render();saveState();}" class="w-8 h-8 rounded-full flex items-center justify-center scale-press" style="background:${tc.surf2()}"><span class="material-symbols-outlined text-[16px]">remove</span></button>
                <button onclick="if(S.serveTimerSeconds<60){S.serveTimerSeconds+=5;render();saveState();}" class="w-8 h-8 rounded-full flex items-center justify-center scale-press" style="background:${tc.surf2()}"><span class="material-symbols-outlined text-[16px]">add</span></button>
            </div>
        </div>
    </div>

    <div class="flex flex-col gap-2">
        <button onclick="undoPoint();" class="w-full py-3 rounded-2xl bg-surface-container border border-outline-variant/20 text-on-surface text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[14px]">undo</span>${i('undo')} último punto</button>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="newMatch();" class="py-3 rounded-2xl bg-primary/10 border border-primary/20 text-primary text-[11px] font-black uppercase scale-press flex items-center justify-center gap-1"><span class="material-symbols-outlined text-[14px]">add</span>${i('newMatch')} partida</button>
            <button onclick="endMatch();" class="py-3 rounded-2xl bg-surface-container border border-outline-variant/20 text-on-surface-variant text-[11px] font-black uppercase scale-press flex items-center justify-center gap-1"><span class="material-symbols-outlined text-[14px]">flag</span>${i('end')}alizar</button>
        </div>
        <button onclick="resetMatch();" class="w-full py-3 rounded-2xl bg-error/10 border border-error/20 text-error text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[14px]">restart_alt</span>${i('reset')}</button>
        <button onclick="if(confirm('¿Limpiar TODO el estado guardado? Útil si el marcador está bloqueado.')){localStorage.removeItem('pp_state_v4');localStorage.removeItem('pp_state_v3');location.reload();}"
            class="w-full py-3 rounded-2xl text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2"
            style="background:rgba(255,80,80,0.06);border:1px solid rgba(255,80,80,0.15);color:rgba(255,80,80,0.7)">
            <span class="material-symbols-outlined text-[14px]">delete_sweep</span>Limpiar estado (si marcador bloqueado)
        </button>
    </div>

    <!-- Version instalada. Parece un detalle tonto y no lo es: sin esto no hay
         forma de saber si el movil tiene la compilacion nueva o una vieja, y
         se pierde mucho tiempo persiguiendo fallos ya arreglados. -->
    <div class="text-center pt-1 pb-2 text-[10px]" style="color:${tc.muted()};opacity:.6">
        PadelPulse Live ${(typeof window!=='undefined' && window.AndroidBridge && window.AndroidBridge.appVersion) ? window.AndroidBridge.appVersion() : WEB_VERSION + ' · web'}
    </div>
</div>

${BottomNav('settings')}`;

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
let _lastView = null;
// El splash es dueno de #app mientras dura. Cualquier render() de fuera -y hay
// varios en vuelo al arrancar con sesion: syncNow repinta al empezar y al
// acabar- le arrancaria el splash de debajo a media animacion. Se ignoran:
// el estado se actualiza igual y el propio splash pinta lo que haya al soltar.
let _splashing = false;
function render(){
    if(_splashing) return;
    const app=document.getElementById('app');
    const scrollEl = app.querySelector('.scrollable');
    const sameView = (_lastView === S.currentView);
    const saveScroll = (scrollEl && sameView) ? scrollEl.scrollTop : 0;

    app.className='watch-frame font-body';
    applyTheme(S.theme||'neon');
    const ba = document.getElementById('blob-a');
    const bb = document.getElementById('blob-b');
    if(ba) ba.style.background = S.serving==='A' ? tc.sa() : tc.si();
    if(bb) bb.style.background = S.serving==='B' ? tc.sa() : tc.si();
    try {
        switch(S.currentView){
            case 'auth':     app.innerHTML=AuthView(); break;
            case 'setup':    app.innerHTML=SetupView(); break;
            case 'home':     app.innerHTML=HomeView(); break;
            case 'faults':   app.innerHTML=FaultsView(); break;
            case 'stats':    app.innerHTML=StatsView(); break;
            case 'history':  app.innerHTML = historyLocked() ? LockedHistoryView() : HistoryView(); break;
            case 'activity': app.innerHTML=ActivityView(); break;
            case 'settings': app.innerHTML=SettingsView(); break;
            default:         app.innerHTML=HomeView();
        }
    } catch(viewErr) {
        console.error('PadelPulse render error:', viewErr);
        if(S.currentView !== 'home') {
            S.currentView = 'home';
            try { app.innerHTML = HomeView(); } catch(e2) {
                app.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0e0e0e;color:#fff;gap:16px;padding:24px;text-align:center"><span style="font-size:48px">🎾</span><div style="font-weight:900;font-size:18px">Error al cargar</div><button onclick="S.currentView=\'home\';render();" style="padding:12px 24px;background:#00fd87;color:#000;font-weight:900;border:none;border-radius:14px;font-size:14px;cursor:pointer">Reintentar</button></div>';
            }
        }
    }
    
    // La animacion de entrada solo tiene sentido al cambiar de vista. Al
    // repintar la misma, cada pasada la reinicia desde opacity:0 y se ve como
    // un parpadeo. Pasa sobre todo tras registrarse: syncNow() repinta dos
    // veces -al empezar y al acabar- y el window.load lanza otro a los 2,5s,
    // asi que la pantalla de formato y idioma se reanimaba cuatro veces.
    // slideUp termina en translateY(0);opacity:1, el estado natural del
    // elemento, asi que quitar la clase no mueve nada de sitio.
    if(sameView) app.querySelectorAll('.slide-up').forEach(el=>el.classList.remove('slide-up'));

    paintIcons(app);
    _lastView = S.currentView;
    const newScroll = app.querySelector('.scrollable');
    if(newScroll && saveScroll > 0) newScroll.scrollTop = saveScroll;

    if(S.brightness!==100) document.documentElement.style.filter=`brightness(${S.brightness/100})`;
    // Spectator: disable all interactive buttons except nav
    if(SPECTATOR){
        document.querySelectorAll('button').forEach(b=>{
            const txt = b.textContent.trim();
            const isNav = b.closest('nav') || b.closest('header');
            // La navegacion se identifica por estructura (nav/header), no por texto: funciona en los 9 idiomas
            if(!isNav) b.style.pointerEvents='none';
        });
    }
}

startTimer();

// ── SPLASH SCREEN ──────────────────────
function showSplash(){
    _splashing = true;
    const app=document.getElementById('app');
    app.className='watch-frame';
    app.style.background='#000';
    const themeColor = (THEMES[S.theme||'neon']||THEMES.neon).primary;
    const glowColor  = (THEMES[S.theme||'neon']||THEMES.neon).primaryGlow;
    app.innerHTML=`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:0;">
            <div class="splash-in" style="display:flex;flex-direction:column;align-items:center;width:100%;">
                <div style="position:relative;display:flex;align-items:center;justify-content:center;width:100%;padding:0 24px;">
                    <div style="position:absolute;width:260px;height:260px;border-radius:50%;
                        background:radial-gradient(circle,${glowColor} 0%,transparent 70%);
                        animation:splashPulse 1.8s ease infinite;pointer-events:none;"></div>
                    <img src="${LOGO_WORDMARK}" alt="PadelPulse Live"
                        style="width:82%;max-width:360px;height:auto;object-fit:contain;
                               image-rendering:-webkit-optimize-contrast;
                               image-rendering:crisp-edges;position:relative;z-index:1;"
                        id="splash-logo">
                </div>

                <!-- Barra de carga -->
                <div style="width:220px;margin-top:32px;">
                    <!-- Track -->
                    <div style="width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;">
                        <div id="splash-bar"
                            style="height:100%;width:0%;border-radius:4px;
                                   background:${themeColor};
                                   box-shadow:0 0 8px ${glowColor};
                                   transition:width 0.1s linear;">
                        </div>
                    </div>
                    <!-- Porcentaje -->
                    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-family:'Lexend',sans-serif;font-size:10px;font-weight:700;
                                     color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;">
                            ${i('loading')}
                        </span>
                        <span id="splash-pct"
                            style="font-family:'Lexend',sans-serif;font-size:13px;font-weight:900;
                                   color:${themeColor};letter-spacing:0.5px;">
                            0%
                        </span>
                    </div>
                </div>
            </div>
        </div>`;

    // Animación de la barra — 3000ms totales
    // Sube rápido al inicio y se frena al final (sensación real de carga)
    const bar = document.getElementById('splash-bar');
    const pct = document.getElementById('splash-pct');
    const DURATION = 2800;
    const START = Date.now();

    function easeOut(t){ return 1 - Math.pow(1-t, 2.5); }

    const tick = setInterval(()=>{
        const elapsed = Date.now() - START;
        const t = Math.min(elapsed / DURATION, 1);
        const val = Math.round(easeOut(t) * 100);
        if(bar) bar.style.width = val + '%';
        if(pct) pct.textContent = val + '%';
        if(t >= 1) clearInterval(tick);
    }, 30);

    // Fade out
    setTimeout(()=>{
        const wrap = app.querySelector('.splash-in');
        if(wrap){ wrap.classList.remove('splash-in'); wrap.classList.add('splash-out'); }
    }, 2700);

    setTimeout(()=>{
        clearInterval(tick);
        app.style.background='';
        _splashing = false;
        render();
    }, 3100);
}

/**
 * Pantalla de arranque.
 *
 * La cuenta va antes que nada: o entras, o creas una, o sigues sin ella.
 * Se decide aqui -y no arriba, junto al estado- porque `Auth` se define mas
 * abajo en el archivo y leerlo antes revienta la carga entera.
 * El modo espectador (enlace compartido) nunca pide cuenta.
 */
Auth.load();
Contacts.load();
// initTeamNames() ya corrio arriba, cuando Contacts todavia no existia. Ahora
// que tu perfil esta cargado, la pareja A puede coger tu nombre.
initTeamNames();
// Version web: vuelta del enlace de "he perdido la contraseña"
const _vuelveDelCorreo = (typeof location!=='undefined') && (location.hash||'').indexOf('access_token=')>=0;
if (_vuelveDelCorreo) setTimeout(()=>Auth.catchWebRedirect().catch(()=>{}), 50);
if (!SPECTATOR && !_vuelveDelCorreo) {
    if (!Auth.isIn && !authWasSkipped()) {
        S.currentView = 'auth';
    } else if (!sessionStorage.getItem('pp_setup_done')) {
        S.currentView = 'setup';
    }
}

// Iniciar app al cargar DOM (Tailwind no es bloqueante)
if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', showSplash);
} else {
    showSplash();
}

// Arranque de la sincronizacion con el reloj
window.addEventListener('load', () => {
    PPSync.init();
    // Si hay sesion, ponerse al dia en segundo plano sin molestar
    if (Auth.isIn) setTimeout(()=>Auth.syncNow(true).catch(()=>{}), 2500);
    setTimeout(()=>{
        PPSync.hello();
        if(PPSync.paired){ PPSync.sendSettings(); PPSync.push(); }
    }, 900);
    // Latido: mantiene vivo el estado de conexion aunque no pase nada en pista
    setInterval(()=>{
        const b = PPSync.bridge;
        if(b && b.refreshConnection) b.refreshConnection();
        PPSync.hello();
    }, 30000);
});

</script>
