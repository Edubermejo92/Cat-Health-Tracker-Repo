<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="color-scheme" content="dark">
<title>PadelPulse Live</title>
<!-- Todo local: la app funciona sin conexion (pista sin cobertura) -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tailwind.css">
<style>
*{-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box;}
html{height:100%;touch-action:manipulation;background:#000;overflow:hidden;}
body{margin:0;padding:0;background:#000;height:100vh;height:100dvh;width:100vw;overflow:hidden;font-family:'Lexend',sans-serif;}

/* Mobile: full screen */
.watch-frame{
    width:100vw;height:100vh;height:100dvh;
    background:transparent;
    position:relative;
    display:flex;flex-direction:column;
    overflow-y:auto;
    /* deja sitio a la barra fija de abajo, contando el gesto del sistema */
    padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));
}

/* Responsive: adapt fluidly without mobile frame */
@media(max-width:320px){ 
    html { font-size: 14px; }
}
@media(max-width:280px){ 
    html { font-size: 12px; }
}
.pp-flag{font-size:1.35em;line-height:1;display:inline-block;filter:saturate(1.1);}
/* Iconografia local (subset de Material Symbols, 105 glifos, 78 KB) */
.material-symbols-outlined{
    font-family:'PadelPulse Icons';font-weight:normal;font-style:normal;
    line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;
    white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';
    -webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    transition:font-variation-settings .2s ease;
}
.material-symbols-outlined.filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
/* Mientras el pase de iconos no ha corrido, no se ve el nombre en texto plano */
.material-symbols-outlined:not([data-ico]){color:transparent;}
.pulse-glow{box-shadow:0 0 20px rgba(0,253,135,0.4);}
.scale-press{transition:transform 0.15s cubic-bezier(0.4,0,0.2,1), filter 0.15s;}
.scale-press:active{transform:scale(0.92); filter:brightness(0.8);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.animate-pulse-slow{animation:pulse 2s ease infinite;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.slide-up{animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;}
@keyframes scoreFlash{0%{transform:scale(1) translateY(0);filter:brightness(1)} 30%{transform:scale(1.25) translateY(-8px);filter:brightness(1.5)} 100%{transform:scale(1) translateY(0);filter:brightness(1)}}
.score-flash{animation:scoreFlash 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
.mic-active{animation:pulse 0.8s ease infinite;box-shadow:0 0 20px rgba(255,113,108,0.5);}
.scrollable{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.scrollable::-webkit-scrollbar{display:none;}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;background:#262626;border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#00fd87;border-radius:50%;cursor:pointer;}
input[type=text]{-webkit-user-select:text;user-select:text;}
.countdown-ring{transform:rotate(-90deg);transform-origin:50% 50%;}
@keyframes timerWarn{0%,100%{opacity:1}50%{opacity:0.3}}
.timer-warn{animation:timerWarn 0.5s ease infinite;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideDown{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes splashFadeIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes splashFadeOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.05)}}
.splash-in{animation:splashFadeIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;}
.splash-out{animation:splashFadeOut 0.4s ease forwards;}
@keyframes splashPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,253,135,0.4)}70%{box-shadow:0 0 0 20px rgba(0,253,135,0)}}
.splash-glow{animation:splashPulse 1.5s ease infinite;}
@keyframes dotAppear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes scoreAnnounceIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes scoreAnnounceOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(0.9)}}

/* V4 Mesh Background */
.mesh-bg { position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh; z-index:0; overflow:hidden; pointer-events:none; background: radial-gradient(circle at 50% 50%, rgba(20,20,20,0) 0%, #000 100%); }
.blob { position:absolute; filter:blur(90px) opacity(0.35); border-radius:50%; z-index:-1; pointer-events:none; transition:background 1s ease, transform 1s ease; }
@keyframes float1 { 0%,100% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(5vw, -5vh) scale(1.1); } 66% { transform: translate(-5vw, 5vh) scale(0.9); } }
@keyframes float2 { 0%,100% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(-5vw, 5vh) scale(0.9); } 66% { transform: translate(5vw, -5vh) scale(1.1); } }
.blob-a { top:-20%; left:-10%; width:70vw; height:70vw; max-width:800px; max-height:800px; animation:float1 18s infinite ease-in-out; }
.blob-b { bottom:-20%; right:-10%; width:70vw; height:70vw; max-width:800px; max-height:800px; animation:float2 22s infinite ease-in-out; }

/* ═══ MOBILE VIEWPORT-FIT ═══ */
@media (max-width:1023px) {
  .dk-score-num,
  #score-A, #score-B { font-size:clamp(5rem,22vw,10rem) !important; line-height:1 !important; }
}

/* ═══ DESKTOP VIEWPORT-FIT ═══ */
/* Forces ALL height-consuming elements to use viewport-relative units on desktop */
@media (min-width:1024px) {
  /* Header */
  .dk-header { padding-top:1.5vh !important; padding-bottom:0.8vh !important; }
  .dk-header img { height:8vh !important; }

  /* Main content area */
  .dk-main { padding-top:1vh !important; padding-bottom:1vh !important; }

  /* Left panel glass card */
  .dk-glass-left { padding:1.5vh 1rem !important; border-radius:2rem !important; }
  .dk-glass-left .dk-stats-row { margin-bottom:1vh !important; }
  .dk-glass-left .dk-stats-label { font-size:clamp(10px,1.5vh,18px) !important; margin-bottom:0.5vh !important; }
  .dk-glass-left .dk-stats-score { font-size:clamp(24px,5vh,60px) !important; }
  .dk-glass-left .dk-stats-name { font-size:clamp(8px,1.4vh,20px) !important; }
  .dk-glass-left .dk-stats-divider { height:clamp(16px,4vh,40px) !important; }

  /* Big score display */
  .dk-score-num { font-size:clamp(6rem,25vh,18rem) !important; line-height:0.9 !important; }
  .dk-score-sep { font-size:clamp(3rem,13vh,10rem) !important; }
  .dk-score-name { font-size:clamp(10px,2.2vh,30px) !important; }
  .dk-score-label { font-size:clamp(10px,2vh,24px) !important; margin-bottom:0.5vh !important; }
  .dk-score-area { margin-bottom:1vh !important; gap:1.5vw !important; }
  .dk-score-mt { margin-top:0 !important; }

  /* Right panel glass card */
  .dk-glass-right { padding:1.5vh 1rem !important; border-radius:2rem !important; }
  .dk-btn-add { padding-top:2.5vh !important; padding-bottom:2.5vh !important; border-radius:1.5rem !important; }
  .dk-btn-add .material-symbols-outlined { font-size:clamp(18px,3.5vh,48px) !important; }
  .dk-btn-add span:last-child { font-size:clamp(10px,1.8vh,20px) !important; }
  .dk-btn-sub { padding-top:1vh !important; padding-bottom:1vh !important; }
  .dk-btn-sub .material-symbols-outlined { font-size:clamp(12px,2vh,24px) !important; }
  .dk-btn-sub span:last-child { font-size:clamp(8px,1.4vh,16px) !important; }
  .dk-btn-action { padding-top:1vh !important; padding-bottom:1vh !important; }
  .dk-btn-action .material-symbols-outlined { font-size:clamp(12px,1.8vh,20px) !important; }
  .dk-grid-add { gap:1vh !important; margin-bottom:1vh !important; }
  .dk-grid-sub { gap:0.8vh !important; margin-bottom:0.8vh !important; }
  .dk-grid-act { gap:0.8vh !important; }

  /* Footer */
  .dk-footer { padding-top:0.5vh !important; padding-bottom:0.5vh !important; }

  /* Bottom Nav */
  .dk-nav button { padding-top:0.8vh !important; padding-bottom:0.8vh !important; }
  .dk-nav .material-symbols-outlined { font-size:clamp(16px,2.5vh,28px) !important; }
  .dk-nav span:last-child { font-size:clamp(7px,1vh,11px) !important; }
}
</style>
</head>

orkspace_premium:"\ue7af"};
function paintIcons(root){
    const scope = root || document;
    scope.querySelectorAll('.material-symbols-outlined:not([data-ico])').forEach(el=>{
        const name = el.textContent.trim();
        const glyph = PP_ICONS[name];
        if(glyph){ el.setAttribute('data-ico', name); el.textContent = glyph; }
        else if(name.length === 1){ el.setAttribute('data-ico','raw'); }
        else { el.setAttribute('data-ico','?'); el.textContent = PP_ICONS.circle || ''; }
    });
}
// Los modales/toasts se inyectan fuera de render(): un observer los cubre todos.
try{
    new MutationObserver(muts=>{
        for(const m of muts){ if(m.addedNodes.length){ paintIcons(document); return; } }
    }).observe(document.documentElement,{childList:true,subtree:true});
}catch(e){}

let timerInterval = null, betweenInterval = null;
let recognition = null, audioCtx = null;

let SPECTATOR = false; // modo solo lectura si viene de URL compartida

function loadState(){
    // 1. Intentar cargar desde URL (modo espectador)
    try{
        const hash = window.location.hash.slice(1);
        if(hash.startsWith('c=')){
            const code = hash.slice(2).toUpperCase();
            SPECTATOR = true;
            let ds = defaultState();
            ds.voiceActive = false; ds.timerRunning = false;
            ds.cloudCode = code;
            setTimeout(() => { if(window.joinCloudMatch) window.joinCloudMatch(code); }, 500);
            return ds;
        }
        if(hash.startsWith('pp=')){
            const encoded = hash.slice(3);
            let decoded;
            try { decoded = JSON.parse(decodeURIComponent(escape(atob(encoded)))); }
            catch(err) { decoded = JSON.parse(decodeURIComponent(atob(encoded))); }
            let ds = defaultState();
            if (Array.isArray(decoded) && decoded[0] === 1) {
                ds.teamA.name=decoded[1]; ds.teamA.games=decoded[2]; ds.teamA.sets=decoded[3]; ds.teamA.points=decoded[4]; ds.teamA.playerA=decoded[5]; ds.teamA.playerB=decoded[6];
                ds.teamB.name=decoded[7]; ds.teamB.games=decoded[8]; ds.teamB.sets=decoded[9]; ds.teamB.points=decoded[10]; ds.teamB.playerA=decoded[11]; ds.teamB.playerB=decoded[12];
                ds.setsHistory=decoded[13]; ds.currentSet=decoded[14]; ds.serving=decoded[15];
                ds.deuce=decoded[16]; ds.advantage=decoded[17]; ds.tiebreak=decoded[18];
                ds.tiebreakPoints={A:decoded[19], B:decoded[20]};
                ds.matchOver=decoded[21]; ds.matchWinner=decoded[22]; ds.gameTime=decoded[23]; ds.theme=decoded[24];
            } else {
                ds = { ...ds, ...decoded };
            }
            SPECTATOR = true;
            ds.voiceActive = false;
            ds.timerRunning = false;
            return ds;
        }
    }catch(e){}
    // 2. Cargar desde localStorage — merge with defaultState to ensure new fields exist
    try{
        const s=localStorage.getItem('pp_state_v4');
        if(s){
            const saved=JSON.parse(s);
            const merged=Object.assign(defaultState(), saved);
            return merged;
        }
    }catch(e){}
    return defaultState();
}

    // v2
    legacySync:'/padel/sync', legacyPoint:'/padel/point', legacyBt:'/padel/bt'
};

const PPSync = {
    // ── Estado del enlace (lo pinta la UI) ──
    connected:false,          // hay un reloj alcanzable
    paired:false,             // el reloj ha confirmado el codigo
    watchName:'',
    code:'',                  // codigo de 4 digitos que muestra el movil
    autoPair:true,            // aceptar vinculacion sin teclear codigo
    lastSync:0,
    watchApp:'',
    watchProto:0,
    protoMismatch:false,
    health:{hr:0,kcal:0,km:0,steps:0},
    _applyingRemote:false,
    _seq:0,
    _lastWatchSeq:-1,
    _pushTimer:null,
    _lastPushed:'',

    get bridge(){ return (typeof window!=='undefined' && window.AndroidBridge) ? window.AndroidBridge : null; },

    /** SOLO | PHONE | WATCH a partir de S.syncMode (que conserva los nombres de la UI). */
    mode(){
        const m = (S && S.syncMode ? String(S.syncMode) : 'SOLO').toUpperCase();
        if(m==='MOVIL_MANDA'||m==='PHONE'||m==='MOVIL') return 'PHONE';
        if(m==='RELOJ_MANDA'||m==='WATCH'||m==='RELOJ') return 'WATCH';
        return 'SOLO';
    },
    isMaster(){ return this.mode()==='PHONE'; },
    isRemoteControlled(){ return this.mode()==='WATCH'; },

    nextSeq(){
        const b=this.bridge;
        if(b && b.nextSeq){ try{ return parseInt(b.nextSeq(),10)||(++this._seq); }catch(e){} }
        return ++this._seq;
    },

    init(){
        try{
            const saved = localStorage.getItem('pp_pair_code');
            this.code = saved || this.generateCode();
            this.autoPair = localStorage.getItem('pp_auto_pair')!=='0';
            const b=this.bridge;
            if(b){
                if(b.loadPairing){
                    const p=JSON.parse(b.loadPairing()||'{}');
                    if(p.code) this.code=p.code;
                    this.paired=!!p.paired;
                }
                if(b.isWatchConnected) this.connected=!!b.isWatchConnected();
                if(b.watchName) this.watchName=b.watchName()||'';
                if(b.refreshConnection) b.refreshConnection();
            }
            localStorage.setItem('pp_pair_code', this.code);
        }catch(e){}
    },

    generateCode(){
        const c = String(Math.floor(1000+Math.random()*9000));
        try{ localStorage.setItem('pp_pair_code', c); }catch(e){}
        return c;
    },

    regenerateCode(){
        this.code = this.generateCode();
        this.paired = false;
        this.persistPairing();
        render();
        showToast('🔐 Codigo nuevo: '+this.code, 2500);
    },

    persistPairing(){
        const b=this.bridge;
        if(b && b.savePairing){ try{ b.savePairing(this.code, this.paired); }catch(e){} }
        try{ localStorage.setItem('pp_pair_code', this.code); }catch(e){}
    },

    send(path, obj){
        const b=this.bridge;
        if(!b || !b.send) return false;
        const msg = Object.assign({v:PP_PROTO, src:'phone', seq:this.nextSeq(), ts:Date.now()}, obj);
        try{ b.send(path, JSON.stringify(msg)); return true; }catch(e){ return false; }
    },

    // ── Construccion del estado canonico ──
    setsWon(team){
        return (S.setsHistory||[]).filter(s=>s.winner===team).length;
    },

    buildState(){
        return {
            mode:this.mode(),
            match:{
                bestOf:S.bestOf||3,
                goldenPoint:!!S.goldenPoint,
                superTieBreak:!!S.superTiebreak,
                currentSet:S.currentSet||1
            },
            teams:{
                A:{ name:S.teamA.name||'LOCAL',  pts:Math.max(0,Math.min(3,S.teamA.points|0)), games:S.teamA.games|0, sets:this.setsWon('A') },
                B:{ name:S.teamB.name||'VISITA', pts:Math.max(0,Math.min(3,S.teamB.points|0)), games:S.teamB.games|0, sets:this.setsWon('B') }
            },
            flags:{
                deuce:!!S.deuce,
                adv:S.advantage||'',            // nunca null: el reloj leia "null" como texto
                tiebreak:!!S.tiebreak,
                superTiebreak:!!S.superTiebreak,
                goldenPointActive:!!(S.deuce && S.goldenPoint),
                serving:S.serving||'A',
                faults:S.firstServeFault?1:0,
                over:!!S.matchOver,
                winner:S.matchWinner||''
            },
            tb:{
                A:(S.tiebreakPoints&&S.tiebreakPoints.A)|0,
                B:(S.tiebreakPoints&&S.tiebreakPoints.B)|0,
                serving:S.tiebreakServing||'A',
                n:S.tiebreakServCount|0
            },
            health:{ hr:S.heartRate|0, kcal:S.calories|0, km:+(S.distanceKm||0) },
            clock:S.gameTime|0
        };
    },

    /** Aplica un estado del reloj. No recalcula nada: el maestro ya lo hizo. */
    applyState(st){
        if(!st || !st.teams) return;
        this._applyingRemote = true;
        try{
            const A=st.teams.A||{}, B=st.teams.B||{}, f=st.flags||{}, tb=st.tb||{};
            S.teamA.points = Math.max(0,Math.min(3, (A.pts!==undefined?A.pts:A.points)|0));
            S.teamB.points = Math.max(0,Math.min(3, (B.pts!==undefined?B.pts:B.points)|0));
            S.teamA.games  = A.games|0;
            S.teamB.games  = B.games|0;
            if(A.name) S.teamA.name = A.name;
            if(B.name) S.teamB.name = B.name;

            // Sets: el reloj manda el numero, aqui reconstruimos el historial
            // para que las vistas de sets y estadisticas cuadren.
            this.rebuildSetsHistory(A.sets|0, B.sets|0);

            S.deuce = !!f.deuce;
            S.advantage = (f.adv && f.adv!=='null' && f.adv!=='') ? f.adv
                        : ((f.advantage && f.advantage!=='null' && f.advantage!=='') ? f.advantage : null);
            S.tiebreak = !!f.tiebreak;
            S.superTiebreak = !!f.superTiebreak;
            if(f.serving) S.serving = f.serving;
            S.firstServeFault = (f.faults|0) > 0;

            S.tiebreakPoints = { A:tb.A|0, B:tb.B|0 };
            if(tb.serving) S.tiebreakServing = tb.serving;
            S.tiebreakServCount = tb.n|0;

            if(st.match){
                if(st.match.bestOf) S.bestOf = st.match.bestOf;
                if(typeof st.match.goldenPoint==='boolean') S.goldenPoint = st.match.goldenPoint;
                if(st.match.currentSet) S.currentSet = st.match.currentSet;
            }
            if(typeof st.clock==='number' && st.clock>0) S.gameTime = st.clock;
            if(st.health) this.applyHealth(st.health);

            const wasOver = S.matchOver;
            S.matchOver = !!f.over;
            S.matchWinner = (f.winner && f.winner!=='null' && f.winner!=='') ? f.winner : null;

            this.lastSync = Date.now();
            saveStateOnly();
            render();
            if(S.matchOver && !wasOver && typeof showMatchOver==='function'){
                showMatchOver(S.matchWinner||'A');
            }
        }catch(e){
            console.error('PPSync.applyState', e);
        }finally{
            this._applyingRemote = false;
        }
    },

    rebuildSetsHistory(setsA, setsB){
        const curA=this.setsWon('A'), curB=this.setsWon('B');
        if(curA===setsA && curB===setsB) return;
        const hist=[];
        for(let k=0;k<setsA;k++) hist.push({winner:'A', a:6, b:0});
        for(let k=0;k<setsB;k++) hist.push({winner:'B', a:0, b:6});
        S.setsHistory = hist;
        S.currentSet = setsA + setsB + 1;
    },

    applyHealth(h){
        if(!h) return;
        const hr=(h.hr!==undefined?h.hr:h.heartRate)|0;
        const kcal=(h.kcal!==undefined?h.kcal:h.calories)|0;
        const km=+(h.km!==undefined?h.km:h.distanceKm)||0;
        this.health={hr:hr, kcal:kcal, km:km, steps:h.steps|0};
        if(hr>0) S.heartRate = hr;
        // El reloj es la fuente de verdad: el movil deja de estimar calorias.
        if(kcal>0 || km>0){
            S.healthFromWatch = true;
            S.calories = kcal;
            S.distanceKm = km;
        }
    },

    // ── Salidas ──

    /**
     * Difunde el estado. Solo si mandamos nosotros.
     * Un punto dispara varios saveState(), asi que agrupamos: un envio cada
     * 120 ms como mucho, y nunca dos veces el mismo estado. Cada mensaje por
     * Bluetooth cuesta bateria en la muñeca.
     */
    push(){
        if(this._applyingRemote) return;
        if(!this.paired || !this.isMaster()) return;
        if(this._pushTimer) return;
        this._pushTimer = setTimeout(()=>{
            this._pushTimer = null;
            if(this._applyingRemote || !this.paired || !this.isMaster()) return;
            const st = this.buildState();
            const json = JSON.stringify(st);
            if(json === this._lastPushed) return;
            this._lastPushed = json;
            this.send(PP_PATH.state, st);
            this.lastSync = Date.now();
        }, 120);
    },

    /** Fuerza el envio inmediato saltandose la agrupacion (boton Sincronizar). */
    pushNow(){
        if(!this.paired || !this.isMaster()) return;
        if(this._pushTimer){ clearTimeout(this._pushTimer); this._pushTimer = null; }
        const st = this.buildState();
        this._lastPushed = JSON.stringify(st);
        this.send(PP_PATH.state, st);
        this.lastSync = Date.now();
    },

    /** Manda una accion cuando el maestro es el reloj. */
    cmd(action, team){
        if(this._applyingRemote) return;
        if(!this.paired || !this.isRemoteControlled()) return;
        this.send(PP_PATH.cmd, team ? {action:action, team:team} : {action:action});
    },

    /** Punto unico tras cualquier accion local sobre el marcador. */
    onLocalAction(action, team){
        if(this.isMaster()) this.push();
        else if(this.isRemoteControlled()) this.cmd(action, team);
    },

    sendSettings(){
        if(!this.paired) return;
        this.send(PP_PATH.settings, {
            lang:S.lang||'es',
            theme:S.theme||'neon',
            color:(typeof T==='function' ? (T().primary||'#00FD87') : '#00FD87'),
            goldenPoint:!!S.goldenPoint,
            superTieBreak:!!S.superTiebreak,
            bestOf:S.bestOf||3,
            maxSets:S.bestOf||3,
            nameA:S.teamA.name||'LOCAL',
            nameB:S.teamB.name||'VISITA',
            mode:this.mode()
        });
    },

    hello(){
        this.send(PP_PATH.hello, {app:'5.0.6', proto:PP_PROTO, mode:this.mode(), paired:this.paired});
    },

    /**
     * Manda la sesion al reloj para que no haya que teclear contraseñas en la
     * muñeca. Viaja por el canal cifrado del sistema entre dos dispositivos ya
     * emparejados, no sale a internet.
     */
    sendAccountToWatch(){
        if(typeof Auth==='undefined') return;
        if(!this.paired) return;
        if(Auth.isIn){
            this.send(PP_PATH.account, {
                action:'session',
                email: (Auth.user&&Auth.user.email)||'',
                name:  (Auth.user&&Auth.user.display_name)||'',
                token: Auth.session.access_token,
                refresh: Auth.session.refresh_token,
                expires: Auth.session.expires_at
            });
        } else {
            this.send(PP_PATH.account, {action:'signout'});
        }
    },

    requestHealth(){ this.send(PP_PATH.health, {request:true}); },

    // ── Entradas desde Kotlin ──

    onConnection(connected, name){
        const was=this.connected;
        this.connected=!!connected;
        this.watchName=name||this.watchName;
        if(this.connected && !was){
            this.hello();
            if(this.paired){ this.sendSettings(); this.push(); }
        }
        if(!this.connected) this._lastWatchSeq=-1;
        if(typeof render==='function' && !SPECTATOR) render();
    },

    /** Vacia el buzon de mensajes que llegaron con la app cerrada. */
    drainNative(json){
        let list=[];
        try{ list=JSON.parse(json||'[]'); }catch(e){ return; }
        list.forEach(m=>{ try{ this.onNative(m.path, m.payload); }catch(e){} });
    },

    onNative(path, payload){
        let obj;
        try{ obj = JSON.parse(payload); }catch(e){ return; }

        // Anti-eco: descartamos lo repetido o desordenado
        const seq = +obj.seq || 0;
        if(seq > 0){
            if(seq <= this._lastWatchSeq) return;
            this._lastWatchSeq = seq;
        }
        this.connected = true;

        switch(path){
            case PP_PATH.hello:
                this.watchApp = obj.app||'';
                this.watchProto = +obj.proto||0;
                this.protoMismatch = this.watchProto>0 && this.watchProto!==PP_PROTO;
                if(this.protoMismatch){
                    showToast('⚠️ Actualiza la app del reloj: protocolo v'+this.watchProto+' vs v'+PP_PROTO, 4000, true);
                }
                if(this.paired) this.sendSettings();
                render();
                break;

            case PP_PATH.pair:
            case PP_PATH.legacyBt:
                this.onPairRequest(obj);
                break;

            case PP_PATH.state:
            case PP_PATH.legacySync:
                // Solo obedecemos al reloj cuando el reloj es el maestro
                if(this.mode()!=='WATCH') { if(obj.health) this.applyHealth(obj.health); break; }
                this.applyState(obj.snapshot ? JSON.parse(obj.snapshot) : obj);
                break;

            case PP_PATH.cmd:
            case PP_PATH.legacyPoint:
                this.onCommand(obj);
                break;

            case PP_PATH.settings:
                this.onSettings(obj);
                break;

            case PP_PATH.health:
                this.applyHealth(obj);
                render();
                break;
        }
    },

    onPairRequest(obj){
        const action = obj.action||'request';
        const code = String(obj.code||'');
        if(action!=='request' && !obj.code) return;

        const ok = (code===this.code) || (this.autoPair && (code==='AUTO'||code===''));
        if(ok){
            this.paired = true;
            this.persistPairing();
            this.send(PP_PATH.pair, {action:'accept', code:this.code, device:'movil'});
            const b=this.bridge; if(b&&b.vibrate) b.vibrate(60);
            showToast('⌚ Reloj vinculado'+(obj.device?' — '+obj.device:''), 2600);
            this.sendSettings();
            this.sendAccountToWatch();
            this.pushNow();
        }else{
            this.send(PP_PATH.pair, {action:'reject', code:this.code});
            showToast('⚠️ El codigo del reloj no coincide ('+code+')', 3000, true);
        }
        render();
    },

    onCommand(obj){
        // Un comando solo se obedece si el maestro somos nosotros
        if(!this.isMaster()) return;
        const team = obj.team || (obj.action==='point_B' ? 'B' : 'A');
        switch(obj.action){
            case 'point': case 'point_A': case 'point_B': addPoint(team); break;
            case 'minus': removePoint(team); break;
            case 'undo':  undoPoint(); break;
            case 'fault': if(typeof addFault==='function') addFault(S.serving,'doubleFault'); break;
            case 'serve': S.serving = team; saveState(); render(); break;
            case 'reset': if(typeof newMatch==='function') newMatch(); break;
        }
        this.push();
    },

    onSettings(obj){
        let changed=false;
        if(obj.lang && obj.lang!==S.lang){ S.lang=obj.lang; if(typeof setLang==='function') setLang(obj.lang); changed=true; }
        if(obj.theme && obj.theme!==S.theme){ S.theme=obj.theme; changed=true; }
        if(typeof obj.goldenPoint==='boolean'){ S.goldenPoint=obj.goldenPoint; changed=true; }
        const bo = obj.bestOf || obj.maxSets;
        if(bo && [1,3,5].includes(+bo)){ S.bestOf=+bo; changed=true; }
        if(obj.nameA){ S.teamA.name=obj.nameA; changed=true; }
        if(obj.nameB){ S.teamB.name=obj.nameB; changed=true; }
        if(obj.mode){
            const m = String(obj.mode).toUpperCase();
            const mapped = (m==='PHONE'||m==='MOVIL_MANDA') ? 'MOVIL_MANDA'
                         : (m==='WATCH'||m==='RELOJ_MANDA') ? 'RELOJ_MANDA' : 'SOLO';
            if(mapped!==S.syncMode){ S.syncMode=mapped; changed=true; }
        }
        if(changed){ saveStateOnly(); render(); }
    },

    /** Texto corto de estado para la UI. */
    statusLabel(){
        if(!this.connected) return i2('SIN RELOJ','NO WATCH');
        if(!this.paired)    return i2('SIN VINCULAR','NOT LINKED');
        if(this.protoMismatch) return i2('ACTUALIZA','UPDATE');
        return i2('CONECTADO','CONNECTED');
    },
    statusColor(){
        if(!this.connected) return '#FF4E50';
        if(!this.paired || this.protoMismatch) return '#FFB020';
        return (typeof tc!=='undefined' && tc.primary) ? tc.primary() : '#00FD87';
    }
};

/** Mini helper: texto en espanol o ingles segun el idioma activo. */
function i2(es, en){ return (S && S.lang==='es') ? es : en; }

window.PPSync = PPSync;

// ═══════════════════════════════════════════════════════════════════
// Panel de sincronizacion con el reloj (pantalla de Ajustes).
// Se sigue llamando BT porque es el nombre que usa SettingsView, pero ya no
// habla Web Bluetooth: el transporte es Wearable MessageClient via PPSync.
// ═══════════════════════════════════════════════════════════════════
const BT = {
    get pairingCode(){ return PPSync.code; },
    set pairingCode(v){ PPSync.code = v; },
    get connected(){ return PPSync.connected && PPSync.paired; },

    generateCode(){ return PPSync.generateCode(); },
    regenerate(){ PPSync.regenerateCode(); },

    setMode(mode){
        S.syncMode = mode;
        saveState();
        PPSync.sendSettings();
        if(mode!=='SOLO' && !PPSync.connected){
            showToast(i2('Abre PadelPulse en el reloj','Open PadelPulse on the watch'), 3000);
        }
        if(PPSync.isMaster()) PPSync.push();
        render();
    },

    toggleAutoPair(){
        PPSync.autoPair = !PPSync.autoPair;
        try{ localStorage.setItem('pp_auto_pair', PPSync.autoPair?'1':'0'); }catch(e){}
        render();
    },

    unlink(){
        PPSync.paired = false;
        PPSync.persistPairing();
        showToast(i2('Reloj desvinculado','Watch unlinked'), 2200, true);
        render();
    },

    resync(){
        PPSync.hello();
        PPSync.sendSettings();
        if(PPSync.isMaster()) PPSync.pushNow(); else PPSync.requestHealth();
        showToast(i2('Reenviando al reloj…','Resyncing…'), 1800);
    },

    panel(){
        const p = tc.primary(), mu = tc.muted(), su = tc.surf2();
        const st = PPSync.statusColor();
        const label = PPSync.statusLabel();
        const mode = S.syncMode || 'SOLO';
        const modes = [
            {id:'SOLO',         ico:'link_off',    lbl:i2('Solo','Solo'),       sub:i2('Sin reloj','No watch')},
            {id:'MOVIL_MANDA',  ico:'devices', lbl:i2('Movil','Phone'),  sub:i2('Manda el movil','Phone leads')},
            {id:'RELOJ_MANDA',  ico:'watch',      lbl:i2('Reloj','Watch'),sub:i2('Manda el reloj','Watch leads')}
        ];
        const since = PPSync.lastSync ? Math.round((Date.now()-PPSync.lastSync)/1000) : null;

        return `
        <div class="bg-surface-container rounded-3xl p-4 mb-3">
            <!-- Cabecera: estado real del enlace -->
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined" style="color:${p}">watch</span>
                    <div class="flex flex-col">
                        <span class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest">${i2('Sincronizacion con reloj','Watch sync')}</span>
                        ${PPSync.watchName?`<span class="text-[8px] text-on-surface-variant/60 truncate max-w-[130px]">${PPSync.watchName}</span>`:''}
                    </div>
                </div>
                <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full" style="background:${st}18;border:1px solid ${st}40">
                    <div class="w-1.5 h-1.5 rounded-full ${PPSync.connected?'animate-pulse-slow':''}" style="background:${st}"></div>
                    <span class="text-[8px] font-bold uppercase tracking-wider" style="color:${st}">${label}</span>
                </div>
            </div>

            ${PPSync.protoMismatch?`
            <div class="rounded-2xl p-2.5 mb-3 flex items-start gap-2" style="background:rgba(255,176,32,0.1);border:1px solid rgba(255,176,32,0.3)">
                <span class="material-symbols-outlined text-[14px]" style="color:#FFB020">warning</span>
                <span class="text-[9px] leading-relaxed" style="color:#FFB020">
                    ${i2('Las dos apps hablan protocolos distintos. Actualiza PadelPulse en el reloj desde Play Store.',
                          'The two apps speak different protocols. Update PadelPulse on the watch from Play Store.')}
                </span>
            </div>`:''}

            <!-- Modo de sincronizacion -->
            <div class="grid grid-cols-3 gap-2 mb-3">
                ${modes.map(m=>{
                    const sel = mode===m.id;
                    return `<button onclick="BT.setMode('${m.id}')"
                        class="py-2.5 px-1 flex flex-col items-center justify-center gap-1 rounded-2xl border scale-press"
                        style="background:${sel?p+'18':su};border-color:${sel?p+'55':'rgba(255,255,255,0.06)'};color:${sel?p:mu}">
                        <span class="material-symbols-outlined text-[18px]">${m.ico}</span>
                        <span class="text-[7px] font-black uppercase text-center leading-tight">${m.lbl}</span>
                        <span class="text-[6px] uppercase text-center leading-tight opacity-60">${m.sub}</span>
                    </button>`;
                }).join('')}
            </div>

            ${mode==='SOLO' ? `
            <div class="text-[9px] leading-relaxed px-1" style="color:${mu}">
                ${i2('En modo Solo el movil y el reloj llevan marcadores independientes. Elige quien manda para sincronizarlos.',
                      'In Solo mode phone and watch keep separate scores. Pick who leads to sync them.')}
            </div>` : `

            <!-- Vinculacion -->
            <div class="rounded-2xl p-3 mb-2" style="background:${su};border:1px solid rgba(255,255,255,0.04)">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[8px] uppercase font-bold" style="color:${mu}">${i2('Codigo de vinculacion','Pairing code')}</span>
                    <button onclick="BT.regenerate()" class="text-[8px] uppercase font-bold flex items-center gap-1 scale-press" style="color:${mu}">
                        <span class="material-symbols-outlined text-[11px]">refresh</span>${i2('Nuevo','New')}
                    </button>
                </div>
                <div class="flex items-center gap-2 mb-2">
                    ${String(PPSync.code).padEnd(4,'-').split('').slice(0,4).map(d=>`
                        <div class="flex-1 py-2 rounded-xl text-center text-[22px] font-black tracking-widest"
                             style="background:rgba(0,0,0,0.45);border:1px solid ${p}35;color:${p}">${d}</div>`).join('')}
                </div>
                <div class="text-[9px] leading-relaxed mb-2" style="color:${mu}">
                    ${PPSync.paired
                        ? i2('Reloj vinculado. El marcador viaja en los dos sentidos.','Watch linked. The score travels both ways.')
                        : i2('Abre PadelPulse en el reloj, entra en Vincular y teclea este codigo.','Open PadelPulse on the watch, go to Link and type this code.')}

// Toda accion local sobre el marcador avisa al reloj por un unico camino.
const _addPoint = addPoint;
addPoint = function(t){ _addPoint(t); PPSync.onLocalAction('point', t); };
const _removePoint = removePoint;
removePoint = function(t){ _removePoint(t); PPSync.onLocalAction('minus', t); };
const _undoPoint = undoPoint;
undoPoint = function(){ _undoPoint(); PPSync.onLocalAction('undo'); };
const _resetMatch = resetMatch;
resetMatch = function(){ _resetMatch(); PPSync.onLocalAction('reset'); };

let S = loadState();
if (!S.syncMode) S.syncMode = "SOLO";


// Normalizar campos que pueden estar corruptos de versiones anteriores
if(!S.bestOf || ![1,3,5].includes(S.bestOf)) S.bestOf = 3;
if(typeof S.playingExtraSet === 'undefined') S.playingExtraSet = false;

// ── Detectar y recuperar estado corrupto ──
// Si matchOver=true pero hay un partido claramente en progreso, resetear
(()=>{
    if(!S.matchOver) return;
    // Si no hay ganador definido → corrupto
    if(!S.matchWinner){ S.matchOver=false; return; }

    const sA=( S.setsHistory||[]).filter(s=>s.winner==='A').length;
    const sB=(S.setsHistory||[]).filter(s=>s.winner==='B').length;
    const totalSets = sA+sB;
    const setsToWin = Math.ceil((S.bestOf||3)/2);

    // Si hay juegos activos en el set actual, el partido no debería estar terminado
    const activeGames = (S.teamA?.games||0)+(S.teamB?.games||0);
    const activePoints = (S.teamA?.points||0)+(S.teamB?.points||0);

    // Caso: matchOver=true pero hay juegos/puntos en curso → partido truncado
    if(activeGames > 0 || activePoints > 0){
        S.matchOver=false; S.matchWinner=null; return;
    }

    // Caso: totalSets <= setsToWin → ganador no alcanzó sets suficientes → corrupto
    if(totalSets > 0 && totalSets <= setsToWin && sA < setsToWin && sB < setsToWin){
        S.matchOver=false; S.matchWinner=null; return;
    }
})();

// Set default team names from current language (called after LANGS is defined)
function initTeamNames(){
    if(!S.teamA.name) S.teamA.name = i('teamA').toUpperCase();
    if(!S.teamB.name) S.teamB.name = i('teamB').toUpperCase();
}
function saveState(){
    try{
        localStorage.setItem('pp_state_v4',JSON.stringify(S));
        // El estado solo sale hacia el reloj si mandamos nosotros; PPSync.push()
        // ya se protege contra el eco de un estado que acabamos de recibir.
        if(typeof PPSync!=='undefined') PPSync.push();
    }catch(e){}
}

// Función para guardar localmente sin disparar sincronización (evita bucles infinitos)
function saveStateOnly() {
    try { localStorage.setItem('pp_state_v4', JSON.stringify(S)); } catch(e) {}
}


function setLang(code) {
    S.lang = code;
    saveState();
    render();
}


// 4. GESTIÓN DE VOZ DESDE EL RELOJ
window.procesarVoz = function(texto) {
    if (!texto) return;
    console.log("Voz desde el reloj:", texto);
    const t = texto.toLowerCase();

    if (t.includes("punto para local") || t.includes("punto local") || t.includes("punto para uno") || t.includes("punto uno") || t.includes("suma local")) {
        addPoint('A');
    } else if (t.includes("punto para visita") || t.includes("punto visita") || t.includes("punto para dos") || t.includes("punto dos") || t.includes("suma visita")) {
        addPoint('B');
    } else if (t.includes("deshacer") || t.includes("error") || t.includes("borrar")) {
        undoPoint();
    }
};

window.actualizarMarcador = function(data) { console.log("Legacy sync ignored:", data); };

// Helper — get translation
function i(key, vars={}){
    const lang = S.lang||'es';
    const t = (LANGS[lang]||LANGS.es).t;
    let str = t[key] || LANGS.es.t[key] || key;
    Object.entries(vars).forEach(([k,v])=>{ str = str.replace('%'+k, v); });
    return str;
}
function currentLang(){ return LANGS[S.lang||'es']||LANGS.es; }
function setLang(code){
    const oldLang = S.lang||'es';
    // If team names are still the default, auto-translate them
    const oldA = (LANGS[oldLang]||LANGS.es).t.teamA.toUpperCase();
    const oldB = (LANGS[oldLang]||LANGS.es).t.teamB.toUpperCase();
    S.lang = code;
    if(!S.teamA.name || S.teamA.name===oldA) S.teamA.name = i('teamA').toUpperCase();
    if(!S.teamB.name || S.teamB.name===oldB) S.teamB.name = i('teamB').toUpperCase();
    if(recognition){ stopVoice(); }
    saveState(); render();
}

function applyTheme(id){
    const t = THEMES[id] || THEMES.neon;
    const r = document.documentElement.style;
    r.setProperty('--t-bg',      t.bg);
    r.setProperty('--t-surf',    t.surface);
    r.setProperty('--t-surf2',   t.surface2);
    r.setProperty('--t-border',  t.border);
    r.setProperty('--t-text',    t.text);
    r.setProperty('--t-muted',   t.muted);
    r.setProperty('--t-primary', t.primary);
    r.setProperty('--t-glow',    t.primaryGlow);
    r.setProperty('--t-accent',  t.accent);
    r.setProperty('--t-error',   t.error);
    r.setProperty('--t-btnA',    t.btnA);
    r.setProperty('--t-btnAt',   t.btnAText);
    r.setProperty('--t-btnB',    t.btnB);
    r.setProperty('--t-btnBt',   t.btnBText);
    r.setProperty('--t-sa',      t.scoreActive);
    r.setProperty('--t-si',      t.scoreInactive);
    document.getElementById('app').style.background = t.bg;
    document.body.style.background = t.bg;
    // Update pulse-glow
    const style = document.getElementById('theme-style') || document.createElement('style');
    style.id = 'theme-style';
    style.textContent = `
        .pulse-glow{box-shadow:0 0 20px ${t.primaryGlow}!important;}
        .mic-active{box-shadow:0 0 20px rgba(255,113,108,0.5)!important;}
        input[type=range]::-webkit-slider-thumb{background:${t.primary}!important;}
        .watch-frame{background:${t.bg}!important;}
        body{background:${t.bg}!important;}
    `;
    if(!style.parentNode) document.head.appendChild(style);
}

function updateFooterTime(){
    const el=document.getElementById('footer-time');
    if(el) el.textContent=formatTime(S.gameTime);
}
const formatTime=(s)=>{
    const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    return h>0?`${pad(h)}:${pad(m)}:${pad(sec)}`:`${pad(m)}:${pad(sec)}`;
};
const pad=n=>String(n).padStart(2,'0');

// ═══════════════════════════════════════════
// BETWEEN POINTS TIMER
// ═══════════════════════════════════════════
function startBetweenTimer(max=20){
    if(betweenInterval) clearInterval(betweenInterval);
    S.betweenPoints=true; S.betweenTimer=max; S.betweenMax=max;
    renderBetweenTimer();
    betweenInterval=setInterval(()=>{
        S.betweenTimer--;
        renderBetweenTimer();
        if(S.betweenTimer<=0){ 
            clearInterval(betweenInterval); betweenInterval=null; S.betweenPoints=false; hideBetweenTimer(); 
            if(S.soundEnabled) beep(880,0.15); 
            if(S.serveTimerEnabled && !S.matchOver) {
                showToast('⏱️ Tiempo excedido', 2000);
                addFault(S.serving, 'footFault');
            }
        }
    },1000);
}
function renderBetweenTimer(){
    const el=document.getElementById('between-timer');
    if(!el) return;
    const pct=(S.betweenTimer/S.betweenMax)*100;
    el.querySelector('#bt-num').textContent=S.betweenTimer;
    const ring=el.querySelector('.bt-ring');
    if(ring){ const r=28; const circ=2*Math.PI*r; ring.style.strokeDashoffset=circ*(1-pct/100); }
    if(S.betweenTimer<=5) el.querySelector('#bt-num').classList.add('timer-warn','text-error');
    else el.querySelector('#bt-num').classList.remove('timer-warn','text-error');
}
function hideBetweenTimer(){ const el=document.getElementById('between-timer'); if(el) el.remove(); }
function showBetweenTimerEl(max){
    hideBetweenTimer();
    const el=document.createElement('div');
    el.id='between-timer';
    const r=28,circ=2*Math.PI*r;
    el.style.cssText='position:fixed;z-index:99;bottom:90px;right:16px;z-index:50;';
    el.innerHTML=`<div class="relative flex items-center justify-center w-16 h-16">
        <svg width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="#262626" stroke-width="4"/>
            <circle class="bt-ring countdown-ring" cx="32" cy="32" r="${r}" fill="none" stroke="#00fd87" stroke-width="4"
                stroke-dasharray="${circ}" stroke-dashoffset="0" style="transition:stroke-dashoffset 0.9s linear;"/>
        </svg>
        <span id="bt-num" class="absolute text-on-surface font-black text-lg">${max}</span>
    </div>`;
    document.body.appendChild(el);
}

// AUDIO
// ═══════════════════════════════════════════
function getAudio(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(f=880,d=0.08,t='sine',v=0.2){
    if(!S.soundEnabled) return;
    const c=getAudio(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
    o.start();o.stop(c.currentTime+d);
}
function soundPoint(){ beep(660,0.07);setTimeout(()=>beep(880,0.07),80); }
function soundGame(){ [440,550,660,770].forEach((f,i)=>setTimeout(()=>beep(f,0.12),i*75)); }
function soundSet(){ [330,440,550,660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,0.15),i*80)); }
function soundMatch(){ [330,440,550,660,440,660,880].forEach((f,i)=>setTimeout(()=>beep(f,0.2),i*100)); }
function soundDeuce(){ beep(440,0.15,'square',0.1);setTimeout(()=>beep(440,0.15,'square',0.1),200); }
function soundUndo(){ beep(300,0.1); }
function soundWarning(){ beep(220,0.3,'sawtooth',0.15); }
function soundTiebreak(){ [880,660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,0.1),i*100)); }

function getScoreDisplay(){
    if(S.matchOver) return {scoreA:'FIN',scoreB:'FIN',label:null,isDeuce:false};
    // Super tie-break (a 10) — prioridad máxima
    if(S.superTiebreak){
        return {
            scoreA:String(S.tiebreakPoints.A), scoreB:String(S.tiebreakPoints.B),
            label:i('superTiebreak'), isDeuce:false, isTiebreak:true
        };
    }
    // Tie-break normal (a 7)
    if(S.tiebreak){
        return {
            scoreA:String(S.tiebreakPoints.A), scoreB:String(S.tiebreakPoints.B),
            label:i('tiebreak'), isDeuce:false, isTiebreak:true
        };
    }
    if(S.deuce){
        if(S.goldenPoint) return {scoreA:'40',scoreB:'40',label:i('goldenPoint'),isDeuce:true};
        if(S.advantage==='A') return {scoreA:'AD',scoreB:'40',label:i('advantage')+' '+S.teamA.name,isDeuce:true};
        if(S.advantage==='B') return {scoreA:'40',scoreB:'AD',label:i('advantage')+' '+S.teamB.name,isDeuce:true};
        return {scoreA:'40',scoreB:'40',label:i('deuce'),isDeuce:true};
    }
    return {scoreA:POINT_LABELS[S.teamA.points]||'0',scoreB:POINT_LABELS[S.teamB.points]||'0',label:null,isDeuce:false};
}

// ═══════════════════════════════════════════
// LÓGICA COMPLETA
// ═══════════════════════════════════════════
function snapshot(){
    S.history.push(JSON.parse(JSON.stringify({
        teamA:S.teamA, teamB:S.teamB, setsHistory:S.setsHistory,
        currentSet:S.currentSet, serving:S.serving, deuce:S.deuce,
        advantage:S.advantage, tiebreak:S.tiebreak, superTiebreak:S.superTiebreak,
        tiebreakPoints:{...S.tiebreakPoints},
        tiebreakServing:S.tiebreakServing, tiebreakServCount:S.tiebreakServCount,
        matchOver:S.matchOver, matchWinner:S.matchWinner,
        faults:JSON.parse(JSON.stringify(S.faults)),
        goldenPoint:S.goldenPoint, bestOf:S.bestOf,
        playingExtraSet:S.playingExtraSet||false,
        momentum:S.momentum.slice(-200)
    })));
    if(S.history.length>50) S.history.shift();
}

function addPoint(team){
    if(S.matchOver){
        // Safety: if there are active games/points but matchOver=true, it's a corrupt state — recover
        const activeGames=(S.teamA.games||0)+(S.teamB.games||0);
        const activePoints=(S.teamA.points||0)+(S.teamB.points||0);
        if(activeGames>0||activePoints>0){
            S.matchOver=false; S.matchWinner=null;
            saveState();
        } else {
            return;
        }
    }
    snapshot();
    S.firstServeFault = false;
    flashScore(team);
    S.momentum.push({team, time:S.gameTime, set:S.currentSet, game:S.teamA.games+S.teamB.games});
    if(S.momentum.length>200) S.momentum.shift();

    // SUPERDESEMPATE (a 10, tiene prioridad)
    if(S.superTiebreak){ addSuperTiebreakPoint(team); return; }

    // TIEBREAK normal (a 7)
    if(S.tiebreak){ addTiebreakPoint(team); return; }

    const other=team==='A'?'B':'A';

    // DEUCE / VENTAJA / PUNTO ORO
    if(S.deuce){
        if(S.goldenPoint){ winGame(team); return; }
        if(S.advantage===null){ S.advantage=team; soundPoint(); render(); saveState(); return; }
        if(S.advantage===team){ winGame(team); return; }
        else{ S.advantage=null; soundDeuce(); logActivity('deuce',null); render(); saveState(); return; }
    }

    S['team'+team].points++;
    const pts=S['team'+team].points, ptsOther=S['team'+other].points;

    if(pts>=3&&ptsOther>=3){ S.deuce=true; S.advantage=null; soundDeuce(); logActivity('deuce',null); render(); saveState(); checkServeTimer(); return; }
    if(pts>=4){ winGame(team); return; }
    soundPoint(); render(); saveState(); checkServeTimer();
}

function checkServeTimer(){
    if(!S.matchOver && S.serveTimerEnabled) {
        showBetweenTimerEl(S.serveTimerSeconds);
        startBetweenTimer(S.serveTimerSeconds);
    }
}

function addTiebreakPoint(team){
    if(S.matchOver) return;
    snapshot();
    S.firstServeFault = false;
    S.tiebreakPoints[team]++;
    S.tiebreakServCount++;
    // Cambio saque: primero tras 1 punto, luego cada 2
    if(S.tiebreakServCount===1||(S.tiebreakServCount>1&&S.tiebreakServCount%2===1)){
        S.tiebreakServing=S.tiebreakServing==='A'?'B':'A';
        S.serving=S.tiebreakServing;
    }
    const pA=S.tiebreakPoints.A, pB=S.tiebreakPoints.B;
    if((pA>=7||pB>=7)&&Math.abs(pA-pB)>=2){
        const w=pA>pB?'A':'B';
        // Pasar juegos reales del set (6-6) al historial
        winSet(w, S.teamA.games, S.teamB.games, true);
    } else {
        soundPoint(); render(); saveState(); checkServeTimer();
        if((pA+pB)%6===0) showToast(i('sideChange'),2000);
    }
}

function addSuperTiebreakPoint(team){
    if(S.matchOver) return;
    snapshot();
    S.firstServeFault = false;
    S.tiebreakPoints[team]++;
    S.tiebreakServCount++;
    // Cambio saque: primero tras 1 punto, luego cada 2
    if(S.tiebreakServCount===1||(S.tiebreakServCount>1&&S.tiebreakServCount%2===1)){
        S.tiebreakServing=S.tiebreakServing==='A'?'B':'A';
        S.serving=S.tiebreakServing;
    }
    const pA=S.tiebreakPoints.A, pB=S.tiebreakPoints.B;
    // Ganar: 10+ puntos con diferencia de 2
    if((pA>=10||pB>=10) && Math.abs(pA-pB)>=2){
        const w=pA>pB?'A':'B';
        winSet(w, pA, pB, true); // pasar puntos del TB como marcador del set
    } else {
        soundPoint(); render(); saveState(); checkServeTimer();
        // Aviso cambio de lado cada 6 puntos
        if((pA+pB)%6===0) showToast(i('sideChange'),2000);
    }
}

function winGame(team){
    soundGame();
    S['team'+team].games++;
    S.teamA.points=0; S.teamB.points=0;
    S.deuce=false; S.advantage=null;
    S.serving=S.serving==='A'?'B':'A';
    logActivity('game',team);
    if(!S.healthFromWatch) S.calories=Math.round(S.gameTime/60*7.5); // estimacion solo sin reloj

    const gA=S.teamA.games, gB=S.teamB.games;

    // Tie-break a 6-6
    if(gA===6&&gB===6&&!S.superTiebreak){
        S.tiebreak=true;
        S.tiebreakPoints={A:0,B:0};
        S.tiebreakServing=S.serving;
        S.tiebreakServCount=0;
        soundTiebreak();
        showToast(i('tiebreakAlert'),3000);
        render(); saveState();
        return; // NO llamar showBetweenTimer aquí
    }

    // ¿Gana el set?
    let setWinner=null;
    if(gA>=6&&gA-gB>=2) setWinner='A';
    else if(gB>=6&&gB-gA>=2) setWinner='B';

    if(setWinner){
        winSet(setWinner,gA,gB,false);
        // winSet gestiona todo — NO llamar showBetweenTimer
    } else {
        render(); saveState();
        showBetweenTimerEl(20); startBetweenTimer(20);
    }
}

function winSet(team,gA,gB,fromTiebreak){
    soundSet();

    // 1. Guardar el set en historial
    S.setsHistory.push({
        a:gA, b:gB, winner:team,
        tiebreak:fromTiebreak||false,
        tbA:fromTiebreak?S.tiebreakPoints.A:0,
        tbB:fromTiebreak?S.tiebreakPoints.B:0
    });

    // 2. Capturar actividad ANTES del reset
    logActivity('set', team);

    // 3. Reset estado del set
    S.teamA.games=0; S.teamB.games=0;
    S.teamA.points=0; S.teamB.points=0;
    S.deuce=false; S.advantage=null;
    S.tiebreak=false; S.superTiebreak=false;
    S.tiebreakPoints={A:0,B:0};
    S.tiebreakServCount=0;
    S.serving = team==='A'?'B':'A';
    S.currentSet++;
    S.playingExtraSet = false;

    // 4. Contar sets ganados
    const setsA = S.setsHistory.filter(s=>s.winner==='A').length;
    const setsB = S.setsHistory.filter(s=>s.winner==='B').length;
    const total = setsA + setsB;

    // 5. Normalizar bestOf
    const bo = (S.bestOf===1||S.bestOf===3||S.bestOf===5) ? S.bestOf : 3;
    S.bestOf = bo;
    const need = Math.ceil(bo/2); // sets para ganar: 1→1, 3→2, 5→3

    console.log('[winSet]', {team, setsA, setsB, total, need, bo});

    // ── 1 set: termina siempre ──
    if(bo===1){ _endMatchNow(team); return; }

    // ── ¿Alguien tiene los sets necesarios? ──
    if(setsA>=need || setsB>=need){
        // Si ya jugamos MÁS de los sets mínimos → es un set extra → terminar sin preguntar
        if(total > need){
            console.log('[winSet] extra set done → end');
            _endMatchNow(team); return;
        }
        // Primera vez que alguien llega a need sets
        // Si el rival tiene 0 sets → dominancia → preguntar si quieren otro set
        if(Math.min(setsA,setsB)===0){
            console.log('[winSet] dominance → continue modal');
            saveState(); render();
            setTimeout(()=>showContinueModal(team,setsA,setsB),500);
            return;
        }
        // Victoria normal (ej. 2-1, 3-2) → fin
        console.log('[winSet] normal win → end');
        _endMatchNow(team); return;
    }

    // ── Empate que requiere set decisivo ──
    if(bo===3 && setsA===1 && setsB===1){
        console.log('[winSet] 1-1 → third set modal');
        saveState(); render();
        setTimeout(()=>showThirdSetModal(),700);
        return;
    }

    // ── Continúa el partido ──
    // Activar superdesempate si corresponde
    if(S.currentSet===3 && S.superTiebreak && bo===3){
        S.superTiebreak=true; S.tiebreak=false;
        S.tiebreakPoints={A:0,B:0};
        S.tiebreakServing=S.serving;
        showToast(i('superAlert'),3000);
    }

    saveState();
    render();

    // Popup visual set ganado
    const wName=S['team'+team]?.name||'Equipo';
    showToast('🎾 '+wName+' '+gA+'-'+gB,2500);
    (()=>{
        const prev=document.getElementById('set-won-popup'); if(prev) prev.remove();
        const sp=document.createElement('div');
        sp.id='set-won-popup';
        sp.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:180;text-align:center;pointer-events:none;animation:scoreAnnounceIn 0.2s cubic-bezier(.34,1.56,.64,1) forwards';
        sp.innerHTML=`<div style="background:rgba(10,10,10,0.94);border:1.5px solid ${tc.primary()}40;border-radius:24px;padding:20px 32px;min-width:200px">
            <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:${tc.primary()};margin-bottom:6px">🎾 Set ganado</div>
            <div style="font-size:40px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1">${gA}<span style="color:rgba(255,255,255,0.2);font-weight:200;margin:0 6px">–</span>${gB}</div>
            <div style="font-size:13px;font-weight:700;color:${tc.primary()};margin-top:6px">${wName}</div>
        </div>`;
        document.body.appendChild(sp);
        setTimeout(()=>{if(sp.parentNode){sp.style.animation='scoreAnnounceOut 0.25s ease forwards';setTimeout(()=>sp.remove(),250);}},2500);
    })();
    showBetweenTimerEl(90); startBetweenTimer(90);
}


function _endMatchNow(team){
    S.matchOver=true;
    S.matchWinner=team;
    S.timerRunning=false;
    soundMatch();
    logActivity('match',team);
    saveMatchToHistory();
    saveState();
    render();
    setTimeout(()=>showMatchOver(team),400);
}

                Finalizar (gana quien tiene más juegos)
            </button>
        </div>
    </div>`;
    document.body.appendChild(el);

    document.getElementById('btn-third-yes').onclick=()=>{
        el.remove();
        if(S.currentSet===3&&S.goldenPoint){
            S.superTiebreak=true; S.tiebreak=false;
            S.tiebreakPoints={A:0,B:0}; S.tiebreakServing=S.serving;
            showToast(i('superAlert'),3000);
        }
        saveState(); render();
        showBetweenTimerEl(90); startBetweenTimer(90);
    };
    document.getElementById('btn-third-super').onclick=()=>{
        el.remove();
        S.superTiebreak=true; S.tiebreak=false;
        S.tiebreakPoints={A:0,B:0}; S.tiebreakServing=S.serving;
        showToast('⚡ Super tie-break',2500);
        saveState(); render();
    };
    document.getElementById('btn-third-no').onclick=()=>{
        el.remove();
        const sA=S.setsHistory.filter(s=>s.winner==='A').length;
        const sB=S.setsHistory.filter(s=>s.winner==='B').length;
        const gA=S.setsHistory.reduce((a,s)=>a+s.a,0);
        const gB=S.setsHistory.reduce((a,s)=>a+s.b,0);
        const w=sA>sB?'A':sB>sA?'B':gA>=gB?'A':'B';
        _endMatchNow(w);
    };
}

function removePoint(team){
    if(S.matchOver) return;
    snapshot();
    const t=S['team'+team];
    // Super tiebreak (prioridad sobre tiebreak normal)
    if(S.superTiebreak){
        if(S.tiebreakPoints[team]>0) S.tiebreakPoints[team]--;
        else{ showToast('No hay puntos que quitar'); S.history.pop(); return; }
    } else if(S.tiebreak){
        if(S.tiebreakPoints[team]>0) S.tiebreakPoints[team]--;
        else{ showToast('No hay puntos que quitar'); S.history.pop(); return; }
    } else if(S.deuce){
        if(S.advantage===team) S.advantage=null;
        else{ S.deuce=false; t.points=3; S['team'+(team==='A'?'B':'A')].points=3; }
    } else {
        if(t.points>0) t.points--;
        else if(t.games>0){
            t.games--; t.points=0; S['team'+(team==='A'?'B':'A')].points=0;
            S.serving=S.serving==='A'?'B':'A';
            showToast('↩ '+t.name);
        } else { showToast('No hay puntos que quitar'); S.history.pop(); return; }
    }
    soundUndo(); render(); saveState(); showToast('➖ Punto retirado a '+t.name);
}

function undoPoint(){
    if(!S.history.length){ showToast('Nada que deshacer'); return; }
    const prev=S.history.pop(); Object.assign(S,prev);
    soundUndo(); render(); saveState(); showToast('↩ Punto deshecho');
}

function logActivity(type,team){
    // Capturar el score en este momento (antes de que winSet resetee los juegos)
    const entry = {
        type, team,
        time: formatTime(S.gameTime),
        set: S.currentSet,
        score: {gA: S.teamA.games, gB: S.teamB.games},
        pts: {A: S.teamA.points, B: S.teamB.points}
    };
    S.activityLog.unshift(entry);
    if(S.activityLog.length>100) S.activityLog.pop();
}

function flashScore(team){
    setTimeout(()=>{ const el=document.getElementById('score-'+team); if(el){el.classList.add('score-flash');setTimeout(()=>el.classList.remove('score-flash'),300);} },10);
}

function addFault(team,type){
    if(S.matchOver) return;
    snapshot();
    
    let isSecondServeFault = false;
    if(type === 'footFault') {
        if(!S.firstServeFault) {
            S.firstServeFault = true;
            if(S.serveTimerEnabled) {
                clearInterval(betweenInterval);
                showBetweenTimerEl(S.serveTimerSeconds);
                startBetweenTimer(S.serveTimerSeconds);
            }
        } else {
            type = 'doubleFault';
            isSecondServeFault = true;
        }
    }

    S.faults[team][type]++;
    soundWarning();
    const labels={doubleFault:isSecondServeFault?'2ª Falta (Doble)':i('doubleFault'),footFault:'Falta (2º Saque)',warning:i('warning')};
    logActivity('fault',team);
    showToast(`⚠️ ${labels[type]} — ${S['team'+team].name}`);
    // Doble falta = punto contrario
    if(type==='doubleFault'){ addPoint(team==='A'?'B':'A'); return; }
    render(); saveState();
}

function endMatch(){
    if(S.matchOver){ showToast(i('matchOver')); return; }
    showConfirmModal(i('finalizeQ'),i('finalizeSub'),i('finalize'),()=>{
        S.matchOver=true; S.timerRunning=false;
        const sA=S.setsHistory.filter(s=>s.winner==='A').length;
        const sB=S.setsHistory.filter(s=>s.winner==='B').length;
        S.matchWinner=sA>=sB?'A':'B';
        logActivity('match',S.matchWinner); soundMatch(); saveMatchToHistory(); saveState(); render();
        if(typeof Auth!=='undefined') Auth.backupMatch();
        setTimeout(()=>showMatchOver(S.matchWinner),300);
    });
}

function newMatch(){
    showConfirmModal(i('newMatchQ'),i('newMatchSub'),i('newMatchBtn'),()=>{
        const ns=defaultState();

        ns.lang=S.lang||'es';

        ns.soundEnabled=S.soundEnabled;
        ns.goldenPoint=S.goldenPoint;

        ['teamA','teamB'].forEach(t=>{

function getLiveUrl(){
    if (S.cloudCode) return window.location.origin + window.location.pathname + '#c=' + S.cloudCode;
    const arr = [
        1,
        S.teamA.name, S.teamA.games, S.teamA.sets, S.teamA.points, S.teamA.playerA||'', S.teamA.playerB||'',
        S.teamB.name, S.teamB.games, S.teamB.sets, S.teamB.points, S.teamB.playerA||'', S.teamB.playerB||'',
        S.setsHistory, S.currentSet, S.serving, S.deuce, S.advantage,
        S.tiebreak, S.tiebreakPoints.A, S.tiebreakPoints.B,
        S.matchOver, S.matchWinner, S.gameTime, S.theme||'neon'
    ];
    // using btoa(unescape(encodeURIComponent())) is critical for emojis and accents
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(arr))));
    return window.location.origin + window.location.pathname + '#pp=' + encoded;
}

function getShareText(){
    const nA=S.teamA.name, nB=S.teamB.name;
    const pA=[S.teamA.playerA,S.teamA.playerB].filter(Boolean).join(' / ');
    const pB=[S.teamB.playerA,S.teamB.playerB].filter(Boolean).join(' / ');
    
    let setsInfo = S.setsHistory.map((s,i)=>`Set ${i+1}: ${s.a}-${s.b}${s.tiebreak?' (TB)':''}`).join('\n');
    if (!S.matchOver) {
        let currentScore = `Set ${S.currentSet} (Actual): ${S.teamA.games}-${S.teamB.games}`;
        if (S.tiebreak) currentScore += ` [TB: ${S.tiebreakPoints.A}-${S.tiebreakPoints.B}]`;
        else {
            const sc = getScoreDisplay();
            currentScore += ` [Pts: ${sc.scoreA}-${sc.scoreB}]`;
        }
        setsInfo = setsInfo ? setsInfo + '\n' + currentScore : currentScore;
    }
    const winnerText = S.matchWinner ? `\n\n🏆 Ganador: ${S['team'+S.matchWinner].name}` : '';
    
    const liveUrl = getLiveUrl();
    return `🎾 PadelPulse Live\n\n${nA}${pA?' ('+pA+')':''}\nvs\n${nB}${pB?' ('+pB+')':''}\n\n${setsInfo||i('match')}${winnerText}\n⏱️ ${formatTime(S.gameTime)}\n\n👁️ Live:\n${liveUrl}`;
}

// Dentro del WebView no existen window.open ni navigator.share: los botones
// de compartir no hacian nada. Todo va por el puente nativo, y solo se usa el
// camino web cuando la pagina corre en un navegador de verdad (version Netlify).
function shareSocial(platform, textOverride) {
    const text = textOverride || getShareText();
    const url = getLiveUrl();
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;

    if (platform === 'whatsapp') {
        if (b && b.shareToWhatsApp) { b.shareToWhatsApp(text); return; }
        window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
        return;
    }
    if (platform === 'facebook') {
        const fb = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '&quote=' + encodeURIComponent(text);
        if (b && b.openExternal) { b.openExternal(fb); return; }
        window.open(fb, '_blank');
        return;
    }
    if (platform === 'instagram') {
        // Instagram no acepta texto por intent: se copia y se abre la app.
        copyToClipboard(text);
        showToast(i2('Texto copiado. Pegalo en tu historia.','Text copied. Paste it in your story.'), 3000);
        if (b && b.openExternal) b.openExternal('https://www.instagram.com/');
        return;
    }
    // Cualquier otra cosa: hoja de compartir del sistema
    shareResult(text);
}

function shareResult(textOverride){
    const text = textOverride || getShareText();
    const title = 'PadelPulse Live — ' + S.teamA.name + ' vs ' + S.teamB.name;
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    if (b && b.shareText) { b.shareText(text, title); return; }
    if (navigator.share){ navigator.share({title, text}).catch(()=>copyToClipboard(text)); return; }
    copyToClipboard(text);
}

function copyToClipboard(text){
    const b = (typeof window!=='undefined') ? window.AndroidBridge : null;
    if (b && b.copyText) { b.copyText(text); return; }
    // navigator.clipboard necesita contexto seguro; file:// no siempre lo es
    try {
        navigator.clipboard.writeText(text)
            .then(()=>showToast('📋 '+i('share')))
            .catch(()=>fallbackCopy(text));
    } catch(e) { fallbackCopy(text); }
}

function fallbackCopy(text){
    try {
        const ta=document.createElement('textarea');
        ta.value=text; ta.style.cssText='position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        showToast('📋 '+i('share'));
    } catch(e) { showToast('—'); }
}

function shareQR(){
    const url = getLiveUrl();
    const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
    const el=document.createElement('div');

// Anti-bucle: ignorar audio mientras el árbitro habla
// _speakingUntil bloquea durante el habla
// _cmdLock bloquea brevemente tras cualquier comando para evitar doble disparo
let _speakingUntil = 0;
let _cmdLock = 0;
const CMD_LOCK_MS = 1800; // ms mínimos entre comandos de voz

function startVoice(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ showToast('⚠️ Voz no disponible'); return; }
    if(recognition){ stopVoice(); return; }
    recognition=new SR();
    recognition.lang=currentLang().voice;
    recognition.continuous=true;
    recognition.interimResults=false;
    recognition.maxAlternatives=5;
    recognition.onresult=(e)=>{
        const now = Date.now();
        // Ignorar si el árbitro está hablando O si hay lock de comando activo
        if(now < _speakingUntil || now < _cmdLock) return;
        for(let i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal){
                // Bloquear inmediatamente antes de procesar (evita doble disparo)
                _cmdLock = now + CMD_LOCK_MS;
                _speakingUntil = now + CMD_LOCK_MS;

                let handled=false;
                for(let a=0;a<e.results[i].length&&!handled;a++){
                    const txt=e.results[i][a].transcript.toLowerCase().trim();
                    handled=processVoiceLocal(txt);
                    if(handled) break;
                }
                if(!handled){
                    const best=e.results[i][0].transcript.toLowerCase().trim();
                    processVoiceCommand(best);
                }
                break; // solo procesar el primer resultado final por ciclo
            }
        }
    };
    recognition.onerror=(e)=>{ if(e.error!=='no-speech'){ showToast('Voz: '+e.error); stopVoice(); } };
    recognition.onend=()=>{ if(S.voiceActive) try{recognition.start();}catch(e){} };
    recognition.start(); S.voiceActive=true; render(); showToast('🎙️ Escuchando...',2000);
}
function stopVoice(){ if(recognition){ try{recognition.stop();}catch(e){} recognition=null; } S.voiceActive=false; render(); }
function toggleVoice(){
    if(typeof window !== "undefined" && window.AndroidBridge && window.AndroidBridge.startVoiceCommand) {
        window.AndroidBridge.startVoiceCommand();
    } else {
        if(S.voiceActive) stopVoice(); else startVoice();
    }
}
function toggleAI(){
    if(!aiKey){
        showToast('⚠️ Configura una API Key en Ajustes → Voz + IA', 3000, true);
        return;
    }
    aiEnabled=!aiEnabled;
    render();
    showToast(aiEnabled?'🤖 Árbitro IA activado':'🤖 Árbitro IA desactivado', 2000);
}

function getMatchContext(){
    const sc = getScoreDisplay();
    const nA = S.teamA.name, nB = S.teamB.name;

    const sA = S.setsHistory.filter(s=>s.winner==='A').length;
    const sB = S.setsHistory.filter(s=>s.winner==='B').length;
    const ptsLabels = ['0','15','30','40'];
    const ptA = S.tiebreak ? S.tiebreakPoints.A : (ptsLabels[S.teamA.points]||'0');
    const ptB = S.tiebreak ? S.tiebreakPoints.B : (ptsLabels[S.teamB.points]||'0');

    return {
        teamA: nA, teamB: nB,
        serving: srv, returning: rstr,
        pointsA: ptA, pointsB: ptB,
        gamesA: S.teamA.games, gamesB: S.teamB.games,
        setsA: sA, setsB: sB,
        currentSet: S.currentSet,
        deuce: S.deuce, tiebreak: S.tiebreak,
        advantage: S.advantage ? S['team'+S.advantage].name : null,
        goldenPoint: S.goldenPoint,
        matchOver: S.matchOver,
        scoreDisplay: `${ptA}-${ptB}`,
        gameDisplay: `${nA} ${S.teamA.games}-${S.teamB.games} ${nB}`,
        setDisplay: `${nA} ${sA}-${sB} ${nB}`
    };
}

- Sets won: ${m.teamA} ${m.setsA} - ${m.setsB} ${m.teamB} | Set: ${m.currentSet}
${m.deuce?'- STATUS: DEUCE':''}${m.advantage?'- STATUS: ADVANTAGE '+m.advantage:''}${m.tiebreak?'- STATUS: TIE-BREAK':''}${m.goldenPoint?'- MODE: GOLDEN POINT':''}

PADEL SCORING (CRITICAL):

RESPOND ONLY with this exact JSON (no markdown, no extra text):

ACTION RULES:

ANNOUNCE FORMAT examples:

IMPORTANT: announce MUST be in ${lang}. History context is below if any.`;

function buildPrompt(userText){
    const history = chatHistory.slice(-8).map(m=>
        (m.role==='user'?'User: ':'Referee: ') + m.parts[0].text
    ).join('\n');
    return REFEREE_SYSTEM()
        + (history ? '\n\nCONVERSATION HISTORY:\n'+history : '')
        + '\n\nUser says now: "'+userText+'"';
}

function parseAIResponse(raw){
    const clean = raw.replace(/```json\s?|```/g,'').trim();
    const match = clean.match(/\{[\s\S]*?\}/);
    if(!match) throw new Error('No JSON in: '+raw.substring(0,100));
    return JSON.parse(match[0]);
}

// ── Gemini ──
async function callGemini(userText){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${aiKey}`,
            { method:'POST', headers:{'Content-Type':'application/json'}, signal: ctrl.signal,
              body: JSON.stringify({
                  contents:[{parts:[{text:buildPrompt(userText)}]}],
                  generationConfig:{temperature:0.1,maxOutputTokens:300}
              }) }
        );
        clearTimeout(timer);
        if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||'Gemini HTTP '+res.status); }
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    } catch(e) { clearTimeout(timer); if(e.name==='AbortError') throw new Error('⏱ Tiempo agotado'); throw e; }
}

async function askAI(userText){
    let raw;
    if(aiProvider==='openai')      raw = await callOpenAI(userText);
    else if(aiProvider==='claude') raw = await callClaude(userText);
    else                           raw = await callGemini(userText);

    chatHistory.push({role:'model', parts:[{text:raw}]});
    if(chatHistory.length>16) chatHistory=chatHistory.slice(-16);

function speak(text){
    if(!S.soundEnabled||!text||!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang=currentLang().voice; utt.rate=0.92; utt.pitch=1.0; utt.volume=1.0;
    const voices = window.speechSynthesis.getVoices();
    const langVoice = voices.find(v=>v.lang.startsWith(currentLang().voice.split('-')[0]));
    if(langVoice) utt.voice=langVoice;
    // Bloquear mic durante el habla estimada + 1.5s de margen post-habla
    const estimatedMs = Math.max(2000, text.length * 90);
    _speakingUntil = Date.now() + estimatedMs;
    _cmdLock = _speakingUntil;
    utt.onend = () => {
        // Tras terminar de hablar, bloquear 1.2s más por si el mic recogió el eco
        const extra = Date.now() + 1200;
        _speakingUntil = extra;
        _cmdLock = extra;
    };
    window.speechSynthesis.speak(utt);
}

function executeAIAction(result){
    const {action, announce, reason} = result;
    const msg = announce||reason||'';
    switch(action){
        case 'point_A':        addPoint('A'); if(msg){speak(msg); showToast('🎙️ '+msg,3500);} if(!S.soundEnabled) setTimeout(()=>showScoreAnnounce(msg||'',null),100); break;
        case 'point_B':        addPoint('B'); if(msg){speak(msg); showToast('🎙️ '+msg,3500);} if(!S.soundEnabled) setTimeout(()=>showScoreAnnounce(msg||'',null),100); break;
        case 'fault_A':        speak(msg||'Falta.'); showToast('🎙️ '+(msg||'Falta'),2500); setTimeout(()=>addFault('A','footFault'),50); break;
        case 'fault_B':        speak(msg||'Falta.'); showToast('🎙️ '+(msg||'Falta'),2500); setTimeout(()=>addFault('B','footFault'),50); break;
        case 'double_fault_A': speak(msg||'Doble falta.'); showToast('🎙️ '+(msg||'Doble falta'),2500); setTimeout(()=>addFault('A','doubleFault'),50); break;
        case 'double_fault_B': speak(msg||'Doble falta.'); showToast('🎙️ '+(msg||'Doble falta'),2500); setTimeout(()=>addFault('B','doubleFault'),50); break;
        case 'undo':           undoPoint(); speak(msg||'Anulado.'); showToast('🎙️ Deshecho',2000); break;
        case 'new_match':      newMatch(); break;
        case 'end_match':      endMatch(); break;
        case 'chat':           speak(msg); showToast('🤖 '+msg,5000); break;
        default:               if(msg) showToast('🤖 '+msg,3000); break;
    }
}
