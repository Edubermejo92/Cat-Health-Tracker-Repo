async function processVoiceCommand(txt){
    // 1. Intentar reglas locales primero (instantáneo, sin red)
    const handled = processVoiceLocal(txt);
    if(handled){
        // Si no hay sonido ni IA → mostrar marcador visual grande
        if(!S.soundEnabled || !aiKey){
            setTimeout(()=>showScoreAnnounce('', null), 80);
        }
        return;
    }

    // 2. Si hay IA activa, enviar a árbitro IA
    if(aiEnabled && aiKey){
        showToast('🤖 '+i('processing'),1200);
        try{
            const result = await askAI(txt);
            executeAIAction(result);
            // Si no hay sonido, mostrar marcador visual después de ejecutar acción IA
            if(!S.soundEnabled) setTimeout(()=>showScoreAnnounce('🤖 '+AI_PROVIDERS[aiProvider].name, null), 150);
        }catch(e){
            console.error('AI error:',e);
            showToast('❌ '+e.message, 4000, true);
        }
    } else {
        // Sin IA: mostrar lo que se dijo y el marcador actual
        showToast('🎙️ "'+txt+'"',2000);
        showScoreAnnounce('🎙️ No reconocido', 'Di "punto saque", "falta", etc.');
    }
}

function processVoiceLocal(txt){
    const nA=S.teamA.name.toLowerCase().trim();
    const nB=S.teamB.name.toLowerCase().trim();
    const srv=S.serving, rstr=srv==='A'?'B':'A';
    const t=txt.toLowerCase().replace(/[-–—]/g,' ').replace(/\s+/g,' ').trim();

    // Bloquear mic inmediatamente para evitar doble disparo en cualquier comando
    _speakingUntil = Date.now() + CMD_LOCK_MS;
    _cmdLock = _speakingUntil;

    // ── DESHACER ──
    if(/\b(deshacer|error|anula|anular|volver|atrás|cancela|repetir|repite|undo|annul|annulla|annuler|rückgängig|peruuta)\b/.test(t)){
        speak('Anulado.'); showToast('↩️ Deshecho');
        setTimeout(()=>undoPoint(), 50);
        return true;
    }

    // ── FIN / NUEVA PARTIDA ──
    if(/\b(finalizar|terminar partido|fin del partido|end match|match over|fine partita|fin du match|spiel beenden|peli loppuu)\b/.test(t)){
        endMatch(); return true;
    }
    if(/\b(nueva partida|nuevo partido|nuevo juego|new match|nuovo incontro|nouveau match|neues spiel|uusi ottelu)\b/.test(t)){
        newMatch(); return true;
    }

    // ── JUEGO ──
    // "juego", "juego pareja a", "juego equipo b", "game team a"
    const gA = /\bjuego\b/.test(t)&&(
        /\b(equipo a|pareja a|primero|para a|al uno|al primero|uno)\b/.test(t)||
        (nA.length>=3&&t.includes(nA))||/\bjuego a\b/.test(t));
    const gB = /\bjuego\b/.test(t)&&(
        /\b(equipo b|pareja b|segundo|para b|al dos|al segundo|dos)\b/.test(t)||
        (nB.length>=3&&t.includes(nB))||/\bjuego b\b/.test(t));
    if(gA&&!gB){ winGame('A'); speak('Juego '+S.teamA.name+'.'); showToast('🏆 Juego '+S.teamA.name); return true; }
    if(gB&&!gA){ winGame('B'); speak('Juego '+S.teamB.name+'.'); showToast('🏆 Juego '+S.teamB.name); return true; }

    // ── SET ──
    const sA = /\bset\b/.test(t)&&(
        /\b(equipo a|pareja a|primero|para a|uno)\b/.test(t)||
        (nA.length>=3&&t.includes(nA))||/\bset a\b/.test(t));
    const sB = /\bset\b/.test(t)&&(
        /\b(equipo b|pareja b|segundo|para b|dos)\b/.test(t)||
        (nB.length>=3&&t.includes(nB))||/\bset b\b/.test(t));
    if(sA&&!sB){ winSet('A',S.teamA.games,S.teamB.games,false); speak('Set '+S.teamA.name+'.'); showToast('🏆 Set '+S.teamA.name); return true; }
    if(sB&&!sA){ winSet('B',S.teamA.games,S.teamB.games,false); speak('Set '+S.teamB.name+'.'); showToast('🏆 Set '+S.teamB.name); return true; }

    // ── DOBLE FALTA ──
    if(/\b(doble falta|double fault|doppio fallo|double faute|doppelfehler|kaksoishuti)\b/.test(t)){
        const f = (nB.length>=3&&t.includes(nB))||/\b(equipo b|pareja b|segundo|team b|ellos)\b/.test(t)?'B':
                  (nA.length>=3&&t.includes(nA))||/\b(equipo a|pareja a|primero|team a|nosotros)\b/.test(t)?'A':srv;
        // Hablar PRIMERO para bloquear el micrófono antes de que addFault procese
        speak('Doble falta.');
        showToast('🎙️ Doble falta');
        // Pequeño delay para asegurar que _speakingUntil está activo
        setTimeout(()=>addFault(f,'doubleFault'), 50);
        return true;
    }

    // ── FALTA PIE / RED ──
    if(/\b(falta de pie|foot fault|pie|falta pie|footfault|red|net|en la red|toca la red)\b/.test(t)&&!/doble/.test(t)){
        const f = (nB.length>=3&&t.includes(nB))||/\b(equipo b|pareja b|segundo)\b/.test(t)?'B':
                  (nA.length>=3&&t.includes(nA))||/\b(equipo a|pareja a|primero)\b/.test(t)?'A':srv;
        speak('Falta de pie.'); showToast('🎙️ Falta de pie');
        setTimeout(()=>addFault(f,'footFault'), 50);
        return true;
    }

    // ── FALTA SIMPLE ──
    if(/^falta$|^fault$|^fallo$/.test(t)){
        const f = (nB.length>=3&&t.includes(nB))||/\b(equipo b|pareja b|segundo)\b/.test(t)?'B':
                  (nA.length>=3&&t.includes(nA))||/\b(equipo a|pareja a|primero)\b/.test(t)?'A':srv;
        speak('Falta.'); showToast('🎙️ Falta');
        setTimeout(()=>addFault(f,'footFault'), 50);
        return true;
    }

    // ── CONSULTA MARCADOR ──
    if(/\b(cómo vamos|como vamos|resultado|marcador|cuánto van|cuanto van|quién va|quien va|qué marcador|que marcador|cuál es|cual es|dime el|score|how.*score|what.*score|punteggio|résultat|ergebnis|tulos)\b/.test(t)){
        const m=getMatchContext();
        const msg=`${m.pointsA} a ${m.pointsB}. Juegos ${m.gamesA} a ${m.gamesB}.`;
        speak(msg);
        showToast('📊 '+msg,4000);
        // Siempre mostrar visual, con o sin sonido
        setTimeout(()=>showScoreAnnounce('📊 Marcador', 'Juegos '+m.gamesA+' — '+m.gamesB), 50);
        return true;
    }

    // ── MARCADOR ESPECÍFICO ("30 iguales", "quince treinta", etc.) ──
    const scoreResult = matchScoreVoice(t);
    if(scoreResult !== null){
        const {srvPts, rstrPts, isDeuce, advSrv, advRstr} = scoreResult;
        if(S.tiebreak||S.superTiebreak){ showToast('⚠️ Tiebreak activo',2000); return true; }
        snapshot();
        if(isDeuce){
            S.teamA.points=3; S.teamB.points=3; S.deuce=true; S.advantage=null;
        } else if(advSrv){
            S.teamA.points=3; S.teamB.points=3; S.deuce=true; S.advantage=srv;
        } else if(advRstr){
            S.teamA.points=3; S.teamB.points=3; S.deuce=true; S.advantage=rstr;
        } else {
            S['team'+srv].points=srvPts;
            S['team'+rstr].points=rstrPts;
            S.deuce=(srvPts===3&&rstrPts===3); S.advantage=null;
        }
        const lab=getScoreDisplay();
        speak(lab.scoreA+' — '+lab.scoreB);
        showToast('🎙️ '+lab.scoreA+' - '+lab.scoreB);
        saveState(); render(); return true;
    }

    // ── VENTAJA SAQUE ──
    if(/\b(ventaja saque|ventaja servicio|ventaja al saque|ventaja servidor|advantage server|advantage in|ad in|vantaggio servizio)\b/.test(t)){
        if(!S.deuce){ addPoint(srv); } else { S.advantage=srv; soundPoint(); render(); saveState(); }
        speak('Ventaja '+S['team'+srv].name+'.'); return true;
    }
    // ── VENTAJA RESTO ──
    if(/\b(ventaja resto|ventaja receptor|ventaja al resto|advantage receiver|advantage out|ad out|vantaggio ricezione)\b/.test(t)){
        if(!S.deuce){ addPoint(rstr); } else { S.advantage=rstr; soundPoint(); render(); saveState(); }
        speak('Ventaja '+S['team'+rstr].name+'.'); return true;
    }

    // ── PUNTO SAQUE ──
    if(/\b(punto.*saque|punto.*servicio|al saque|saque directo|ace|ganó.*saque|gana.*saque|point.*serv|winner.*serv)\b/.test(t)||
       t==='saque'||t==='servicio'||t==='serve'){
        addPoint(srv); return true;
    }

    // ── PUNTO RESTO / BREAK ──
    if(/\b(punto.*resto|punto.*receptor|al resto|break|gana.*resto|ganó.*resto|point.*return|point.*receiver)\b/.test(t)||
       t==='resto'||t==='return'||t==='break'){
        addPoint(rstr); return true;
    }

    // ── PUNTO POR NOMBRE / EQUIPO ──
    // Frases ES: "punto a", "punto pareja a", "punto equipo b", "ganamos", "punto para nosotros"
    // Cuidado: no activar si ya lo capturó juego/set/falta arriba
    const puntoA = [
        /\b(punto equipo a|punto pareja a|punto para a|gana equipo a|gana pareja a|punto al primero|gana el primero|lo ganamos|ganamos|punto nuestro)\b/,
        /\bpunto\b.*\ba\b$/,
    ];
    const puntoB = [
        /\b(punto equipo b|punto pareja b|punto para b|gana equipo b|gana pareja b|punto al segundo|gana el segundo|punto de ellos)\b/,
        /\bpunto\b.*\bb\b$/,
    ];

    if(puntoA.some(r=>r.test(t))){ addPoint('A'); return true; }
    if(puntoB.some(r=>r.test(t))){ addPoint('B'); return true; }

    // Por nombre de equipo (mínimo 3 letras, que no sea un comando anterior)
    if(nA.length>=3&&t.includes(nA)&&!/\b(juego|set|falta|doble)\b/.test(t)){ addPoint('A'); return true; }
    if(nB.length>=3&&t.includes(nB)&&!/\b(juego|set|falta|doble)\b/.test(t)){ addPoint('B'); return true; }

    // ── PUNTO GENÉRICO (gana quien sirve) ──
    if(/^(punto|point|punto!)$/.test(t)){ addPoint(srv); return true; }

    return false;
}

// ── Parser de marcadores hablados ──
// Entiende frases como: "30 iguales", "quince treinta", "vamos 15 a 30",
// "cuarenta iguales" (=deuce), "iguales", "deuce", etc.
function matchScoreVoice(t){

    // ── Mapa de palabras → índice de punto (0=0, 1=15, 2=30, 3=40) ──
    const W = {
        // Español
        'cero':0,'nada':0,'cero a cero':0,
        'quince':1,'quinze':1,
        'treinta':2,
        'cuarenta':3,
        // Inglés
        'zero':0,'love':0,'nil':0,'oh':0,
        'fifteen':1,'15':1,
        'thirty':2,'30':2,
        'forty':3,'40':3,
        // Italiano
        'quindici':1,'trenta':2,'quaranta':3,
        // Francés
        'zéro':0,'quinze':1,'trente':2,'quarante':3,
        // Alemán
        'null':0,'fünfzehn':1,'dreißig':2,'vierzig':3,
        // Finlandés
        'nolla':0,'viisitoista':1,'kolmekymmentä':2,'neljäkymmentä':3,
        // Números escritos
        '0':0,'15':1,'30':2,'40':3,
    };

    // ── Ventaja servidor ──
    if(/ventaja servi|ventaja saque|ventaja al saque|advantage serv|advantage in|ad in|vantaggio serv|vorhand aufschlag/.test(t)){
        return {srvPts:3,rstrPts:3,isDeuce:false,advSrv:true,advRstr:false};
    }
    // ── Ventaja restador ──
    if(/ventaja rest|ventaja al rest|ventaja recept|advantage out|advantage rec|ad out|vantaggio rest/.test(t)){
        return {srvPts:3,rstrPts:3,isDeuce:false,advSrv:false,advRstr:true};
    }

    // ── "X iguales" / "X igual" → marcador igualado en X ──
    // IMPORTANTE: "30 iguales" = 30-30, "15 iguales" = 15-15
    // Solo "cuarenta iguales" / "40 iguales" = deuce
    const equalsMatch = t.match(/^(quince|15|treinta|30|cuarenta|40|cero|0)\s+(iguales?|igual|all|tous|tutti|alle|tasapeli)$/);
    if(equalsMatch){
        const v = W[equalsMatch[1].replace('quince','quince')] ?? W[equalsMatch[1]];
        if(v !== undefined){
            if(v===3) return {srvPts:3,rstrPts:3,isDeuce:true,advSrv:false,advRstr:false}; // 40 iguales = deuce
            return {srvPts:v,rstrPts:v,isDeuce:false,advSrv:false,advRstr:false};
        }
    }

    // ── "iguales" / "deuce" solo (sin número) → deuce/40-40 ──
    if(/^(deuce|iguales?|parità|égalité|einstand|tasapeli)$/.test(t)){
        return {srvPts:3,rstrPts:3,isDeuce:true,advSrv:false,advRstr:false};
    }

    // ── Quitar palabras de relleno y parsear "X a Y" / "X Y" ──
    const filler=/\b(vamos|ahora|están|van|estamos|ponemos|está|pone|es|marcador|score|it'?s|the score is|we'?re at|son|sería|pon|pon el|anota)\b/gi;
    const clean = t.replace(filler,'').replace(/\s+/g,' ').trim();
    const words = clean.split(/\s+/);

    for(let i=0;i<words.length;i++){
        const w1 = words[i];
        if(!(w1 in W)) continue;
        // Saltar conectores
        let j = i+1;
        while(j<words.length && /^(a|to|all|por|and|e|y|—|-|–|igual|iguales?|versus|vs|contra)$/.test(words[j])) j++;
        if(j>=words.length) continue;
        const w2 = words[j];
        if(w2 in W){
            const s1=W[w1], s2=W[w2];
            // 40-40 → deuce
            if(s1===3 && s2===3) return {srvPts:3,rstrPts:3,isDeuce:true,advSrv:false,advRstr:false};
            return {srvPts:s1,rstrPts:s2,isDeuce:false,advSrv:false,advRstr:false};
        }
    }
    return null;
}

function saveMatchToHistory(){
    if(!S.setsHistory.length && S.teamA.games===0 && S.teamB.games===0) return;
    const setsA=S.setsHistory.filter(s=>s.winner==='A').length;
    const setsB=S.setsHistory.filter(s=>s.winner==='B').length;
    const totalPts = S.momentum.length;
    const ptsA = S.momentum.filter(m=>m.team==='A').length;
    const gA=S.setsHistory.reduce((a,s)=>a+s.a,0)+S.teamA.games;
    const gB=S.setsHistory.reduce((a,s)=>a+s.b,0)+S.teamB.games;
    const record = {
        id: Date.now(),
        date: new Date().toISOString(),
        teamA: S.teamA.name, teamB: S.teamB.name,
        playerA1: S.teamA.playerA, playerA2: S.teamA.playerB,
        playerB1: S.teamB.playerA, playerB2: S.teamB.playerB,
        setsA, setsB, winner: S.matchWinner,
        setsHistory: S.setsHistory,
        gamesA: gA, gamesB: gB,
        duration: S.gameTime,
        totalPoints: totalPts, pointsWonA: ptsA,
        faults: JSON.parse(JSON.stringify(S.faults)),
        momentum: S.momentum.slice(),
        theme: S.theme||'neon', lang: S.lang||'es'
    };
    try{
        const hist = JSON.parse(localStorage.getItem('pp_match_history')||'[]');
        hist.unshift(record);
        if(hist.length>100) hist.pop();
        localStorage.setItem('pp_match_history', JSON.stringify(hist));
    }catch(e){}
}

/** Texto para compartir un partido guardado del historial. */
function getMatchShareText(match){
    const dt = new Date(match.date);
    const fecha = dt.toLocaleDateString(currentLang().locale||'es-ES', {day:'2-digit', month:'long', year:'numeric'});
    const pA = [match.playerA1, match.playerA2].filter(Boolean).join(' / ');
    const pB = [match.playerB1, match.playerB2].filter(Boolean).join(' / ');
    const sets = (match.setsHistory||[]).map((x,idx)=>`Set ${idx+1}: ${x.a}-${x.b}${x.tiebreak?' (TB)':''}`).join('\n');
    const gano = match.winner ? (match.winner==='A'?match.teamA:match.teamB) : null;
    const dur = match.duration ? `\n⏱️ ${formatTime(match.duration)}` : '';
    return `🎾 PadelPulse Live\n${fecha}\n\n${match.teamA}${pA?' ('+pA+')':''}\nvs\n${match.teamB}${pB?' ('+pB+')':''}\n\n📊 ${match.setsA}-${match.setsB}\n${sets}${gano?`\n\n🏆 ${gano}`:''}${dur}`;
}

function shareMatch(id, platform){
    const m = getMatchHistory().find(x=>x.id===id);
    if(!m) return;
    const text = getMatchShareText(m);
    if(platform==='whatsapp') shareSocial('whatsapp', text);
    else shareResult(text);
}

function getMatchHistory(){
    try{ return JSON.parse(localStorage.getItem('pp_match_history')||'[]'); }catch(e){ return []; }
}

function deleteMatchFromHistory(id){
    try{
        const hist=getMatchHistory().filter(m=>m.id!==id);
        localStorage.setItem('pp_match_history',JSON.stringify(hist));
    }catch(e){}
}

// CUENTA (Supabase)
// Se habla con la API REST a pelo, sin supabase-js: la app tiene que
// arrancar sin conexion y no puede depender de un CDN. Son cuatro
// llamadas, no compensa meter una libreria de 100 KB.
//
// Regla de oro: la app SIEMPRE funciona sin conexion. La cuenta sirve
// para respaldar y llevarse el historial a otro movil, no para poder
// jugar. Si no hay red, se juega igual y ya se subira luego.
// ═══════════════════════════════════════════════════════════════════
const SUPA_URL = 'https://fdlcdzlvvxqhzougcjwd.supabase.co';
const SUPA_KEY = 'sb_publishable_Q7D-EMj-MW4df-VzAbSNmg_eumYPvtM';

const Auth = {
    user: null,            // { id, email, display_name }
    session: null,         // { access_token, refresh_token, expires_at }
    status: 'anon',        // 'anon' | 'in' | 'busy'
    lastError: null,
    lastSync: 0,
    syncing: false,

    // ── Persistencia local de la sesion ──
    load(){
        try{
            const raw = localStorage.getItem('pp_session');
            if(!raw) return;
            const s = JSON.parse(raw);
            if(s && s.access_token){
                this.session = s;
                this.user = s.user || null;
                this.status = 'in';
            }
        }catch(e){}
    },
    persist(){
        try{
            if(this.session) localStorage.setItem('pp_session', JSON.stringify({...this.session, user:this.user}));
            else localStorage.removeItem('pp_session');
        }catch(e){}
    },

    get isIn(){ return this.status==='in' && !!this.session; },

    async api(path, {method='GET', body=null, auth=true, headers={}}={}){
        const h = Object.assign({
            'apikey': SUPA_KEY,
            'Content-Type': 'application/json'
        }, headers);
        if(auth && this.session) h['Authorization'] = 'Bearer ' + this.session.access_token;
        const res = await fetch(SUPA_URL + path, {
            method, headers: h, body: body ? JSON.stringify(body) : undefined
        });
        const txt = await res.text();
        let data = null;
        try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
        if(!res.ok){
            const msg = (data && (data.error_description || data.msg || data.message || data.error)) || ('HTTP '+res.status);
            throw new Error(msg);
        }
        return data;
    },

    // ── Registro / entrada / salida ──
    async signUp(email, password, displayName){
        this.status='busy'; this.lastError=null; render();
        try{
            const data = await this.api('/auth/v1/signup', {
                method:'POST', auth:false,
                body:{ email, password, data:{ display_name: displayName || email.split('@')[0] } }
            });
            // Con confirmacion de correo activada no viene sesion todavia
            if(data.access_token){
                this.applySession(data);
                showToast(i2('Cuenta creada','Account created'), 2500);
                await this.pushAll();
            } else {
                this.status='anon';
                showToast(i2('Revisa tu correo para confirmar la cuenta','Check your email to confirm'), 4000);
            }
        }catch(e){
            this.status='anon'; this.lastError = this.human(e.message);
        }
        render();
    },

    async signIn(email, password){
        this.status='busy'; this.lastError=null; render();
        try{
            const data = await this.api('/auth/v1/token?grant_type=password', {
                method:'POST', auth:false, body:{ email, password }
            });
            this.applySession(data);
            showToast(i2('Sesion iniciada','Signed in'), 2000);
            await this.syncNow();
        }catch(e){
            this.status='anon'; this.lastError = this.human(e.message);
        }
        render();
    },

    applySession(data){
        this.session = {
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: Date.now() + ((data.expires_in||3600)*1000)
        };
        this.user = data.user ? {
            id: data.user.id,
            email: data.user.email,
            display_name: (data.user.user_metadata && data.user.user_metadata.display_name) || data.user.email
        } : null;
        this.status = 'in';
        this.persist();
        PPSync.sendAccountToWatch();
        // Ya esta dentro: la pantalla de cuenta no tiene que quedarse ahi.
        if(S.currentView === 'auth'){
            S.currentView = sessionStorage.getItem('pp_setup_done') ? 'home' : 'setup';
        }
    },

    async refreshIfNeeded(){
        if(!this.session) return false;
        if(Date.now() < (this.session.expires_at - 60000)) return true;
        try{
            const data = await this.api('/auth/v1/token?grant_type=refresh_token', {
                method:'POST', auth:false, body:{ refresh_token: this.session.refresh_token }
            });
            this.applySession(data);
            return true;
        }catch(e){
            // El refresco puede fallar por estar sin red: no se cierra sesion
            // por eso, solo si el servidor dice explicitamente que no vale.
            if(/invalid|expired|revoked/i.test(e.message||'')) this.signOut(true);
            return false;
        }
    },

    signOut(silent){
        this.session=null; this.user=null; this.status='anon'; this.lastError=null;
        this.persist();
        // El reloj tiene que enterarse: si no, seguiria mostrando el nombre
        // de alguien que ya no esta.
        try{ PPSync.sendAccountToWatch(); }catch(e){}
        if(!silent) showToast(i2('Sesion cerrada','Signed out'), 2000);
        render();
    },

    human(msg){
        const m = (msg||'').toLowerCase();
        if(m.includes('invalid login')) return i2('Correo o contraseña incorrectos','Wrong email or password');
        if(m.includes('already registered')) return i2('Ese correo ya tiene cuenta','That email already has an account');
        if(m.includes('password')) return i2('La contraseña debe tener al menos 6 caracteres','Password must be at least 6 characters');
        if(m.includes('failed to fetch') || m.includes('networkerror')) return i2('Sin conexion. Puedes jugar igual.','No connection. You can still play.');
        return msg;
    },

    // ── Sincronizacion del historial ──

    /** Convierte un partido local al formato de la tabla. */
    toRow(m){
        return {
            local_id: String(m.id),
            played_at: m.date,
            team_a: m.teamA||'', team_b: m.teamB||'',
            player_a1: m.playerA1||'', player_a2: m.playerA2||'',
            player_b1: m.playerB1||'', player_b2: m.playerB2||'',
            sets_a: m.setsA|0, sets_b: m.setsB|0,
            games_a: m.gamesA|0, games_b: m.gamesB|0,
            winner: m.winner||null,
            duration_s: m.duration|0,
            sets_detail: m.setsHistory||[],
            source: 'phone'
        };
    },

    /** Y al revés, para poder pintarlo con el mismo código de siempre. */
    fromRow(r){
        return {
            id: Number(r.local_id) || Date.parse(r.played_at),
            date: r.played_at,
            teamA: r.team_a, teamB: r.team_b,
            playerA1: r.player_a1, playerA2: r.player_a2,
            playerB1: r.player_b1, playerB2: r.player_b2,
            setsA: r.sets_a, setsB: r.sets_b,
            gamesA: r.games_a, gamesB: r.games_b,
            winner: r.winner,
            duration: r.duration_s,
            setsHistory: r.sets_detail||[],
            totalPoints:0, pointsWonA:0,
            faults:{A:{doubleFault:0},B:{doubleFault:0}},
            momentum:[], theme:S.theme||'neon', lang:S.lang||'es',
            _remote: true
        };
    },

    /** Sube los partidos locales que aun no esten en la nube. */
    async pushAll(){
        if(!this.isIn) return;
        const local = getMatchHistory();
        if(!local.length) return;
        const rows = local.map(m=>this.toRow(m));
        // on_conflict por (user_id, local_id): reenviar no duplica
        await this.api('/rest/v1/matches?on_conflict=user_id,local_id', {
            method:'POST',
            headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
            body: rows
        });
    },

    /** Baja lo que haya en la nube y lo mezcla con lo local. */
    async pullAll(){
        if(!this.isIn) return 0;
        const rows = await this.api('/rest/v1/matches?select=*&order=played_at.desc&limit=200');
        if(!Array.isArray(rows)) return 0;
        const local = getMatchHistory();
        const seen = new Set(local.map(m=>String(m.id)));
        const nuevos = rows.filter(r=>!seen.has(String(r.local_id))).map(r=>this.fromRow(r));
        if(!nuevos.length) return 0;
        const merged = local.concat(nuevos)
            .sort((a,b)=> new Date(b.date) - new Date(a.date))
            .slice(0,200);
        try{ localStorage.setItem('pp_match_history', JSON.stringify(merged)); }catch(e){}
        return nuevos.length;
    },

    /** Sube y baja. Es lo que se llama al entrar y desde el boton. */
    async syncNow(quiet){
        if(!this.isIn || this.syncing) return;
        this.syncing = true; render();
        try{
            if(!(await this.refreshIfNeeded())) throw new Error('sin sesion');
            await this.pushAll();
            const bajados = await this.pullAll();
            this.lastSync = Date.now();
            this.lastError = null;
            if(!quiet) showToast(bajados
                ? i2(`Sincronizado · ${bajados} partidos nuevos`,`Synced · ${bajados} new matches`)
                : i2('Todo sincronizado','All synced'), 2200);
        }catch(e){
            this.lastError = this.human(e.message);
            if(!quiet) showToast('⚠️ ' + this.lastError, 3000, true);
        }
        this.syncing = false;
        render();
    },

    /** Guarda un partido recien terminado, sin bloquear el final de partido. */
    backupMatch(){
        if(!this.isIn) return;
        setTimeout(()=>{ this.syncNow(true).catch(()=>{}); }, 1200);
    }
};

/** Jugadores de un partido, por equipo, sin huecos ni duplicados. */
function matchPlayers(match, team){
    const raw = team==='A' ? [match.playerA1, match.playerA2] : [match.playerB1, match.playerB2];
    const named = raw.map(x=>(x||'').trim()).filter(Boolean);
    // Si no hay jugadores sueltos, la pareja cuenta como una entidad
    return named.length ? named : [ (team==='A'?match.teamA:match.teamB) || '—' ];
}

/**
 * Agrega el historial por jugador (o por pareja si no hay nombres sueltos).
 * Devuelve la lista ordenada por partidos jugados.
 */
function getPlayerStats(){
    const hist = getMatchHistory();
    const map = {};

    const touch = (name) => {
        const k = name.trim();
        if(!map[k]) map[k] = {
            name:k, played:0, won:0, lost:0,
            setsWon:0, setsLost:0, gamesWon:0, gamesLost:0,
            seconds:0, last:null, results:[], partners:{}, rivals:{}
        };
        return map[k];
    };

    // El historial viene de mas reciente a mas antiguo
    hist.forEach(m=>{
        ['A','B'].forEach(team=>{
            const players = matchPlayers(m, team);
            const mates   = matchPlayers(m, team==='A'?'B':'A');
            const win     = m.winner === team;
            const sw      = team==='A' ? (m.setsA||0) : (m.setsB||0);
            const sl      = team==='A' ? (m.setsB||0) : (m.setsA||0);
            const gw      = team==='A' ? (m.gamesA||0) : (m.gamesB||0);
            const gl      = team==='A' ? (m.gamesB||0) : (m.gamesA||0);

            players.forEach(nm=>{
                const e = touch(nm);
                e.played++;
                if(win) e.won++; else e.lost++;
                e.setsWon+=sw; e.setsLost+=sl;
                e.gamesWon+=gw; e.gamesLost+=gl;
                e.seconds += (m.duration||0);
                if(!e.last || new Date(m.date) > new Date(e.last)) e.last = m.date;
                e.results.push(win?'W':'L');
                players.filter(o=>o!==nm).forEach(o=>{ e.partners[o]=(e.partners[o]||0)+1; });
                mates.forEach(o=>{ e.rivals[o]=(e.rivals[o]||0)+1; });
            });
        });
    });

    return Object.values(map).map(e=>{
        e.winPct = e.played ? Math.round(e.won/e.played*100) : 0;
        // Racha actual: los resultados van de mas reciente a mas antiguo
        let streak = 0, type = e.results[0] || null;
        for(const r of e.results){ if(r===type) streak++; else break; }
        e.streak = streak; e.streakType = type;
        e.topPartner = Object.entries(e.partners).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
        e.topRival   = Object.entries(e.rivals).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
        return e;
    }).sort((a,b)=> b.played-a.played || b.winPct-a.winPct);
}

/** Parejas fijas (dos nombres juntos) con su balance. */
function getPairStats(){
    const hist = getMatchHistory();
    const map = {};
    hist.forEach(m=>{
        ['A','B'].forEach(team=>{
            const ps = matchPlayers(m, team);
            if(ps.length < 2) return;               // solo parejas con dos nombres
            const key = ps.slice(0,2).sort().join(' & ');
            if(!map[key]) map[key] = {name:key, played:0, won:0, last:null};
            const e = map[key];
            e.played++;
            if(m.winner===team) e.won++;
            if(!e.last || new Date(m.date) > new Date(e.last)) e.last = m.date;
        });
    });
    return Object.values(map).map(e=>{
        e.lost = e.played - e.won;
        e.winPct = e.played ? Math.round(e.won/e.played*100) : 0;
        return e;
    }).sort((a,b)=> b.played-a.played || b.winPct-a.winPct);
}

function fmtSince(iso){
    if(!iso) return '—';
    const days = Math.floor((Date.now()-new Date(iso))/86400000);
    if(days<=0) return i2('hoy','today');
    if(days===1) return i2('ayer','yesterday');
    if(days<30) return i2(`hace ${days} d`,`${days} d ago`);
    const months=Math.floor(days/30);
    return i2(`hace ${months} mes${months>1?'es':''}`,`${months} mo ago`);
}

// ── Calcular métricas avanzadas de un partido ──
function calcMatchStats(match){
    const tot = match.totalPoints||0;
    const pA  = match.pointsWonA||0;
    const pB  = tot - pA;
    const gA  = match.gamesA||0;
    const gB  = match.gamesB||0;
    const gTot= (gA+gB)||1;
    // Serving stats (approx: saque cada 2 juegos)
    const srvGamesA = Math.ceil(gTot/2);
    const srvGamesB = Math.floor(gTot/2);
    const fDA = match.faults?.A?.doubleFault||0;
    const fDB = match.faults?.B?.doubleFault||0;
    // % puntos ganados
    const pctA = tot>0?Math.round(pA/tot*100):50;
    const pctB = 100-pctA;
    // Breaks (juegos ganados recibiendo ≈ si gana más juegos de los que debería sirviendo)
    const breaksA = Math.max(0, gA - Math.round(gTot*0.5));
    const breaksB = Math.max(0, gB - Math.round(gTot*0.5));
    // Service hold % (approx)
    const srvHoldA = srvGamesA>0?Math.round(Math.max(0,(srvGamesA-breaksB)/srvGamesA*100)):50;
    const srvHoldB = srvGamesB>0?Math.round(Math.max(0,(srvGamesB-breaksA)/srvGamesB*100)):50;
    // Break conversion %
    const brkConvA = (breaksA+breaksB)>0?Math.round(breaksA/(breaksA+breaksB)*100):50;
    const brkConvB = 100-brkConvA;
    // Efficiency
    const effA = Math.round((pctA + srvHoldA + brkConvA)/3);
    const effB = Math.round((pctB + srvHoldB + brkConvB)/3);
    // Performance index 0-100
    const idx = match.winner??(match.setsA>match.setsB?'A':'B');
    const perfA = Math.min(99,Math.max(1,Math.round((pctA*0.4+srvHoldA*0.3+brkConvA*0.3))));
    const perfB = Math.min(99,Math.max(1,Math.round((pctB*0.4+srvHoldB*0.3+brkConvB*0.3))));
    return { pctA,pctB,srvHoldA,srvHoldB,brkConvA,brkConvB,effA,effB,perfA,perfB,
             breaksA,breaksB,gA,gB,pA,pB,tot,fDA,fDB };
}

// ── AI Coach post-partido ──
async function generateAICoach(match){
    const k=getAIKey(aiProvider)||aiKey;
    if(!k) return null;
    const st=calcMatchStats(match);
    const winner=match.winner==='A'?match.teamA:match.teamB;
    const prompt=`You are an expert padel coach. Analyze this match and give concise coaching advice in ${currentLang().name}.

MATCH DATA:
- ${match.teamA} vs ${match.teamB}
- Result: Sets ${match.setsA}-${match.setsB} (${match.setsHistory.map(s=>s.a+'-'+s.b).join(', ')})
- Winner: ${winner}
- Points won: ${match.teamA} ${st.pA} (${st.pctA}%) vs ${match.teamB} ${st.pB} (${st.pctB}%)
- Service hold: ${match.teamA} ${st.srvHoldA}% vs ${match.teamB} ${st.srvHoldB}%
- Break conversion: ${match.teamA} ${st.brkConvA}% vs ${match.teamB} ${st.brkConvB}%
- Duration: ${formatTime(match.duration)}

Respond ONLY with this JSON (no markdown):
{"index":${st.perfA},"summary":"2-3 sentence coaching insight for ${match.teamA}","focus":"1 sentence on what to improve next match","rating":"${st.perfA>=75?'Excellent':st.perfA>=55?'Good':st.perfA>=40?'Average':'Needs work'}"}`;

    try{
        let raw='';
        if(aiProvider==='openai'){
            const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:prompt}],temperature:0.3,max_tokens:200})});
            const d=await r.json(); raw=d.choices?.[0]?.message?.content||'{}';
        } else {
            const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.3,maxOutputTokens:200}})});
            const d=await r.json(); raw=d.candidates?.[0]?.content?.parts?.[0]?.text||'{}';
        }
        const clean=raw.replace(/```json\s?|```/g,'').trim();
        const m=clean.match(/\{[\s\S]*?\}/);
        return m?JSON.parse(m[0]):null;
    }catch(e){ return null; }
}

        return `<div class="mb-1">
            <div class="text-[9px] font-bold uppercase tracking-widest px-1 mb-2" style="color:${mu}">${label}</div>

                const won=match.winner==='A';
                const d=new Date(match.date);
                const dateStr=d.getDate()+'/'+(d.getMonth()+1);
                const sets=match.setsHistory.map(s=>s.a+'-'+s.b).join(' · ');
                return `<div class="rounded-2xl p-3 mb-2 border" style="background:${su};border-color:${won?p+'20':bo}" onclick="showMatchDetail(${match.id})">
                    <div class="flex items-center justify-between mb-1.5">

    const esc=(x)=>String(x).replace(/'/g,"\\'");

    <div class="flex flex-col items-center justify-center py-16 gap-3">
        <span class="material-symbols-outlined text-[48px]" style="color:${mu}">group</span>
        <div class="text-sm font-bold" style="color:${mu}">${i2('Sin jugadores todavia','No players yet')}</div>
        <div class="text-xs text-center px-8" style="color:${mu}">${i2('Pon los nombres de los jugadores al montar el partido y apareceran aqui','Add player names when setting up a match and they will show up here')}</div>
    </div>` : players.map((pl,k)=>`
        <div class="rounded-2xl p-3 mb-2 flex items-center gap-3 scale-press" style="background:${su}" onclick="showPlayerDetail('${esc(pl.name)}')">

            <div class="flex-1 min-w-0">
                <div class="text-xs font-black truncate" style="color:${te}">${pl.name}</div>
                <div class="text-[9px]" style="color:${mu}">${pl.played} ${i2('partidos','matches')} · ${pl.won}${i2('V','W')}-${pl.lost}${i2('D','L')} · ${fmtSince(pl.last)}</div>
            </div>
            ${pl.streak>1?`<span class="text-[9px] font-black px-1.5 py-0.5 rounded-full" style="background:${pl.streakType==='W'?p+'18':'rgba(255,113,108,0.12)'};color:${pl.streakType==='W'?p:'#ff716c'}">${pl.streakType==='W'?'🔥':'❄'}${pl.streak}</span>`:''}

                <div class="text-sm font-black" style="color:${pl.winPct>=50?p:mu}">${pl.winPct}%</div>

    // ── Ranking de parejas ──
    const pairCards = pairs.length===0 ? `
    <div class="flex flex-col items-center justify-center py-16 gap-3">
        <span class="material-symbols-outlined text-[48px]" style="color:${mu}">groups</span>
        <div class="text-sm font-bold" style="color:${mu}">${i2('Sin parejas todavia','No pairs yet')}</div>

            <div class="w-7 text-center text-lg">${medal(k)}</div>

                <div class="text-xs font-black truncate" style="color:${te}">${pr.name}</div>

function showMatchDetail(id){
    const hist=getMatchHistory();
    const match=hist.find(m=>m.id===id);
    if(!match) return;
    const st=calcMatchStats(match);
    const p=tc.primary(), mu=tc.muted(), su=tc.surf(), te=tc.text(), er=tc.error?.()??'#ff716c';

    const el=document.createElement('div');
    el.id='match-detail-modal';
    el.style.cssText='position:fixed;inset:0;z-index:300;overflow-y:auto;background:#0a0a0a;';

    const statRow=(label,vA,vB,higherIsBetter=true)=>{
        const numA=parseFloat(vA), numB=parseFloat(vB);
        const winA=higherIsBetter?numA>=numB:numA<=numB;
        return `<div class="flex items-center gap-2 py-2" style="border-bottom:1px solid rgba(255,255,255,0.04)">
            <span class="text-[11px] font-black w-12 text-right" style="color:${winA?p:mu}">${vA}</span>
            <div class="flex-1 flex items-center gap-1">
                <div style="flex:${numA};height:4px;border-radius:2px;background:${p};opacity:${winA?1:0.4}"></div>
                <span class="text-[9px] font-bold uppercase tracking-wider text-center px-1" style="color:${mu};min-width:80px">${label}</span>
                <div style="flex:${numB};height:4px;border-radius:2px;background:#e07b39;opacity:${!winA?1:0.4}"></div>
            </div>
            <span class="text-[11px] font-black w-12" style="color:${!winA?'#e07b39':mu}">${vB}</span>
        </div>`;
    };

    const d=new Date(match.date);
    const dateStr=d.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

    el.innerHTML=`
    <div class="w-full max-w-md mx-auto pb-8">
        <!-- Header -->
        <div class="flex items-center gap-3 px-4 pt-0 pb-3">
            <button onclick="document.getElementById('match-detail-modal').remove();" class="p-2 rounded-xl" style="background:rgba(255,255,255,0.06)">
                <span class="material-symbols-outlined text-[20px]" style="color:${mu}">arrow_back</span>
            </button>
            <span class="font-black text-base" style="color:${te}">Detalle del Partido</span>
        </div>

        <!-- Result card -->
        <div class="mx-4 rounded-3xl p-4 mb-3" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)">
            <div class="text-[9px] font-bold uppercase tracking-widest mb-3" style="color:${mu}">${dateStr}</div>
            <div class="flex items-center justify-between mb-3">
                <div class="flex-1 text-center">
                    <div class="font-black text-sm" style="color:${match.winner==='A'?p:te}">${match.teamA}</div>
                    ${match.playerA1?`<div class="text-[9px]" style="color:${mu}">${[match.playerA1,match.playerA2].filter(Boolean).join(' / ')}</div>`:''}
                </div>
                <div class="flex flex-col items-center px-4">
                    <div class="font-black text-3xl" style="color:${te}">${match.setsA}<span style="color:${mu}"> - </span>${match.setsB}</div>
                    <div class="text-[9px]" style="color:${mu}">${match.setsHistory.map(s=>s.a+'-'+s.b).join(' · ')}</div>
                    <div class="text-[9px] mt-1" style="color:${mu}">⏱ ${formatTime(match.duration)}</div>
                </div>
                <div class="flex-1 text-center">
                    <div class="font-black text-sm" style="color:${match.winner==='B'?'#e07b39':te}">${match.teamB}</div>
                    ${match.playerB1?`<div class="text-[9px]" style="color:${mu}">${[match.playerB1,match.playerB2].filter(Boolean).join(' / ')}</div>`:''}
                </div>
            </div>
        </div>

        <!-- AI Coach (async) -->
        <div id="ai-coach-card" class="mx-4 rounded-3xl p-4 mb-3" style="background:rgba(255,255,255,0.03);border:1px solid ${p}30">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-[12px]">🤖</span>
                <span class="text-[11px] font-black uppercase tracking-wider" style="color:${p}">Entrenador IA</span>
                ${(getAIKey(aiProvider)||aiKey)?'':'<span class="text-[9px] ml-auto" style="color:'+mu+'">Requiere API Key</span>'}
            </div>
            <div id="ai-coach-content">
                ${(getAIKey(aiProvider)||aiKey)?
                    `<div class="flex items-center gap-2 py-2"><div class="w-4 h-4 rounded-full border-2 border-t-transparent animate-spin" style="border-color:${p};border-top-color:transparent"></div><span class="text-[10px]" style="color:${mu}">Analizando partido...</span></div>`:
                    `<div class="text-[10px]" style="color:${mu}">Configura una API Key en Ajustes para obtener análisis IA de tus partidos.</div>`
                }
            </div>
        </div>

        <!-- Stats -->
        <div class="mx-4 rounded-3xl p-4 mb-3" style="background:rgba(255,255,255,0.04)">
            <div class="flex justify-between text-[10px] font-black uppercase mb-3">
                <span style="color:${p}">${match.teamA}</span>
                <span style="color:${mu}">Estadísticas</span>
                <span style="color:#e07b39">${match.teamB}</span>
            </div>
            ${statRow('% Puntos',st.pctA+'%',st.pctB+'%')}
            ${statRow('Juegos',st.gA,st.gB)}
            ${statRow('Hold Saque',st.srvHoldA+'%',st.srvHoldB+'%')}
            ${statRow('Break Conv.',st.brkConvA+'%',st.brkConvB+'%')}
            ${statRow('Breaks',st.breaksA,st.breaksB)}
            ${statRow('Dobles Faltas',st.fDA,st.fDB,false)}
            ${statRow('Índice Rendim.',st.perfA,st.perfB)}
        </div>

        <!-- Momentum chart -->
        ${match.momentum&&match.momentum.length?`
        <div class="mx-4 rounded-3xl p-4 mb-3" style="background:rgba(255,255,255,0.04)">
            <div class="text-[9px] font-bold uppercase tracking-widest mb-3" style="color:${mu}">Momentum del partido</div>
            <div class="flex gap-px items-end" style="height:40px">
                ${match.momentum.slice(-60).map(m=>`<div style="flex:1;border-radius:2px;height:${m.team==='A'?'100%':'50%'};background:${m.team==='A'?p:'#e07b39'};opacity:0.85"></div>`).join('')}
            </div>
            <div class="flex justify-between text-[8px] mt-1" style="color:${mu}">
                <span style="color:${p}">● ${match.teamA}</span>
                <span style="color:#e07b39">● ${match.teamB}</span>
            </div>
        </div>`:''}

        <!-- Actions -->
        <div class="mx-4 flex gap-2">
            <button onclick="shareMatch(${match.id},'whatsapp')" class="flex-1 py-3 rounded-2xl text-[11px] font-black uppercase scale-press" style="background:${p};color:#000">
                <span class="material-symbols-outlined text-[14px] align-middle">share</span> WhatsApp
            </button>
            <button onclick="shareMatch(${match.id})" class="py-3 px-4 rounded-2xl text-[11px] font-black uppercase scale-press" style="background:${su};color:${mu};border:1px solid rgba(255,255,255,0.06)">
                <span class="material-symbols-outlined text-[14px] align-middle">ios_share</span>
            </button>
            <button onclick="if(confirm('¿Eliminar este partido?')){deleteMatchFromHistory(${match.id});document.getElementById('match-detail-modal').remove();}" class="py-3 px-4 rounded-2xl text-[11px] font-black uppercase scale-press" style="background:rgba(255,113,108,0.1);color:#ff716c;border:1px solid rgba(255,113,108,0.2)">
                <span class="material-symbols-outlined text-[14px] align-middle">delete</span>
            </button>
        </div>
    </div>`;

    document.body.appendChild(el);

    // Load AI coach async
    if(getAIKey(aiProvider)||aiKey){
        generateAICoach(match).then(result=>{
            const cont=document.getElementById('ai-coach-content');
            if(!cont) return;
            if(!result){
                cont.innerHTML=`<div class="text-[10px]" style="color:${mu}">No se pudo generar el análisis. Verifica tu API Key.</div>`;
                return;
            }
            const idx=result.index||50;
            const color=idx>=70?p:idx>=50?'#f59e0b':'#e07b39';
            cont.innerHTML=`
            <div class="flex gap-3 items-start">
                <div class="flex-1">
                    <div class="text-[10px] leading-relaxed mb-2" style="color:${te}">${result.summary||''}</div>
                    ${result.focus?`<div class="text-[9px] p-2 rounded-xl mb-1" style="background:rgba(255,255,255,0.04);color:${mu}">🎯 ${result.focus}</div>`:''}
                    <div class="text-[9px] font-bold" style="color:${color}">${result.rating||''}</div>
                </div>
                <div class="flex flex-col items-center flex-shrink-0">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center font-black text-xl border-2" style="border-color:${color};color:${color}">${idx}</div>
                    <div class="text-[7px] font-bold uppercase mt-1" style="color:${mu}">ÍNDICE</div>
                </div>
            </div>`;
        });
    }
}

let toastTimeout;
function showToast(msg, dur=2000, isError=false){
    let el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
    el.style.cssText=`position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
        background:${isError?'#1a0000':'#1a1919'};
        border:1px solid ${isError?'#ff716c60':'#494847'};
        color:${isError?'#ff716c':tc.primary()};
        padding:8px 16px;border-radius:12px;font-size:12px;font-weight:700;
        z-index:150;white-space:nowrap;transition:opacity 0.3s;max-width:90vw;overflow:hidden;text-overflow:ellipsis;`;
    el.textContent=msg; el.style.opacity='1';
    clearTimeout(toastTimeout); toastTimeout=setTimeout(()=>{ el.style.opacity='0'; },dur);
}

function startNewMatch(){
    sessionStorage.setItem('pp_setup_done','1');
    const lang=S.lang||'es', theme=S.theme||'neon', bo=(S.bestOf===1||S.bestOf===3||S.bestOf===5)?S.bestOf:3;
    S=defaultState();
    S.lang=lang; S.theme=theme; S.bestOf=bo;
    S.currentView='home';
    initTeamNames();
    applyTheme();
    saveState();
    render();
    PPSync.sendSettings();
}

const StatsView=()=>{
    const totalPts = S.momentum.length;
    const ptsA = S.momentum.filter(m=>m.team==='A').length;
    const ptsB = totalPts - ptsA;
    const sA=S.setsHistory.filter(s=>s.winner==='A').length;
    const sB=S.setsHistory.filter(s=>s.winner==='B').length;
    const gA=S.setsHistory.reduce((a,s)=>a+s.a,0)+S.teamA.games;
    const gB=S.setsHistory.reduce((a,s)=>a+s.b,0)+S.teamB.games;
    const gTot=(gA+gB)||1;
    const pctA=totalPts>0?Math.round(ptsA/totalPts*100):50;
    const pctB=100-pctA;

    // Service hold (approx)
    const srvGamesA=Math.ceil(gTot/2), srvGamesB=Math.floor(gTot/2);
    const fDA=S.faults.A.doubleFault, fDB=S.faults.B.doubleFault;
    const breaksA=Math.max(0,gA-Math.round(gTot*0.5));
    const breaksB=Math.max(0,gB-Math.round(gTot*0.5));
    const srvHoldA=srvGamesA>0?Math.round(Math.max(0,(srvGamesA-breaksB)/srvGamesA*100)):50;
    const srvHoldB=srvGamesB>0?Math.round(Math.max(0,(srvGamesB-breaksA)/srvGamesB*100)):50;
    const brkConvA=(breaksA+breaksB)>0?Math.round(breaksA/(breaksA+breaksB)*100):50;
    const brkConvB=100-brkConvA;
    const effA=Math.round((pctA+srvHoldA+brkConvA)/3);
    const effB=Math.round((pctB+srvHoldB+brkConvB)/3);

    const p=tc.primary(), mu=tc.muted(), su=tc.surf2(), te=tc.text();

    const statRow=(label,vA,vB,higherIsBetter=true)=>{
        const numA=parseFloat(vA), numB=parseFloat(vB);
        const winA=higherIsBetter?numA>=numB:numA<=numB;
        return `<div class="flex items-center gap-2 py-2" style="border-bottom:1px solid rgba(255,255,255,0.04)">
            <span class="text-[11px] font-black w-10 text-right" style="color:${winA?p:mu}">${vA}</span>
            <div class="flex-1 flex items-center gap-1">
                <div style="flex:${numA||1};height:3px;border-radius:2px;background:${p};opacity:${winA?1:0.35}"></div>
                <span class="text-[8px] font-bold text-center px-1 flex-shrink-0" style="color:${mu};min-width:72px">${label}</span>
                <div style="flex:${numB||1};height:3px;border-radius:2px;background:#e07b39;opacity:${!winA?1:0.35}"></div>
            </div>
            <span class="text-[11px] font-black w-10" style="color:${!winA?'#e07b39':mu}">${vB}</span>
        </div>`;
    };

    // Momentum chart
    const last=S.momentum.slice(-50);
    const momentumHtml=last.length?`<div class="flex gap-px items-end" style="height:36px">${last.map(m=>`<div style="flex:1;border-radius:2px;height:${m.team==='A'?'100%':'50%'};background:${m.team==='A'?p:'#e07b39'};opacity:0.85"></div>`).join('')}</div>`:'<div class="text-[10px] text-center py-4" style="color:'+mu+'">—</div>';

    return `
<header class="px-4 pt-0 pb-3 flex items-center gap-3 flex-shrink-0 w-full max-w-4xl mx-auto">
    <button onclick="S.currentView='home';render();" class="p-2 rounded-xl scale-press"><span class="material-symbols-outlined text-on-surface-variant text-[20px]">arrow_back</span></button>
    <span class="text-on-surface font-bold text-base">${i('stats')}</span>
    <button onclick="shareResult();" class="ml-auto p-2 rounded-xl scale-press bg-surface-container border border-outline-variant/20"><span class="material-symbols-outlined text-on-surface-variant text-[18px]">share</span></button>
</header>
<div class="flex-1 scrollable px-4 pb-4 flex flex-col gap-3 w-full max-w-4xl mx-auto">

    <!-- Result header -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="flex items-center justify-between mb-3">
            <div class="text-center flex-1">
                <div class="font-black text-sm" style="color:${p}">${S.teamA.name}</div>
                ${(S.teamA.playerA||S.teamA.playerB)?`<div class="text-[8px]" style="color:${mu}">${[S.teamA.playerA,S.teamA.playerB].filter(Boolean).join(' / ')}</div>`:''}
            </div>
            <div class="text-center px-3">
                <div class="font-black text-2xl" style="color:${te}">${sA}<span style="color:${mu}"> – </span>${sB}</div>
                <div class="text-[9px]" style="color:${mu}">${S.setsHistory.map(s=>s.a+'-'+s.b).join(' · ')}</div>
                <div class="text-[9px] mt-1" style="color:${mu}">⏱ ${formatTime(S.gameTime)}</div>
            </div>
            <div class="text-center flex-1">
                <div class="font-black text-sm" style="color:#e07b39">${S.teamB.name}</div>
                ${(S.teamB.playerA||S.teamB.playerB)?`<div class="text-[8px]" style="color:${mu}">${[S.teamB.playerA,S.teamB.playerB].filter(Boolean).join(' / ')}</div>`:''}
            </div>
        </div>
    </div>

    <!-- Advanced stats -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="flex justify-between text-[10px] font-black uppercase mb-1" style="color:${mu}">
            <span style="color:${p}">${S.teamA.name}</span>
            <span>Estadísticas</span>
            <span style="color:#e07b39">${S.teamB.name}</span>
        </div>
        ${statRow('% Puntos',pctA+'%',pctB+'%')}
        ${statRow('Juegos',gA,gB)}
        ${statRow('Hold Saque',srvHoldA+'%',srvHoldB+'%')}
        ${statRow('Break Conv.',brkConvA+'%',brkConvB+'%')}
        ${statRow('Breaks',breaksA,breaksB)}
        ${statRow('Dobles Faltas',fDA,fDB,false)}
        ${statRow('Eficiencia',effA+'%',effB+'%')}
    </div>

    <!-- Momentum -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="text-[9px] font-bold uppercase tracking-widest mb-2" style="color:${mu}">Momentum</div>
        <div class="flex justify-between text-[8px] mb-1.5">
            <span style="color:${p}">● ${S.teamA.name} ${ptsA}pts</span>
            <span style="color:#e07b39">${ptsB}pts ${S.teamB.name} ●</span>
        </div>
        ${momentumHtml}
    </div>

    <!-- Per-set -->
    ${S.setsHistory.length?`<div class="rounded-3xl p-4" style="background:${su}">
        <div class="text-[9px] font-bold uppercase tracking-widest mb-3" style="color:${mu}">Por Set</div>
        ${S.setsHistory.map((s,idx)=>{
            const tot=(s.a+s.b)||1;
            return `<div class="mb-2">
                <div class="flex justify-between text-[9px] mb-1" style="color:${mu}">
                    <span>Set ${idx+1}${s.tiebreak?' (TB)':''}</span>
                    <span style="color:${s.winner==='A'?p:'#e07b39'}">${s.a}-${s.b}</span>
                </div>
                <div class="flex gap-1 h-1.5 rounded-full overflow-hidden">
                    <div style="width:${Math.round(s.a/tot*100)}%;background:${p};border-radius:3px"></div>
                    <div style="flex:1;background:#e07b39;opacity:0.6;border-radius:3px"></div>
                </div>
            </div>`;
        }).join('')}
    </div>`:''}

    <!-- Totals -->
    <div class="rounded-3xl p-4" style="background:${su}">
        <div class="text-[9px] font-bold uppercase tracking-widest mb-3" style="color:${mu}">Totales</div>
        <div class="grid grid-cols-2 gap-2">
            ${[[totalPts,'Puntos totales'],[formatTime(S.gameTime),'Duración'],
               [S.faults.A.doubleFault+'+'+S.faults.B.doubleFault,'Dobles faltas'],
               [S.calories>0?S.calories+'kcal':'-','Calorías']].map(([v,l])=>`
            <div class="rounded-2xl p-3" style="background:rgba(255,255,255,0.04)">
                <div class="text-base font-black" style="color:${p}">${v}</div>
                <div class="text-[8px] uppercase" style="color:${mu}">${l}</div>
            </div>`).join('')}
        </div>
    </div>

    <button onclick="shareResult();" class="w-full py-3 rounded-2xl border text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2" style="background:${su};border-color:rgba(255,255,255,0.06);color:${mu}">
        <span class="material-symbols-outlined text-[14px]">share</span>${i('shareResult')}
    </button>
</div>

${BottomNav('stats')}`;};

const ActivityView=()=>{
    const icons={game:'military_tech',set:'emoji_events',deuce:'balance',match:'trophy',fault:'warning'};
    const cols={game:'text-primary',set:'text-tertiary',deuce:'text-error',match:'text-primary',fault:'text-error'};
    const tA=S.teamA.name||'A', tB=S.teamB.name||'B';
    const label=(a)=>{
        const nm = a.team ? (a.team==='A'?tA:tB) : '';
        switch(a.type){
            case 'game':  return `Juego → ${nm} (${a.score?.gA??0}-${a.score?.gB??0})`;
            case 'set':   return `Set ${a.set} → ${nm}`;
            case 'deuce': return 'Deuce';
            case 'match': return `Partido → ${nm}`;
            case 'fault': return `Falta — ${nm}`;
            default:      return a.type;
        }
    };
    return `
<header class="px-4 pt-0 pb-3 flex items-center gap-3 flex-shrink-0 w-full max-w-4xl mx-auto">
    <button onclick="S.currentView='home';render();" class="p-2 rounded-xl scale-press">
        <span class="material-symbols-outlined text-on-surface-variant text-[20px]">arrow_back</span>
    </button>
    <span class="text-on-surface font-bold text-base">Actividad</span>
    ${S.activityLog.length?`<button onclick="S.activityLog=[];saveState();render();" class="ml-auto text-error text-[10px] font-bold uppercase px-3 py-1 rounded-lg" style="background:rgba(255,80,80,0.08)">Limpiar</button>`:''}
</header>
<div class="flex-1 scrollable px-4 pb-4 w-full max-w-4xl mx-auto">
    ${!S.activityLog.length
        ?`<div class="text-center py-16 text-on-surface-variant/40">
            <span class="material-symbols-outlined text-5xl block mb-3">list_alt</span>
            <span class="text-sm">${i('noHistory')}</span>
          </div>`
        :S.activityLog.map((a,idx)=>`
    <div class="flex items-center gap-3 py-2.5 ${idx<S.activityLog.length-1?'border-b border-white/5':''}">
        <div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-[15px] ${cols[a.type]||'text-on-surface-variant'} filled">${icons[a.type]||'circle'}</span>
        </div>
        <div class="flex-1 min-w-0">
            <div class="text-[11px] font-bold text-on-surface truncate">${label(a)}</div>
            <div class="text-[9px] text-on-surface-variant">Set ${a.set??'—'} · ${a.time??'—'}</div>
        </div>
    </div>`).join('')}
</div>

${BottomNav('activity')}`;
};

                ${['A','B'].map(t=>`<button onclick="S.serving='${t}';saveState();PPSync.onLocalAction('serve','${t}');render();" class="px-3 py-1.5 rounded-xl text-[10px] font-black uppercase scale-press truncate max-w-[92px] ${S.serving===t?'bg-primary-container text-on-primary':'bg-surface-container-high text-on-surface-variant'}" title="${S['team'+t].name}">${S['team'+t].name}</button>`).join('')}

    <div class="bg-surface-container rounded-3xl p-4">

            <div class="flex items-center gap-3"><span class="material-symbols-outlined text-[18px] text-on-surface-variant filled">${S.soundEnabled?'volume_up':'volume_off'}</span><span class="text-sm font-bold text-on-surface">${i('sound')}</span></div>
            <button onclick="S.soundEnabled=!S.soundEnabled;saveState();render();" class="scale-press"><span class="material-symbols-outlined text-[28px] ${S.soundEnabled?'text-primary filled':'text-outline'}">${S.soundEnabled?'toggle_on':'toggle_off'}</span></button>

            <input type="range" min="20" max="100" value="${S.brightness}" class="w-full" oninput="S.brightness=parseInt(this.value);document.documentElement.style.filter='brightness('+S.brightness/100+')';saveState();">

    </div>

    <div class="bg-surface-container rounded-3xl p-4">
        <div class="flex items-center justify-between mb-2">
            <span class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest">Voz + IA</span>
            <span class="bg-gradient-to-r from-primary to-[#00b3ff] text-black px-2 py-0.5 rounded-sm text-[8px] font-black uppercase tracking-widest shadow-lg pulse-glow object-contain">✨ PREMIUM FEATURE</span>
        </div>
        <div class="text-[10px] text-on-surface-variant leading-relaxed mb-3">
            <div class="text-[9px] leading-relaxed" style="color:${tc.muted()}">${i('voiceHint')}</div>
        </div>

        <!-- Árbitro IA Multi-proveedor -->
        <div class="rounded-2xl p-3 mb-2 border" style="background:${tc.surf2()};border-color:${aiKey?tc.primary()+'30':'rgba(255,255,255,0.06)'}">
            <div class="flex items-center gap-2 mb-3">
                <span style="font-size:16px">🤖</span>
                <span class="text-sm font-black" style="color:${tc.text()}">${i('referee')}</span>
                <div class="w-2 h-2 rounded-full ml-auto ${aiKey?'animate-pulse-slow':'opacity-20'}" style="background:${aiKey?tc.primary():'#555'}"></div>
            </div>

            <!-- Selector de proveedor -->
            <div class="grid grid-cols-3 gap-1.5 mb-3">
                ${Object.entries(AI_PROVIDERS).map(([id,p])=>`
                <button onclick="setAIProvider('${id}');"
                    class="flex flex-col items-center py-2 rounded-xl border scale-press"
                    style="background:${aiProvider===id?tc.primary()+'18':'transparent'};border-color:${aiProvider===id?tc.primary():'rgba(255,255,255,0.06)'}">
                    <span style="font-size:16px">${p.emoji}</span>
                    <span style="font-size:9px;font-weight:700;color:${aiProvider===id?tc.primary():tc.muted()};text-transform:uppercase;">${p.name}</span>
                    <span style="font-size:7px;color:${tc.muted()}">${p.free}</span>
                </button>`).join('')}
            </div>

            <!-- API Key del proveedor activo -->
            <div class="mb-2">
                <div class="text-[9px] mb-1.5" style="color:${tc.muted()}">
                    ${AI_PROVIDERS[aiProvider].name} API Key —
                    <span style="color:${tc.primary()}">${AI_PROVIDERS[aiProvider].hint}</span>
                </div>
                <div class="flex gap-2">
                    <input type="password" id="ai-key-input"
                        value="${aiKey}"
                        placeholder="${AI_PROVIDERS[aiProvider].placeholder}"
                        oninput="setAIKey('${aiProvider}',this.value.trim());aiKey=this.value.trim();render();"
                        class="flex-1 rounded-xl px-3 py-2 text-[11px] font-mono border"
                        style="background:${tc.surf()};border-color:${aiKey?tc.primary()+'50':tc.border()};color:${tc.text()};-webkit-user-select:text;user-select:text;outline:none;">
                    <button onclick="const inp=document.getElementById('ai-key-input');inp.type=inp.type==='password'?'text':'password';"
                        class="px-3 rounded-xl border scale-press"
                        style="background:${tc.surf()};border-color:${tc.border()};color:${tc.muted()}">
                        <span class="material-symbols-outlined text-[16px]">visibility</span>
                    </button>
                </div>
                ${aiKey
                    ? `<div class="flex items-center gap-2 mt-1.5">
                        <div class="text-[9px] font-bold" style="color:${tc.primary()}">✓ ${AI_PROVIDERS[aiProvider].name} listo</div>
                        <button onclick="testAI();" class="ml-auto text-[9px] font-black uppercase px-2 py-1 rounded-lg scale-press border" style="border-color:${tc.primary()}40;color:${tc.primary()}">Probar</button>
                       </div>`
                    : `<div class="text-[9px] mt-1.5" style="color:${tc.muted()}">Sin key: voz con reglas locales básicas.</div>`
                }
            </div>

            ${aiKey ? `
            <div class="flex items-center justify-between pt-2" style="border-top:1px solid rgba(255,255,255,0.05)">
                <span class="text-[9px]" style="color:${tc.muted()}">${i('aiHint')}</span>
                <button onclick="aiEnabled=!aiEnabled;render();" class="scale-press">
                    <span class="material-symbols-outlined text-[24px] ${aiEnabled?'filled':''}"
                        style="color:${aiEnabled?tc.primary():'#555'}">${aiEnabled?'toggle_on':'toggle_off'}</span>
                </button>
            </div>` : ''}
        </div>

        <button onclick="toggleVoice();" class="mt-1 w-full py-3 rounded-2xl text-[11px] font-black uppercase scale-press ${S.voiceActive?'bg-error/10 border border-error/30 text-error mic-active':'bg-surface-container-high border border-outline-variant/20 text-on-surface'}">
            <span class="material-symbols-outlined text-[14px] align-middle mr-1 filled">${S.voiceActive?'mic_off':'mic'}</span>${S.voiceActive?i('voiceOff'):i('voiceOn')}
        </button>
    </div>

    <div class="bg-surface-container rounded-3xl p-4">
        <div class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest mb-3">Tiempo de Saque (Doble Falta Automática)</div>
        <div class="flex items-center justify-between mb-4">
            <div class="text-[11px] text-on-surface">Activar penalización por tiempo</div>
            <button onclick="S.serveTimerEnabled=!S.serveTimerEnabled;render();saveState();" class="scale-press">
                <span class="material-symbols-outlined text-[24px] ${S.serveTimerEnabled?'filled':''}" style="color:${S.serveTimerEnabled?tc.primary():'#555'}">${S.serveTimerEnabled?'toggle_on':'toggle_off'}</span>
            </button>
        </div>
        <div class="flex items-center justify-between transition-opacity" style="opacity:${S.serveTimerEnabled?'1':'0.5'};pointer-events:${S.serveTimerEnabled?'auto':'none'}">
            <div class="text-[11px] text-on-surface">Segundos de límite: <span class="font-bold ml-1" style="color:${tc.primary()}">${S.serveTimerSeconds}s</span></div>
            <div class="flex items-center gap-2">
                <button onclick="if(S.serveTimerSeconds>5){S.serveTimerSeconds-=5;render();saveState();}" class="w-8 h-8 rounded-full flex items-center justify-center scale-press" style="background:${tc.surf2()}"><span class="material-symbols-outlined text-[16px]">remove</span></button>
                <button onclick="if(S.serveTimerSeconds<60){S.serveTimerSeconds+=5;render();saveState();}" class="w-8 h-8 rounded-full flex items-center justify-center scale-press" style="background:${tc.surf2()}"><span class="material-symbols-outlined text-[16px]">add</span></button>
            </div>
        </div>
    </div>

    <div class="flex flex-col gap-2">
        <button onclick="undoPoint();" class="w-full py-3 rounded-2xl bg-surface-container border border-outline-variant/20 text-on-surface text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[14px]">undo</span>${i('undo')} último punto</button>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="newMatch();" class="py-3 rounded-2xl bg-primary/10 border border-primary/20 text-primary text-[11px] font-black uppercase scale-press flex items-center justify-center gap-1"><span class="material-symbols-outlined text-[14px]">add</span>${i('newMatch')} partida</button>
            <button onclick="endMatch();" class="py-3 rounded-2xl bg-surface-container border border-outline-variant/20 text-on-surface-variant text-[11px] font-black uppercase scale-press flex items-center justify-center gap-1"><span class="material-symbols-outlined text-[14px]">flag</span>${i('end')}alizar</button>
        </div>
        <button onclick="resetMatch();" class="w-full py-3 rounded-2xl bg-error/10 border border-error/20 text-error text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[14px]">restart_alt</span>${i('reset')}</button>
        <button onclick="if(confirm('¿Limpiar TODO el estado guardado? Útil si el marcador está bloqueado.')){localStorage.removeItem('pp_state_v4');localStorage.removeItem('pp_state_v3');location.reload();}"
            class="w-full py-3 rounded-2xl text-[11px] font-black uppercase scale-press flex items-center justify-center gap-2"
            style="background:rgba(255,80,80,0.06);border:1px solid rgba(255,80,80,0.15);color:rgba(255,80,80,0.7)">
            <span class="material-symbols-outlined text-[14px]">delete_sweep</span>Limpiar estado (si marcador bloqueado)
        </button>
    </div>
</div>

${BottomNav('settings')}`;

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
let _lastView = null;
function render(){
    const app=document.getElementById('app');
    const scrollEl = app.querySelector('.scrollable');
    const saveScroll = (scrollEl && _lastView === S.currentView) ? scrollEl.scrollTop : 0;

    app.className='watch-frame font-body';
    applyTheme(S.theme||'neon');
    const ba = document.getElementById('blob-a');
    const bb = document.getElementById('blob-b');
    if(ba) ba.style.background = S.serving==='A' ? tc.sa() : tc.si();
    if(bb) bb.style.background = S.serving==='B' ? tc.sa() : tc.si();
    try {
        switch(S.currentView){
            case 'auth':     app.innerHTML=AuthView(); break;
            case 'setup':    app.innerHTML=SetupView(); break;
            case 'home':     app.innerHTML=HomeView(); break;
            case 'faults':   app.innerHTML=FaultsView(); break;
            case 'stats':    app.innerHTML=StatsView(); break;
            case 'history':  app.innerHTML=HistoryView(); break;
            case 'activity': app.innerHTML=ActivityView(); break;
            case 'settings': app.innerHTML=SettingsView(); break;
            default:         app.innerHTML=HomeView();
        }
    } catch(viewErr) {
        console.error('PadelPulse render error:', viewErr);
        if(S.currentView !== 'home') {
            S.currentView = 'home';
            try { app.innerHTML = HomeView(); } catch(e2) {
                app.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0e0e0e;color:#fff;gap:16px;padding:24px;text-align:center"><span style="font-size:48px">🎾</span><div style="font-weight:900;font-size:18px">Error al cargar</div><button onclick="S.currentView=\'home\';render();" style="padding:12px 24px;background:#00fd87;color:#000;font-weight:900;border:none;border-radius:14px;font-size:14px;cursor:pointer">Reintentar</button></div>';
            }
        }
    }
    
    paintIcons(app);
    _lastView = S.currentView;
    const newScroll = app.querySelector('.scrollable');
    if(newScroll && saveScroll > 0) newScroll.scrollTop = saveScroll;

    if(S.brightness!==100) document.documentElement.style.filter=`brightness(${S.brightness/100})`;
    // Spectator: disable all interactive buttons except nav
    if(SPECTATOR){
        document.querySelectorAll('button').forEach(b=>{
            const txt = b.textContent.trim();
            const isNav = b.closest('nav') || b.closest('header');
            // La navegacion se identifica por estructura (nav/header), no por texto: funciona en los 9 idiomas
            if(!isNav) b.style.pointerEvents='none';
        });
    }
}

startTimer();

// ── SPLASH SCREEN ──────────────────────
function showSplash(){
    const app=document.getElementById('app');
    app.className='watch-frame';
    app.style.background='#000';
    const themeColor = (THEMES[S.theme||'neon']||THEMES.neon).primary;
    const glowColor  = (THEMES[S.theme||'neon']||THEMES.neon).primaryGlow;
    app.innerHTML=`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:0;">
            <div class="splash-in" style="display:flex;flex-direction:column;align-items:center;width:100%;">
                <div style="position:relative;display:flex;align-items:center;justify-content:center;width:100%;padding:0 24px;">
                    <div style="position:absolute;width:260px;height:260px;border-radius:50%;
                        background:radial-gradient(circle,${glowColor} 0%,transparent 70%);
                        animation:splashPulse 1.8s ease infinite;pointer-events:none;"></div>
                    <img src="${LOGO_BASE64}" alt="PadelPulse Live"
                        style="width:100%;max-width:400px;height:auto;object-fit:contain;
                               mix-blend-mode:screen;
                               image-rendering:-webkit-optimize-contrast;
                               image-rendering:crisp-edges;position:relative;z-index:1;"
                        id="splash-logo">
                </div>

                <!-- Barra de carga -->
                <div style="width:220px;margin-top:32px;">
                    <!-- Track -->
                    <div style="width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;">
                        <div id="splash-bar"
                            style="height:100%;width:0%;border-radius:4px;
                                   background:${themeColor};
                                   box-shadow:0 0 8px ${glowColor};
                                   transition:width 0.1s linear;">
                        </div>
                    </div>
                    <!-- Porcentaje -->
                    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-family:'Lexend',sans-serif;font-size:10px;font-weight:700;
                                     color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;">
                            ${i('loading')}
                        </span>
                        <span id="splash-pct"
                            style="font-family:'Lexend',sans-serif;font-size:13px;font-weight:900;
                                   color:${themeColor};letter-spacing:0.5px;">
                            0%
                        </span>
                    </div>
                </div>
            </div>
        </div>`;

    // Animación de la barra — 3000ms totales
    // Sube rápido al inicio y se frena al final (sensación real de carga)
    const bar = document.getElementById('splash-bar');
    const pct = document.getElementById('splash-pct');
    const DURATION = 2800;
    const START = Date.now();

    function easeOut(t){ return 1 - Math.pow(1-t, 2.5); }

    const tick = setInterval(()=>{
        const elapsed = Date.now() - START;
        const t = Math.min(elapsed / DURATION, 1);
        const val = Math.round(easeOut(t) * 100);
        if(bar) bar.style.width = val + '%';
        if(pct) pct.textContent = val + '%';
        if(t >= 1) clearInterval(tick);
    }, 30);

    // Fade out
    setTimeout(()=>{
        const wrap = app.querySelector('.splash-in');
        if(wrap){ wrap.classList.remove('splash-in'); wrap.classList.add('splash-out'); }
    }, 2700);

    setTimeout(()=>{
        clearInterval(tick);
        app.style.background='';
        render();
    }, 3100);
}

/**
 * Pantalla de arranque.
 *
 * La cuenta va antes que nada: o entras, o creas una, o sigues sin ella.
 * Se decide aqui -y no arriba, junto al estado- porque `Auth` se define mas
 * abajo en el archivo y leerlo antes revienta la carga entera.
 * El modo espectador (enlace compartido) nunca pide cuenta.
 */
Auth.load();
if (!SPECTATOR) {
    if (!Auth.isIn && !authWasSkipped()) {
        S.currentView = 'auth';
    } else if (!sessionStorage.getItem('pp_setup_done')) {
        S.currentView = 'setup';
    }
}

// Iniciar app al cargar DOM (Tailwind no es bloqueante)
if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', showSplash);
} else {
    showSplash();
}

// Arranque de la sincronizacion con el reloj
window.addEventListener('load', () => {
    PPSync.init();
    // Si hay sesion, ponerse al dia en segundo plano sin molestar
    if (Auth.isIn) setTimeout(()=>Auth.syncNow(true).catch(()=>{}), 2500);
    setTimeout(()=>{
        PPSync.hello();
        if(PPSync.paired){ PPSync.sendSettings(); PPSync.push(); }
    }, 900);
    // Latido: mantiene vivo el estado de conexion aunque no pase nada en pista
    setInterval(()=>{
        const b = PPSync.bridge;
        if(b && b.refreshConnection) b.refreshConnection();
        PPSync.hello();
    }, 30000);
});

</script>
